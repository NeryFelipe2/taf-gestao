<style>

    if(h.prop!=null&&/^\d{1,15}$/.test(String(h.prop)))x.prop=Number(h.prop);if(h.fora===true)x.fora=true;return x});

  const key=o=>parseInt(String(o.id||'').replace(/\D/g,'').slice(0,13))||0;

/* ============ MODO CHAVE: o ERP dentro do site taf-gestao ============
   Entra com a mesma chave do site; lê e grava só pelas funções taf_erp_* do banco (nada direto nas tabelas).
   A chave fica só neste aparelho. Papel: fixo na chave pessoal; com a chave geral do site, escolhido na tela.
   Os dados fixos de cada obra (EAP, pacotes, metas, extrato, ficha) vêm do banco em gzip, nunca do código público. */
const CH={chave:'',quem:'',fixo:false,leitura:false,ver:0,obras:[],T:{}};
const CHK='taf-erp-chave',CHQ='taf-erp-quem',CHP='taf-erp-papel';
/* [integração] marca do Sair (como o taf-ciclo-sem-site e o taf-marko-sem-site): depois de Sair, o ERP não entra sozinho com a chave
   geral guardada pelo Centro, nem com a do Ciclo ou do Marko fora de um link deles. Sai quando a pessoa digita uma chave aqui. */
const CHS='taf-erp-sem-site';
const chLs=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null};
async function chRpc(fn,body){
  const r=await fetch(CFG.supabaseUrl+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.supabaseKey,Authorization:'Bearer '+CFG.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){j=tx}
  if(!r.ok){const e=new Error((j&&j.message)||tx||('erro '+r.status));e.status=r.status;throw e}return j}
const chMsg=e=>{const m=String(e&&e.message||e);return /CHAVE INVALIDA/.test(m)?'Chave inválida.':/SEM ACESSO A OBRA/.test(m)?'Esta chave não abre esta obra.':
  /CHAVE SO DE LEITURA/.test(m)?'Chave só de leitura: nada foi salvo.':/INFORME SEU NOME/.test(m)?'Informe seu nome antes de lançar.':m};
const chMotivo=m=>{const s=String(m||'');let x;if(x=s.match(/^PAPEL (\w+) NAO GRAVA (\w+)$/))return 'o papel '+((ROLES[x[1].toLowerCase()]||{}).n||x[1])+' não grava este tipo de registro';
  if(x=s.match(/^COMPETENCIA (\S+) FECHADA$/))return 'competência '+x[1].split('-').reverse().join('/')+' fechada';if(/REABRE/.test(s))return 'só a Diretoria reabre competência';return s.toLowerCase()};
const chArgs=o=>({p_chave:CH.chave,p_obra:SB.obraId,p_quem:CH.quem||null,...o});

/* ---------- dados fixos da obra (gzip+base64 no banco, guardados no aparelho pela impressão) ---------- */
async function chGunzip(b64){const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const st=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(st).text())}
const chShaGuardado=cod=>{try{const c=JSON.parse(chLs('taf-erp-base-'+cod)||'null');return c&&c.gz?c.sha:null}catch(e){return null}};
function chUsaBase(cod,b){window.TAF_OBRAS=window.TAF_OBRAS||{};window.TAF_OBRAS[cod]=b.D;
  window.TAF_EXTRATO=window.TAF_EXTRATO||{};if(b.extrato)window.TAF_EXTRATO[cod]=b.extrato;else delete window.TAF_EXTRATO[cod];
  if(b.ficha)FICHA_PAD[cod]=b.ficha;
  if(b.listas)Object.entries(b.listas).forEach(([k,v])=>{const l=CAD_LISTAS[k];if(Array.isArray(l))(v||[]).forEach(x=>{if(!l.includes(x))l.push(x)})})}
async function chBaseDe(cod,r){let gz=r&&r.base_gz;
  if(!gz){try{const c=JSON.parse(chLs('taf-erp-base-'+cod)||'null');if(c&&c.sha===r.base_sha)gz=c.gz}catch(e){}}
  else chLs('taf-erp-base-'+cod,JSON.stringify({sha:r.base_sha,gz}));
  if(!gz)throw new Error('A obra '+cod+' ainda não tem dados no banco.');
  let b=await chGunzip(gz);
  /* base gravada pela tela (marca "tela:" posta pelo banco em taf_erp_base_gravar): só entra pela lista fechada de campos (53_obra_nova.js) */
  if(/^tela:/.test(String(r&&r.base_sha||''))){if(typeof obnLimpaBase!=='function')throw new Error('A obra '+cod+' foi gravada pela tela e este ERP não abre com segurança. Atualize a página.');b=obnLimpaBase(b,cod)}
  chUsaBase(cod,b);return b}
const chPB={};
async function chObraData(cod){if(window.TAF_OBRAS&&window.TAF_OBRAS[cod])return window.TAF_OBRAS[cod];
  if(!chPB[cod])chPB[cod]=chRpc('taf_erp_base',{p_chave:CH.chave,p_obra:cod,p_quem:CH.quem||null}).then(r=>chBaseDe(cod,r)).then(b=>b.D).finally(()=>{delete chPB[cod]});
  return chPB[cod]}

function chChaveInicial(){const de=new URLSearchParams(location.search).get('de'),semSite=chLs(CHS)==='1',site=semSite?null:chLs('taf-chave'),cc=chLs('taf-ciclo-chave')||(chLs('taf-ciclo-sem-site')==='1'?null:site),mk=chLs('taf-marko-chave')||site;

const poolKey=()=>'taf-erp-pool-'+SB.obraId;
async function chCarregar(ob){
  const cod=ob.codigo;SB.obraId=cod;SB.obraBase=cod;

  if(!CH.leitura)Object.keys(PX).forEach(k=>{if(!(SB.pool[k]||[]).length||SB.pool[k].length<5)chPool(k)});
  /* o extrato financeiro histórico da obra (quando existe na base) NÃO é lançado sozinho: só entra quando alguém conferir e mandar */

    if(!CH.linkFeito&&(pv||P.get('tarefa'))){CH.linkFeito=1;S.view=(pv&&vistaPermitida(pv))?pv:'rastro'}}
  render();chOutras();
}
/* estado das outras obras, só para ler (painel da carteira, RH, comparativo): nunca é gravado por aqui */
function chTDe(est,docs){const t={...novoT(),...(est&&Object.keys(est).length?estadoLimpo(est):{})},map=Object.fromEntries(DOCS.map(([k,tp])=>[tp,k]));
  DOCS.forEach(([k])=>t[k]=[]);(docs||[]).forEach(r=>{if(map[r.tipo])t[map[r.tipo]].push(r.dados)});return t}
async function chOutras(){const atual=SB.obraId;
  for(const o of CH.obras){if(o.codigo===atual)continue;
    try{const r=await chRpc('taf_erp_ler',{p_chave:CH.chave,p_obra:o.codigo,p_quem:CH.quem||null,p_base_sha:chShaGuardado(o.codigo)});CH.T[o.codigo]=chTDe(r.estado,r.docs)}catch(e){}}
  if(SB.obraId===atual)render()}
async function chRecarrega(){const r=await chRpc('taf_erp_ler',chArgs({p_base_sha:chShaGuardado(SB.obraId)}));aplicaDocs(r.estado,r.docs);CH.ver=r.versao}
function chDelta(est,docs){const map=Object.fromEntries(DOCS.map(([k,tp])=>[tp,k]));
  (docs||[]).forEach(r=>{const k=map[r.tipo];if(!k)return;const a=S.t[k]||(S.t[k]=[]);const i=a.findIndex(o=>o.id===r.id);if(i>=0)a[i]=r.dados;else a.unshift(r.dados);SB.sync[r.id]=JSON.stringify(r.dados)});
  if(est&&Object.keys(est).length)Object.assign(S.t,estadoLimpo(est));   /* [integração] versão e histórico só no formato da tela */
  if(S.D)prep();SB.estado=JSON.stringify(estadoObra())}
async function chPull(){if(!SB.obraId)return;
  const v=await chRpc('taf_erp_versao',{p_chave:CH.chave,p_obra:SB.obraId});if(+v===+CH.ver)return;
  const r=await chRpc('taf_erp_ler',chArgs({p_base_sha:chShaGuardado(SB.obraId),p_desde:CH.ver}));
  if(r.base_gz){await chCarregar(SB.obras.find(o=>o.codigo===SB.obraId)||{codigo:SB.obraId});return}
  chDelta(r.estado,r.docs);CH.ver=r.versao}

/* ---------- gravar: só o que mudou, em lotes; o banco confere papel e competência ---------- */
async function chSync(){
  if(SB.busy){sbSyncSoon();return}SB.busy=true;
  try{chLs(poolKey(),JSON.stringify(SB.pool||{}));
    const docs=sbDocs().filter(d=>{const j=JSON.stringify(d.dados);if(SB.sync[d.id]===j)return false;d._j=j;return true});
    const est=JSON.stringify(estadoObra()),estMudou=est!==SB.estado;
    if(!docs.length&&!estMudou)return;
    if(CH.leitura){toast('Chave só de leitura: nada foi salvo.');await chRecarrega();render();return}
    let rec=[],ign=false;
    for(let i=0;i<Math.max(docs.length,1);i+=200){const lote=docs.slice(i,i+200),comEst=i===0&&estMudou;
      if(!lote.length&&!comEst)break;
      const r=await chRpc('taf_erp_salvar',chArgs({p_papel:S.role,p_docs:lote.map(d=>({id:d.id,tipo:d.tipo,dados:d.dados})),p_estado:comEst?JSON.parse(est):null}));
      const bad=new Set((r.recusados||[]).map(x=>x.id));lote.forEach(d=>{if(!bad.has(d.id))SB.sync[d.id]=d._j});rec=rec.concat(r.recusados||[]);
      if(comEst){if(r.estado==='gravado')SB.estado=est;else ign=true}}
    try{localStorage.removeItem(filaKey())}catch(_){}
    if(rec.length||ign){toast(rec.length?'Não salvou '+rec.length+' registro(s): '+chMotivo(rec[0].motivo)+'.':'Linha de base e parâmetros só são salvos por Gestão, Diretoria ou Gerente.');await chRecarrega();render()}
  }catch(e){
    if(semRede(e)){const pend=sbDocs().filter(d=>SB.sync[d.id]!==JSON.stringify(d.dados));filaSalva(pend);toast('Sem sinal: '+pend.length+' registro(s) guardado(s) no aparelho. Sobem quando voltar a conexão.')}
    else{toast('Não salvou: '+chMsg(e));try{await chRecarrega();render()}catch(_){}}}
  finally{SB.busy=false}
}
async function chPool(k){if(!SB.obraId||CH.leitura)return;SB.poolBusy=SB.poolBusy||{};if(SB.poolBusy[k])return;SB.poolBusy[k]=1;
  try{const a=+(await chRpc('taf_erp_numeros',chArgs({p_tipo:k,p_qtd:20})));if(a){SB.pool=SB.pool||{};SB.pool[k]=[...(SB.pool[k]||[]),...Array.from({length:20},(_,i)=>a+i)];chLs(poolKey(),JSON.stringify(SB.pool))}}catch(e){}
  SB.poolBusy[k]=0}

function chViewLean(){return `<div class="head"><div><h1>Planejamento semanal</h1><p class="lead">O plano da semana, as restrições, as demandas para compras e o PPC da obra agora ficam no <b>Ciclo semanal</b> do site: o engenheiro preenche no celular e a gestão acompanha.</p></div></div>

if(MODO_CH){sbBoot=chBoot;sbSync=chSync;sbPull=chPull;sbPool=chPool;sbCarregar=chCarregar;sbSair=chSair;doLogin=chLoginForm;obraData=chObraData;viewLean=chViewLean;

/* ============ plano de contas ============ */
const MAT_PAC={FOFO:'4.2.01',PVC:'4.2.01',TCONC:'4.2.01',VALV:'4.2.02',PARAF:'4.2.08',ELET:'4.2.05',ELETS:'4.2.05',CONC:'4.2.04',ACO:'4.2.04',FORMA:'4.2.04',IMPER:'4.2.06',BOMBA:'4.2.07',GUIND:'4.2.07',CIVIL:'4.2.03'};
function contaPadrao(nat,pac){if(nat==='MO')return '4.1.01';if(nat==='EQP')return '4.3.01';if(nat==='TER')return '4.4.01';
  if(nat==='ADM')return pac==='CANT'?'4.5.02':pac==='PROJ'?'4.5.06':'4.5.01';return MAT_PAC[pac]||'4.2.08'}
const NATNOME={MO:'Mão de obra',MAT:'Material e equipamento',EQP:'Máquinas e veículos',TER:'Terceiros',ADM:'Indireto da obra'};
const nomeConta=c=>(S.D.plano||[]).find(x=>x.codigo===c)?.nome||c;
/* ============ motor de regras (espelha o SQL) ============ */
const byCod=()=>S.byCod;
const dominante=i=>{const n=i.natureza||{};const k=Object.keys(n).sort((a,b)=>n[b]-n[a])[0];
  if(n[k]>0)return k;return /material/.test(i.tipo||'')?'MAT':'TER'};
function prep(){
  const D=S.D;D.items=D.eap.filter(e=>e.tipo_linha==='item');
  D.items.forEach(i=>{if(!('_mu0' in i))i._mu0=i.meta_unit;   /* meta_unit como veio da carga, para a chave calc_v2 poder voltar atrás */
    const ov=S.t.baseOv&&S.t.baseOv[i.codigo];if(ov){i.meta_base=ov.meta_total;i.teto_total=ov.teto_total;i.status_cotacao=ov.status_cotacao;i.meta_unit=ov.meta_unit}else i.meta_base=i.meta_base??i.meta_total;if(S.t.metaOv[i.codigo]!=null)i.meta_total=S.t.metaOv[i.codigo];else i.meta_total=i.meta_base;i.nat=dominante(i);
    /* calc_v2 [SUPOSIÇÃO, plano M1]: o remanejamento grava só a meta do item; meta_unit passa a acompanhá-la (meta ÷ quantidade, mesma conta de 21_sync_planilha.js). Derivado na leitura: nada é regravado. */
    {const mu=calcV2(S.t)&&S.t.metaOv[i.codigo]!=null&&i.qtd>0?r2(i.meta_total/i.qtd*10000)/10000:(ov?ov.meta_unit:i._mu0);if(i.meta_unit!==mu)i.meta_unit=mu}});
  D.pacotes.forEach(p=>{const o=S.t.basePac&&S.t.basePac[p.codigo];if(o)Object.assign(p,o)});
  S.byCod=Object.fromEntries(D.eap.map(e=>[e.codigo,e]));
  D.items.forEach(i=>{i.linhas=i.composicao||[{nat:i.nat,share:1}]});
  D.pacotes.forEach(p=>p._it=D.items.filter(i=>i.pacote===p.codigo));
}
/* ---------- conta única de comprometido, realizado e saldo (M1) ----------

  D.pacotes.forEach(p=>{p._dias=diasAte(p.fechar_ate);p._cot=p._it.filter(i=>i.status_cotacao==='A cotar').length;p._pctCot=p._it.length?1-p._cot/p._it.length:1;
    p._semFolga=p._it.filter(i=>i.meta_total>i.teto_total).length;p._acima=p.meta>p.teto;
    p._meta=p._it.reduce((s,i)=>s+i.meta_total,0);p._comp=p._it.reduce((s,i)=>s+S.sd[i.codigo].comp,0);p._real=p._it.reduce((s,i)=>s+S.sd[i.codigo].real,0);
    /* M2 [SUPOSIÇÃO, plano 00-MATRIZ-E-PLANO]: teto do pacote = soma dos tetos dos itens. Com par.ev_agrega ligada o alerta "meta acima do teto" usa essa soma; desligada vale o teto fixo do pacote, como sempre.
       A soma só vale quando os itens do pacote têm meta E teto (pacSoma). Se nenhum item tem teto (ou meta) não há soma para mostrar: vale o cadastro do pacote, igual à chave desligada (antes saía R$ 0 e folga negativa). */
    p._teto=p._it.reduce((s,i)=>s+(+i.teto_total||0),0);p._temTeto=p._it.some(i=>i.teto_total!=null);p._temMeta=p._it.some(i=>i.meta_total!=null);
    if(pacSoma(p))p._acima=r2(p._meta)>r2(p._teto);

   amarelo = acima da meta, até o limite; vermelho = acima do limite, ou meta já acima do limite (sem folga: é o "meta acima do teto" que Pacotes, Alertas e Hoje já mostram

const evDe=i=>String(i.evento==null?'':i.evento).trim();

function doRemanejar(){
  const de=$('#rm-de').value,pa=$('#rm-para').value,v=r2($('#rm-v').value),m=$('#rm-m').value.trim(),msg=$('#rm-msg');
  const err=t=>{msg.innerHTML=`<span class="neg">${t}</span>`};
  if(de===pa)return err('Escolha itens diferentes.');if(!(v>0))return err('Informe o valor.');if(!m)return err('Motivo obrigatório.');
  const a=S.byCod[de],b=S.byCod[pa],sa=S.sd[de];
  if(a.meta_total-v<sa.comp+sa.real)return err('O item de origem não tem saldo livre suficiente ('+brl(sa.livre)+').');

function ctxItem(cod){
  const i=S.byCod[cod];if(!i)return '';const s=S.sd[cod]||{livre:0},p=(S.D.pacotes||[]).find(x=>x.codigo===pacDe(i));

  if(evCtrl()){   /* limite em três níveis: o saldo do pacote e do evento também aparece ao escolher o item; todos já descontam o que está reservado por pedidos aguardando aprovação */
    const ix=idxCtrl(),adj=ajusteCtrl({}),gp=ix.pac.get(pacDe(i)),ge=ix.ev.get(ix.modo==='grupo'?grupoRaiz(i):evDe(i));

function solGrava(s,total,sem){
  S.t.sols.unshift(s);log('solicitacao',s.num,'criada','',brl(total)+' · '+sem[0]);const volta=typeof rastroAposSol==='function'&&rastroAposSol(s);save();closeModal();toast(s.num+' enviada · '+sem[0]);if(!volta){S.view='compras';S.tab.compras='sols'}render();
}
function doSol(){
  const cod=$('#s-item').value,q=+$('#s-qtd').value,p=+$('#s-pu').value,desc=$('#s-desc').value.trim();
  if(!desc||!(q>0)||!(p>=0))return toast('Preencha descrição, quantidade e preço');
  if(ocLinhasLigada()||evCtrl())return doSolLinhas(desc);
  const sem=semaforo(cod,q*p);if(sem[0]==='bloqueado'){toast(sem[1]);return}
  const nat=$('#s-nat').value,s={id:'s'+Date.now(),num:nextNum('sol'),item:cod,nat,conta:contaPadrao(nat,S.byCod[cod].pacote),desc,ins:($('#s-ins')||{}).value||'',qtd:q,preco:p,data:$('#s-dt').value,mot:$('#s-mot').value,solicitante:user(),status:'enviada',sem:sem[0],cots:[],criado:hojeISO()};
  solGrava(s,q*p,sem);
}
/* oc_linhas ligada: a solicitação guarda linhas [{item, nat, conta, qtd, preco, valor}]; item/nat/conta/qtd/preco do documento seguem a primeira linha, como antes.
   De várias linhas: qtd=1 e preco=total (o pacote é uma unidade; a proposta do fornecedor é o valor total do pedido). */
function doSolLinhas(desc){
  const L=solLinhasForm().slice(0,ocLinhasLigada()?1e9:1),ins=($('#s-ins')||{}).value||'';
  for(const l of L.slice(1))if(!l.item||!(l.qtd>0)||!(l.preco>=0))return toast('Complete cada linha do pedido: item, quantidade e preço');
  if(L.length>1&&ins)return toast('Insumo do estoque só vale em pedido de uma linha');
  L.forEach(l=>{l.valor=r2(l.qtd*l.preco);l.conta=contaPadrao(l.nat,S.byCod[l.item].pacote)});
  const total=r2(L.reduce((a,l)=>a+l.valor,0)),sem=semaforoLinhas(L.map(l=>({item:l.item,valor:l.valor})));
  if(sem[0]==='bloqueado'){toast(sem[1]);return}
  const s={id:'s'+Date.now(),num:nextNum('sol'),item:L[0].item,nat:L[0].nat,conta:L[0].conta,desc,ins,qtd:L.length>1?1:L[0].qtd,preco:L.length>1?total:L[0].preco,data:$('#s-dt').value,mot:$('#s-mot').value,solicitante:user(),status:'enviada',sem:sem[0],cots:[],criado:hojeISO(),
    };
  if(ocLinhasLigada())s.linhas=L.map(l=>({item:l.item,nat:l.nat,conta:l.conta,qtd:l.qtd,preco:l.preco,valor:l.valor}));
  if(evCtrl())s.solicitanteId=usuarioId();   /* quem solicitou, por usuário (D4): a aprovação compara isto, não o nome */
  solGrava(s,total,sem);
}

/* meta, comprometido e realizado por conta. Comprometido e realizado vêm de contaObra() (05_motor_de_regras.js): a conta é uma só. */
function planoSaldos(){
  const C=contaObra(S.t),real={},comp={},meta={};
  C.real.forEach(({l,v})=>{const c=l.conta||contaPadrao(l.nat,S.byCod[l.item]?.pacote);real[c]=(real[c]||0)+v});
  C.lin.forEach(({conta,comp:v})=>{comp[conta]=(comp[conta]||0)+v});
  S.D.items.forEach(i=>i.linhas.forEach(l=>{const c=contaPadrao(l.nat,i.pacote);meta[c]=(meta[c]||0)+i.meta_total*l.share}));
  return {real,comp,meta}}
function viewPlano(X){
  const {real,comp,meta}=planoSaldos();
  const soma=(m,c)=>Object.entries(m).filter(([k])=>k===c||k.startsWith(c+'.')).reduce((s,[,v])=>s+v,0);
  const P=S.D.plano||[];
  return `<div class="head"><div><h1>Plano de contas</h1><p class="lead">Cada natureza da composição tem uma conta. Quem lança só escolhe o item: a conta vem do cadastro, em toda solicitação, OC e nota. A meta abaixo é a meta de cada item distribuída pela composição.</p></div></div>
  <div class="tw"><table class="tbl"><thead><tr><th>Código</th><th>Conta</th><th>Natureza</th><th class="r">Meta</th><th class="r">Comprometido</th><th class="r">Realizado</th><th>Consumo</th></tr></thead><tbody>${P.map(c=>{const m=soma(meta,c.codigo),co=soma(comp,c.codigo),r=soma(real,c.codigo);return `<tr class="${c.nivel<=2?'grp':''}"><td class="mono">${esc(c.codigo)}</td><td style="padding-left:${(c.nivel-1)*14+10}px">${esc(c.nome)}</td><td>${c.natureza?`<span class="pill mute">${esc(c.natureza)}</span>`:''}</td><td class="r">${m?brl(m):'—'}</td><td class="r">${co?brl(co):'—'}</td><td class="r">${r?brl(r):'—'}</td><td>${m?bar(co,r,m):''}</td></tr>`}).join('')}</tbody></table></div>`}

function atvPill(a){if(a.status==='cumprida')return '<span class="pill ok">Cumprida</span>';if(a.status==='nao_cumprida')return '<span class="pill bad">Não cumprida</span>';

function doRst(){const d=$('#r-desc').value.trim(),dono=$('#r-dono').value.trim();if(!d||!dono)return toast('Descreva e informe o dono');if(donoAb(dono)>=8)return toast(dono+' já tem 8 restrições abertas: resolva antes de abrir outra');

/* ============ FATURAMENTO, RECEBIMENTO, DRE E CAIXA (Fase 9) ============ */
const mesDe=s=>String(s||'').slice(0,7);
const addMes=(m,n)=>{const [y,x]=m.split('-').map(Number);const d=new Date(y,x-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const fmes=m=>{const [y,x]=m.split('-');return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+x-1]+'/'+y.slice(2)};
const puItem=i=>i.qtd?i.preco_venda_total/i.qtd:0;
const medValor=m=>m.qtd*puItem(S.byCod[m.item]||{qtd:0,preco_venda_total:0});
const medsLivres=()=>S.t.meds.filter(m=>m.status==='atestada'&&!m.bc);
const bcBruto=b=>r2(b.medIds.reduce((s,id)=>{const m=S.t.meds.find(x=>x.id===id);return s+(m?medValor(m):0)},0));
const bcTotal=b=>r2(bcBruto(b)*(1+(b.reajuste||0)/100));
const bcAprov=b=>b.valorAprovado!=null?b.valorAprovado:bcTotal(b);
const bcGlosa=b=>b.valorAprovado!=null?r2(Math.max(0,bcTotal(b)-b.valorAprovado)):0;
const fatLiq=f=>r2(f.valor*(1-(f.ret||0)/100));
const fatRec=f=>r2(S.t.recs.filter(r=>r.fat===f.id).reduce((s,r)=>s+r.valor,0));
const fatSaldo=f=>r2(Math.max(0,fatLiq(f)-fatRec(f)));
const BC_ST={rascunho:['mute','Rascunho'],enviado:['info','Enviado ao cliente'],aprovado:['warn','Aprovado, a faturar'],faturado:['ok','Faturado']};
/* realizado por conta: vem de contaObra() (05_motor_de_regras.js), a conta única; antes repetia o laço das notas aqui */
function realPorConta(){const real={};contaObra(S.t).real.forEach(({l,v})=>{const c=l.conta||contaPadrao(l.nat,S.byCod[l.item]?.pacote);real[c]=(real[c]||0)+v});return real}
function dre(){
  const trib=S.D.obra.tributos_nota,bcs=S.t.bcs.filter(b=>b.status==='aprovado'||b.status==='faturado');
  const bruto=bcs.reduce((s,b)=>s+bcBruto(b),0),reaj=bcs.reduce((s,b)=>s+r2(bcBruto(b)*(b.reajuste||0)/100),0),glosa=bcs.reduce((s,b)=>s+bcGlosa(b),0);
  const aprov=bcs.reduce((s,b)=>s+bcAprov(b),0),ded=r2(aprov*trib),liq=r2(aprov-ded);
  const real=realPorConta(),custoPorConta=Object.entries(real).sort(([a],[b])=>cmpCod(a,b));const custo=custoPorConta.reduce((s,[,v])=>s+v,0);
  return {bruto,reaj,glosa,aprov,ded,liq,custoPorConta,custo,resultado:r2(liq-custo),margem:liq>0?(liq-custo)/liq:null}}
function proxMeses(n0,n1){const m0=mesDe(hojeISO());return Array.from({length:n1-n0+1},(_,k)=>addMes(m0,n0+k))}
function caixa(){return memo('cx',caixaRaw)}
function caixaRaw(){
  const meses=proxMeses(-2,6),L={};meses.forEach(m=>L[m]={entP:0,entR:0,saiP:0,saiR:0,man:0});
  const put=(m,k,v)=>{if(L[m])L[m][k]+=v};
  S.t.fats.forEach(f=>{put(mesDe(f.venc),'entP',fatSaldo(f))});
  S.t.recs.forEach(r=>put(mesDe(r.data),'entR',r.valor));
  S.t.titulos.filter(t=>!t.cancelado).forEach(t=>{const i=tituloInfo(t);if(t.parcelas&&t.parcelas.length){let pg=i.pago;t.parcelas.forEach(q=>{const u=Math.min(pg,q.valor);pg=r2(pg-u);put(mesDe(q.venc),'saiP',r2(q.valor-u))})}else put(mesDe(t.venc),'saiP',i.saldo)});
  S.t.notas.filter(n=>n.status==='paga').forEach(n=>put(mesDe(n.pago),'saiR',n.valor));
  S.t.lans.forEach(l=>put(mesDe(l.data),'man',l.valor));
  let acc=0,minAcc=0;
  const rows=meses.map(m=>{const x=L[m],liq=x.entR+x.entP-x.saiR-x.saiP+x.man;acc+=liq;minAcc=Math.min(minAcc,acc);return {m,...x,liq,acc}});
  return {rows,minAcc}}
function svgCaixa(rows){

const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function xmlTxt(doc,tag){const e=doc.getElementsByTagName(tag)[0];return e?e.textContent.trim():''}
function parseNFe(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('XML inválido');
  const inf=doc.getElementsByTagName('infNFe')[0];if(!inf)throw new Error('Não é uma NF-e (sem infNFe)');
  const chave=(inf.getAttribute('Id')||'').replace(/\D/g,'');
  const emit=doc.getElementsByTagName('emit')[0],ide=doc.getElementsByTagName('ide')[0];
  const g=(p,t)=>{const e=p&&p.getElementsByTagName(t)[0];return e?e.textContent.trim():''};
  const dh=g(ide,'dhEmi')||g(ide,'dEmi');
  const itens=[...doc.getElementsByTagName('det')].map(d=>({desc:g(d,'xProd'),qtd:+g(d,'qCom')||0,valor:+g(d,'vProd')||0}));
  const v=+xmlTxt(doc,'vNF')||0;
  return {chave,num:g(ide,'nNF'),serie:g(ide,'serie'),emissao:dh.slice(0,10),emitente:g(emit,'xNome'),cnpj:g(emit,'CNPJ')||g(emit,'CPF'),valor:r2(v),itens,
    inss:r2(+xmlTxt(doc,'vRetPrev')||0),iss:r2(+xmlTxt(doc,'vISSRet')||+xmlTxt(doc,'vISS')||0)}}
function sugereOC(x){
  const ocs=S.t.ocs.filter(o=>OC_COMPROMETE.includes(o.status)&&norm(o.forn)&&(norm(x.emitente).includes(norm(o.forn))||norm(o.forn).includes(norm(x.emitente))));
  const bons=ocs.filter(o=>Math.abs(o.valor-x.valor)/Math.max(o.valor,1)<=S.t.par.tol);return bons.length===1?bons[0]:null}
function importaXmls(textos){
  const res={ok:[],dup:[],erro:[]};
  textos.forEach(([nome,t])=>{try{const x=parseNFe(t);
    if(x.chave&&S.t.notas.some(n=>n.chave===x.chave)){res.dup.push(nome+' (chave já lançada)');return}
    if(!(x.valor>0)){res.erro.push(nome+': sem valor');return}
    const o=sugereOC(x);
    const n={id:'n'+Date.now()+Math.random().toString(36).slice(2,5),num:nextNum('nf'),emitente:x.emitente,cnpj:x.cnpj,chave:x.chave||x.num,nfNum:x.num,valor:x.valor,emissao:x.emissao||hojeISO(),oc:o?o.id:'',ocNum:o?o.num:'',rateio:[],status:'lancada',origemXml:true,itensXml:x.itens,retInss:x.inss,retIss:x.iss,justSemOC:o?'':'Importada de XML sem pedido correspondente'};
    S.t.notas.unshift(n);log('nota_fiscal',n.num,'importada_xml','',x.emitente+' · '+brl(x.valor)+(o?' · sugerida '+o.num:''));res.ok.push(n.num+' '+x.emitente+' '+brl(x.valor)+(o?' → '+o.num:' (sem pedido)'))}

  save();return res}

const nOrNull=v=>{const n=typeof v==='number'?v:parseFloat(String(v??'').replace(/\./g,'').replace(',','.'));return Number.isFinite(n)?n:null};
async function linhasDaPlanilha(file){
  if(/\.json$/i.test(file.name)){const j=JSON.parse(await file.text());return {itens:(j.eap||[]).filter(e=>e.tipo_linha==='item'&&e.meta_total!=null).map(e=>({codigo:e.codigo,qtd:e.qtd,meta:e.meta_total,teto:e.teto_total,status:e.status_cotacao})),pacotes:(j.pacotes||[]).map(p=>({codigo:p.codigo,meta:p.meta,teto:p.teto,fechar_ate:p.fechar_ate}))}}
  const X=await carregaXlsx();const wb=X.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const aba=(pref)=>{const n=wb.SheetNames.find(x=>x.startsWith(pref));if(!n)throw new Error('Aba "'+pref+'" não encontrada. É o Estudo de Obra interno?');return X.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true})};
  const tabela=(rows,chave)=>{const h=rows.findIndex(r=>r&&r.includes(chave));if(h<0)throw new Error('Cabeçalho "'+chave+'" não encontrado');const cab=rows[h];return rows.slice(h+1).map(r=>Object.fromEntries(cab.map((c,k)=>[c,r[k]])))};
  const itens=tabela(aba('12.'),'Item').filter(r=>r['Item']).map(r=>({codigo:String(r['Item']).trim(),qtd:nOrNull(r['Qtd']),meta:nOrNull(r['Custo adotado'])??nOrNull(r['Meta custo total']),teto:nOrNull(r['Teto total (margem zero)']),status:r['Status']}));
  const dt=v=>v instanceof Date?v.toISOString().slice(0,10):null;
  const pacotes=tabela(aba('11.'),'Pacote').filter(r=>r['Pacote']&&r['Pacote']!=='TOTAL').map(r=>({codigo:r['Pacote'],meta:nOrNull(r['Meta de custo']),teto:nOrNull(r['Teto (margem zero)']),fechar_ate:dt(r['Fechar até'])}));

function calculaDiff(L){
  const dif=[],info={novos:[],semQtd:[]},seen=new Set();
  L.itens.forEach(r=>{const i=S.byCod[r.codigo];seen.add(r.codigo);
    if(!i||i.tipo_linha!=='item'){info.novos.push(r.codigo);return}
    if(r.qtd!=null&&i.qtd!=null&&Math.abs(r.qtd-i.qtd)>1e-6)info.semQtd.push(`${r.codigo}: planilha ${num(r.qtd)} × orçamento ${num(i.qtd)}`);
    const m=r.meta!=null?r2(r.meta):null,t=r.teto!=null?r2(r.teto):null,mudou=[];
    if(m!=null&&(i.meta_base==null||Math.abs(m-i.meta_base)>0.005))mudou.push(['Meta',i.meta_base,m]);
    if(t!=null&&(i.teto_total==null||Math.abs(t-i.teto_total)>0.005))mudou.push(['Teto',i.teto_total,t]);
    if(r.status&&r.status!==i.status_cotacao)mudou.push(['Status',i.status_cotacao,r.status]);
    if(mudou.length)dif.push({codigo:r.codigo,mudou,novo:{meta_total:m??i.meta_base,teto_total:t??i.teto_total,status_cotacao:r.status||i.status_cotacao,qtd:i.qtd}})});
  const pacs=[];L.pacotes.forEach(r=>{const p=S.D.pacotes.find(x=>x.codigo===r.codigo);if(!p)return;
    if((r.meta!=null&&Math.abs(r2(r.meta)-p.meta)>0.005)||(r.teto!=null&&Math.abs(r2(r.teto)-p.teto)>0.005)||(r.fechar_ate&&r.fechar_ate!==p.fechar_ate))pacs.push({codigo:r.codigo,nome:p.nome,meta:r.meta!=null?r2(r.meta):p.meta,teto:r.teto!=null?r2(r.teto):p.teto,fechar_ate:r.fechar_ate||p.fechar_ate,antes:{meta:p.meta,teto:p.teto,fechar_ate:p.fechar_ate}})});
  const semMov=S.D.items.filter(i=>!seen.has(i.codigo)).length;
  /* calc_v2 [SUPOSIÇÃO, plano M1]: itens com remanejamento. A meta remanejada vence a meta nova da planilha (prep(): metaOv por cima de baseOv);
     a tela lista esses itens para o gestor escolher qual meta vale. */
  if(calcV2(S.t))info.remanejados=L.itens.map(r=>({r,i:S.byCod[r.codigo]})).filter(({i})=>i&&i.tipo_linha==='item'&&S.t.metaOv[i.codigo]!=null)
    .map(({r,i})=>({codigo:i.codigo,metaAtual:i.meta_total,metaBase:i.meta_base,metaPlanilha:r.meta!=null?r2(r.meta):null}));
  return {dif,pacs,info,semMov,dMeta:r2(dif.reduce((s,d)=>s+(d.novo.meta_total||0)-(S.byCod[d.codigo].meta_base||0),0))}}

/* ---------- Importar lançamentos do financeiro (CSV) ---------- */
/* Colunas: tipo;numero;fornecedor;descricao;vencimento;valor;pago_em;fat_direto  (tipo: gasto | custo_fixo | provisao). Datas dd/mm/aaaa ou aaaa-mm-dd; valores 1.234,56. */
const numBR=s=>{s=String(s||'').trim().replace(/[R$\s]/g,'');if(!s)return 0;return s.includes(',')?+s.replace(/\./g,'').replace(',','.'):+s};
const dataImp=s=>{s=String(s||'').trim();const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:/^\d{4}-\d{2}-\d{2}$/.test(s)?s:''};
function lfxParse(txt){const out=[],erros=[];String(txt||'').replace(/^﻿/,'').split(/\r?\n/).forEach((ln,i)=>{if(!ln.trim())return;const c=ln.split(';').map(x=>x.trim());
  if(i===0&&/^tipo$/i.test(c[0]))return;const tp=(c[0]||'').toLowerCase();
  if(!['gasto','custo_fixo','provisao'].includes(tp))return erros.push(`Linha ${i+1}: tipo "${c[0]}" inválido (use gasto, custo_fixo ou provisao)`);
  const v=numBR(c[5]),venc=dataImp(c[4]);if(!(v>0))return erros.push(`Linha ${i+1}: valor inválido`);if(!venc)return erros.push(`Linha ${i+1}: vencimento inválido`);
  out.push({tipo:tp,numero:c[1]||'',forn:c[2]||'',desc:c[3]||'',venc,valor:r2(v),pago:dataImp(c[6])||'',fatDireto:/^(1|s|sim|x)$/i.test(c[7]||'')})});return {out,erros}}
const lfxChave=l=>[l.tipo,l.numero,l.forn.toLowerCase(),l.venc,l.valor].join('|');
function lfxImportar(){const r=lfxParse($('#lf-csv').value),ja=new Set(S.t.lfxs.map(lfxChave));
  if(!r.out.length&&r.erros.length)return toast(r.erros[0]);
  const novos=r.out.filter(l=>!ja.has(lfxChave(l)));const lote='L'+Date.now();
  novos.forEach(l=>S.t.lfxs.push({id:'lfx'+Date.now()+Math.random().toString(36).slice(2,6),origem:'Importado',lote,...l}));
  log('lancamentos_importados',lote,'importar','',novos.length+' novos, '+(r.out.length-novos.length)+' repetidos ignorados'+(r.erros.length?', '+r.erros.length+' linhas com erro':''));
  save();toast(novos.length+' lançamentos importados, '+(r.out.length-novos.length)+' repetidos ignorados'+(r.erros.length?', '+r.erros.length+' com erro':''));S.lfxErros=r.erros;render()}
function lfxDesfazer(){const ult=S.t.lfxs[S.t.lfxs.length-1];if(!ult)return toast('Nada para desfazer');const n=S.t.lfxs.filter(l=>l.lote===ult.lote).length;
  S.t.lfxs=S.t.lfxs.filter(l=>l.lote!==ult.lote);log('lancamentos_importados',ult.lote,'desfazer','',n+' removidos');save();toast(n+' lançamentos do último lote removidos');render()}
ACOES['lf-imp']=()=>{if(!can('lan'))return toast('Só Financeiro importa lançamentos');lfxImportar()};ACOES['lf-undo']=()=>{if(!can('lan'))return toast('Só Financeiro desfaz importação');lfxDesfazer()};

  <textarea id="lf-csv" rows="6" placeholder="gasto;123;Fornecedor X;Cimento;25/11/2026;2.011,26;;&#10;provisao;;Folha;Provisão de mão de obra;30/11/2026;126.731,81;;"></textarea>
  <div style="margin-top:8px;display:flex;gap:8px"><button class="btn dark" data-act="lf-imp" ${can('lan')?'':'disabled title="Só Financeiro"'}>Importar</button><button class="btn" data-act="lf-undo" ${can('lan')&&L.length?'':'disabled'}>Desfazer último lote</button></div>
  ${(S.lfxErros||[]).length?`<div class="err" style="margin-top:8px">${S.lfxErros.slice(0,5).map(esc).join('<br>')}</div>`:''}
  ${L.length?`<div class="tw"><table class="tbl"><thead><tr><th>Tipo</th><th>Nº</th><th>Fornecedor</th><th>Vencimento</th><th class="r">Valor</th><th>Situação</th></tr></thead><tbody>${L.slice(-30).map(l=>`<tr><td>${l.tipo}${l.fatDireto?' · fat. direto':''}</td><td class="mono">${esc(l.numero)}</td><td>${esc(l.forn)}</td><td>${fdata(l.venc)}</td><td class="r">${brl(l.valor)}</td><td>${l.tipo==='gasto'?(l.pago?'pago '+fdata(l.pago):l.venc<hojeISO()?'<span class="neg">atrasado</span>':'a pagar'):'—'}</td></tr>`).join('')}</tbody></table></div>`:''}`}

/* ---------- drill-down: lista que compõe cada número ---------- */
function painelLinhas(k){const T=S.t,h=hojeISO(),R=[],add=(ref,desc,valor,data)=>R.push({ref,desc,valor:r2(valor),data});
  const nt=T.notas.filter(n=>n.status!=='lancada'),lg=lfxDe('gasto');
  const nota=n=>add(n.num,n.emitente+(n.status==='paga'?' · paga':''),n.valor,n.status==='paga'?n.pago:vencNota(n)),lf=l=>add('Importado '+(l.numero||''),l.forn+' · '+l.desc,l.valor,l.pago||l.venc);
  if(k==='fat')T.fats.forEach(f=>add(f.num,f.bcNum,f.valor,f.emissao));
  if(k==='recebido')T.recs.forEach(r=>add(r.id,'Recebimento',r.valor,r.data));
  if(k==='aReceber')T.fats.filter(f=>fatSaldo(f)>0).forEach(f=>add(f.num,'saldo a receber',fatSaldo(f),f.venc));
  if(k==='atrRec')T.fats.filter(f=>fatSaldo(f)>0&&f.venc<h).forEach(f=>add(f.num,'vencida',fatSaldo(f),f.venc));
  if(k==='pago'){nt.filter(n=>n.status==='paga').forEach(nota);lg.filter(l=>l.pago).forEach(lf)}
  if(k==='atrasado'){nt.filter(n=>n.status!=='paga'&&vencNota(n)<h).forEach(nota);lg.filter(l=>!l.pago&&l.venc<h).forEach(lf)}
  if(k==='aPagar'){nt.filter(n=>n.status!=='paga'&&vencNota(n)>=h).forEach(nota);lg.filter(l=>!l.pago&&l.venc>=h).forEach(lf)}
  if(k==='gasto'){nt.forEach(nota);lg.forEach(lf)}
  if(k==='requisicao')T.sols.filter(s=>['enviada','em_cotacao','cotada'].includes(s.status)).forEach(s=>add(s.num,s.desc,s.qtd*s.preco,s.data));
  if(k==='custoFixo'){nt.forEach(n=>{const v=n.rateio.filter(l=>l.nat==='ADM').reduce((a,l)=>a+ +l.valor,0);if(v)add(n.num,n.emitente+' (rateio ADM)',v,n.emissao)});lfxDe('custo_fixo').forEach(lf)}
  if(k==='prov'){contaObra(T).ocs.forEach(({oc:o,comp:v})=>{if(v)add(o.num,o.forn+' · pedido sem nota',v,o.data)});lfxDe('provisao').forEach(lf)}
  return R}
ACOES['pc-det']=el=>{const k=el.dataset.k,R=painelLinhas(k),tot=r2(R.reduce((s,x)=>s+x.valor,0));

function cartLinha(cod){const c=S.cart[cod];if(!c)return null;const atual=S.D.obra.codigo===cod;let t=null;
  if(atual)t=S.t;else if(MODO_CH)t=CH.T[cod]||null;else if(!MODO_SB)try{t=JSON.parse(localStorage.getItem(cod==='342'?KEY:KEY+'_'+cod)||'null')}catch(e){}

const hdrN=h=>String(h||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const EXT_NAT={cod:'codnatureza',nome:'natureza',fat:'faturado',cr:'codcr',crNome:'centroderesultado',saldoCR:'saldoporcr',rec:'faturadorecebido',areceber:'faturadoareceber',atrasoRec:'faturadoatrasado',gasto:'gasto',pago:'gastopago',aPagar:'gastoapagar',atrasado:'gastoatrasado',req:'gastorequisicao',prov:'provgasto',impD:'impostosdebito',impC:'impostocredito',impF:'impostofinal'};

function extParse(txt,mapa,numeros,datas,opc=[]){const L=String(txt||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(L.length<2)return {out:[],erros:['Cole o cabeçalho e ao menos uma linha']};
  const sep=L[0].includes('\t')?'\t':';',H=L[0].split(sep).map(hdrN),ix={},erros=[],out=[];for(const k in mapa){ix[k]=H.indexOf(mapa[k]);if(ix[k]<0&&opc.includes(k)){delete ix[k];continue}if(ix[k]<0)return {out:[],erros:['Falta a coluna "'+mapa[k]+'" no cabeçalho']}}
  L.slice(1).forEach((ln,i)=>{const c=ln.split(sep).map(x=>x.trim()),o={};for(const k in ix){const v=c[ix[k]]||'';o[k]=numeros.includes(k)?r2(numBR(v)):datas.includes(k)?dataImp(v):v}if(!o[Object.keys(mapa)[0]]&&!c.some(x=>x))return;out.push(o)});return {out,erros}}
function extImportar(){if(!can('lan'))return toast('Só Financeiro importa o extrato');const cod=S.D.obra.codigo,txN=$('#ex-nat').value,txL=$('#ex-lan').value;let nN=0,nL=0,erros=[];

    if(r.out.length){S.t.lfxs=S.t.lfxs.filter(l=>l.tipo!=='nat');r.out.filter(o=>o.cod).forEach((o,i)=>{S.t.lfxs.push({id:'nat-'+cod+'-'+Date.now()+'-'+i,tipo:'nat',origem:'Importado',lote:'extrato-'+cod,corte:$('#ex-corte').value||hojeISO(),...o,cr:o.cr||CR_PAD[0],crNome:o.crNome||CR_PAD[1],foraGasto:/ADIANTAMENTO A FORNECE/i.test(o.nome)});nN++});S.t.par.extratoCorte=$('#ex-corte').value||hojeISO();S.t.par.extratoSeed=true}}
  if(txL.trim()){const r=extParse(txL,EXT_LAN,['desdob','valorNota'],['dtNeg','dtBaixa','venc']);erros.push(...r.erros);const nc=$('#ex-natcod').value.trim(),ja=new Set(S.t.lfxs.filter(l=>l.detalhe).map(l=>[l.nota,l.natCod,l.desdob,l.venc].join('|')));
    r.out.filter(o=>o.nota).forEach((o,i)=>{const k=[o.nota,nc,o.desdob,o.venc].join('|');if(ja.has(k))return;ja.add(k);S.t.lfxs.push({id:'lan-'+cod+'-'+Date.now()+'-'+i,tipo:'gasto',detalhe:true,origem:'Importado',lote:'lanc-'+Date.now(),forn:o.parceiro,numero:o.nota,desc:o.topDesc,valor:o.valorNota,pago:o.dtBaixa,natCod:nc,...o});nL++})}
  if(!nN&&!nL)return toast(erros[0]||'Nada para importar');log('extrato',cod,'importar','',nN+' naturezas, '+nL+' lançamentos'+(erros.length?' · '+erros.length+' avisos':''));save();toast(nN+' naturezas e '+nL+' lançamentos importados'+(erros.length?' · '+erros[0]:''));render()}

  const d=g('DTPOSTED').slice(0,8),v=numOfx(g('TRNAMT'));if(!/^\d{8}$/.test(d)||!isFinite(v)||v===0)return;
  out.push({data:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`,valor:r2(v),desc:g('MEMO')||g('NAME'),fitid:g('FITID')})});return out}

/* concilia saídas com notas pagas de mesmo valor e entradas com recebimentos de mesmo valor */
function conciliaMovs(id){let c=0;S.t.movs.filter(m=>m.banco===id&&!m.conc&&m.origem!=='baixa').forEach(m=>{
  if(m.valor<0){/* extrato confirma uma baixa já feita no sistema, ou uma nota paga sem baixa pela conta */
    const bx=S.t.movs.find(x=>x.banco===id&&x.origem==='baixa'&&!x.conc&&Math.abs(x.valor-m.valor)<.005);
    if(bx){const n=S.t.notas.find(n=>n.id===bx.nota);bx.conc=m.conc=n?n.num:"baixa";m.dup=true;if(n)n.conc=m.data;c++;return}
    const n=S.t.notas.find(n=>n.status==='paga'&&!n.conc&&Math.abs(n.valor+(n.encargos||0)-Math.abs(m.valor))<.005);if(n){n.conc=m.data;m.conc=n.num;c++}}
  else{const r=S.t.recs.find(r=>!r.conc&&Math.abs(r.valor-m.valor)<.005);if(r){r.conc=m.data;m.conc=r.id;c++}}});return c}
function movManual(){const id=contaSel(),v=+$('#mv-v').value,d=$('#mv-d').value||hojeISO(),ds=$('#mv-t').value.trim();if(!id||!v||!ds)return toast('Informe conta, descrição e valor (negativo = saída)');

function baixaMultipla(){const ids=[...document.querySelectorAll('.bx:checked')].map(e=>e.value);if(!ids.length)return toast('Marque as notas');const banco=contaSel();if(!banco)return toast('Cadastre uma conta bancária');

  if(!ns.length)return toast('Nenhuma nota liberada marcada');const base=ns.reduce((s,n)=>s+n.valor,0),adj=r2(ju+mu-de);let rest=adj;
  ns.forEach((n,k)=>{const q=k===ns.length-1?rest:r2(adj*n.valor/base);rest=r2(rest-q);n.status='paga';n.pago=dt;n.encargos=q;

  save();toast(ns.length+' notas pagas · total '+brl(base+adj));render()}

/* Remessa CNAB 240 genérica (pagamento a fornecedores). Posições seguem o padrão FEBRABAN de forma simplificada: o banco exige homologação do layout. */
function cnabGera(){const b=S.t.bancos.find(x=>x.id===contaSel()),ns=S.t.notas.filter(n=>n.status==='liberada');if(!b||!ns.length)return toast('Sem conta ou notas liberadas');
  const pad=(s,n,c=' ')=>String(s).slice(0,n).padEnd(n,c),num=(v,n)=>String(Math.round(v)).replace(/\D/g,'').padStart(n,'0').slice(-n),dd=hojeISO().split('-').reverse().join('');
  const emp=S.t.par.emp||{};const L=[pad('00000000'+pad(b.banco,3)+'00000'+'         2'+num((emp.cnpj||'').replace(/\D/g,'')||0,14)+pad(emp.razao||"TAF",30)+pad(b.banco,30)+'          1'+dd,240)];
  L.push(pad('0000130000100'+'C2001'+'046'+' 2'+num((emp.cnpj||'').replace(/\D/g,'')||0,14),240));

/* kardex: custo médio ponderado móvel por insumo (todos os locais); saldo por local à parte */
function kardex(ins,local){let q=0,cm=0;const R=[];
  movsIns(ins).forEach(m=>{const s=sinalMov(m);let cu=m.cu;
    if(s>0&&m.tipo==='ent'){const tot=q*cm+m.qtd*m.cu;q=r2(q+m.qtd);cm=q>0?tot/q:m.cu}
    else if(s>0){cu=cm||m.cu||0;q=r2(q+m.qtd)}   /* ajuste positivo entra ao custo médio */
    else{cu=cm;q=r2(q-m.qtd)}
    if(!local||m.local===local)R.push({m,q,cm,cu})});return R}
const cmIns=ins=>memo('cm'+ins,()=>{let q=0,cm=0;movsIns(ins).forEach(m=>{const s=sinalMov(m);if(s>0&&m.tipo==='ent'){const t=q*cm+m.qtd*m.cu;q=r2(q+m.qtd);cm=q>0?t/q:m.cu}else if(s>0)q=r2(q+m.qtd);else q=r2(q-m.qtd)});return cm});
const movsIns=ins=>(memo('mi',()=>{const M=new Map();movOrd().forEach(x=>{if(!M.has(x.ins))M.set(x.ins,[]);M.get(x.ins).push(x)});return M})).get(ins)||[];
const saldoIns=(ins,local)=>memo('sd'+ins+'|'+(local||''),()=>r2(movsIns(ins).filter(m=>!local||m.local===local).reduce((s,m)=>s+sinalMov(m)*m.qtd,0)));

const ultDia=comp=>{const [y,m]=comp.split('-').map(Number);return comp+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')};
const diasMes=comp=>+ultDia(comp).slice(8);
/* depreciação linear mensal, pró-rata no mês de aquisição e no de baixa. vida e residual contábeis; a fiscal só informa */
function deprecBem(b,fiscal){const vida=fiscal?(b.vidaFisc||b.vida):b.vida;if(!(vida>0)||!b.aquisicao)return [];
  const base=b.valor*(1-(b.residual||0)/100),mensal=base/vida,fim=b.baixa?mesDe(b.baixa.data):mesDe(hojeISO()),R=[];let acum=0,m=mesDe(b.aquisicao);
  while(m<=fim&&acum<base-0.005){let f=1;if(m===mesDe(b.aquisicao))f=(diasMes(m)-(+b.aquisicao.slice(8))+1)/diasMes(m);if(b.baixa&&m===mesDe(b.baixa.data))f=Math.min(f,(+b.baixa.data.slice(8))/diasMes(m));
    const v=r2(Math.min(mensal*f,base-acum));if(v>0)R.push({comp:m,valor:v});acum=r2(acum+v);m=addMes(m,1)}return R}
const deprecAcum=(b,fiscal)=>r2(deprecBem(b,fiscal).reduce((s,x)=>s+x.valor,0));
const valorContabil=b=>r2(b.valor-deprecAcum(b));
/* partidas contábeis do patrimônio (somadas ao Diário em partidasAuto) */
function partidasPatrimonio(){const E=[];(S.t.pats||[]).forEach(b=>{if(!b.aquisicao)return;
  E.push({ref:'pa:'+b.id,origem:'Patrimônio',data:b.aquisicao,comp:mesDe(b.aquisicao),desc:'Ativação do bem '+b.cod,auto:true,linhas:[{conta:'1.2.01',d:b.valor,c:0},{conta:b.nota?'5.9.05':'3.1.03',d:0,c:b.valor}]});
  deprecBem(b).forEach(x=>E.push({ref:'pd:'+b.id+':'+x.comp,origem:'Depreciação',data:ultDia(x.comp),comp:x.comp,desc:'Depreciação '+b.cod,auto:true,linhas:[{conta:'5.9.03',d:x.valor,c:0},{conta:'1.2.02',d:0,c:x.valor}]}));
  if(b.baixa){const ac=deprecAcum(b),res=r2(b.valor-ac);E.push({ref:'pb:'+b.id,origem:'Baixa de bem',data:b.baixa.data,comp:mesDe(b.baixa.data),desc:'Baixa do bem '+b.cod+' · '+b.baixa.motivo,auto:true,linhas:[{conta:'1.2.02',d:ac,c:0},{conta:'5.9.04',d:res,c:0},{conta:'1.2.01',d:0,c:b.valor}].filter(l=>l.d>0||l.c>0)})}});return E}

function periodoRange(){const B=biPar();if(B.periodo==='all')B.periodo='tudo';const p=B.periodo||'hoje',h=hojeISO(),dia=n=>{const d=new Date(h+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};

function a11yPass(){const R=$('#view');if(!R)return;
  R.querySelectorAll('.clk:not([tabindex])').forEach(e=>{e.tabIndex=0;if(!e.getAttribute('role'))e.setAttribute('role','button')});
  R.querySelectorAll('th:not([scope])').forEach(e=>e.setAttribute('scope','col'));
  /* campos sem rótulo visível: usa placeholder, título, nome do dado ou id (sem forçar layout: nada de .labels) */
  R.querySelectorAll('input:not([aria-label]):not([type=hidden]),select:not([aria-label]),textarea:not([aria-label])').forEach(e=>{if(e.closest('label'))return;if(e.id&&R.querySelector('label[for="'+e.id+'"]'))return;const l=e.getAttribute('placeholder')||e.title||(e.dataset&&(e.dataset.f||e.dataset.k||e.dataset.cf))||e.name||e.id||(e.type==='checkbox'?'selecionar':'');if(l)e.setAttribute('aria-label',l)});
  R.querySelectorAll('button[title]:not([aria-label])').forEach(b=>{if(!b.firstChild||(b.firstChild.nodeType===1&&!b.textContent.trim()))b.setAttribute('aria-label',b.title)});
  R.querySelectorAll('svg[role=img]:not([aria-label])').forEach(s=>s.setAttribute('aria-label','Gráfico'))}
document.addEventListener('keydown',e=>{
  const t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.classList&&t.classList.contains('clk')&&t.tagName!=='BUTTON'&&t.tagName!=='A'){e.preventDefault();t.click();return}
  if(e.key==='Tab'&&$('#modal').classList.contains('open')){const F=[...$('#mbox').querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')].filter(x=>x.offsetParent!==null);
    if(!F.length)return;const a=F[0],z=F[F.length-1];if(e.shiftKey&&(document.activeElement===a||!$('#mbox').contains(document.activeElement))){e.preventDefault();z.focus()}else if(!e.shiftKey&&(document.activeElement===z||!$('#mbox').contains(document.activeElement))){e.preventDefault();a.focus()}}});

const mdInline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<span class="mono">$1</span>');
function mdHtml(md,q){const out=[];let ul=false;const ok=l=>!q||l.toLowerCase().includes(q.toLowerCase());const fecha=()=>{if(ul){out.push('</ul>');ul=false}};
  md.split('\n').forEach(l=>{if(!l.trim()){fecha();return}if(/^# /.test(l)){fecha();out.push(`<h3>${mdInline(l.slice(2))}</h3>`);return}if(/^## /.test(l)){fecha();out.push(`<div class="panel-t" style="margin-top:12px">${mdInline(l.slice(3))}</div>`);return}
   if(/^- /.test(l)){if(!ok(l))return;if(!ul){out.push('<ul style="margin:4px 0 4px 18px;padding:0">');ul=true}out.push(`<li style="margin:4px 0">${mdInline(l.slice(2))}</li>`);return}fecha();if(ok(l))out.push(`<p class="sub">${mdInline(l)}</p>`)});fecha();return out.join('')}

  const i=$('#aj-q');if(i){i.focus();i.oninput=()=>{const t=(MANUAIS[k]||MANUAIS.geral||'')+'\n\n'+(MANUAIS.geral||'');$('#aj-t').innerHTML=mdHtml(t,i.value)}}}

const MANUAIS={"administrador": "# Manual do Administrador do sistema\n**Seu dia:** usuários, papéis, backup e saúde do sistema.\n\n## Tarefas\n- **Usuários** (Gestão e administração → Usuários): quem se cadastra entra como \"Aguardando liberação\"; atribua o papel. **O primeiro cadastro vira Admin**: crie o seu e, depois de cadastrar a equipe, **feche o cadastro aberto** no Supabase (Authentication → Providers → desligar \"Allow new users to sign up\").\n- **Obras** (botão Obras): importe 343 e 281 a partir dos dados do repositório.\n- **Administração**: grupos, acessos temporários, horário, suplentes, alçadas por evento, parâmetros de pessoas.\n- **Acessos** (site TAF): chave pessoal de Diretoria, gestor, engenheiro, encarregado e só leitura, criada e desativada pela tela (ver Manual de Gerente, Diretoria e Gestão). Precisa do `fonte/erp/sql/06_acessos.sql` aplicado no banco.\n- **Auditoria**: filtre por entidade, período e pessoa; copie CSV.\n- **Backup**: Administração → Gerar backup (JSON da obra). Backup do banco: veja `docs/BACKUP_E_RECUPERACAO.md`.\n\n## Cuidados\n- Nunca coloque a chave `service_role` no front. A chave publicável em `web/config.js` é pública por desenho; a segurança vem do RLS.\n- Mudanças de banco: sempre migração em `supabase/migrations` e teste em `supabase/tests`.\n", "administrativo": "# Manual do Administrativo de obra\n**Seu dia:** lançar notas, ratear, cuidar de cadastros, pessoas, SST, patrimônio e contratos.\n\n## Tarefas\n- **Nota** (Suprimentos → Notas e rateio): lance pelo XML/chave. O **rateio precisa fechar 100%** do valor entre itens do orçamento. Notas sem pedido pedem justificativa.\n- **Pessoas** (Pessoas): cadastre colaboradores (CPF válido), registre **ASO, NR, EPI e treinamentos** em SST. Sem ASO válido o ponto de presença é bloqueado.\n- **Patrimônio** (Contratos e ativos): bem com vida contábil/fiscal, seguro, manutenção, local e baixa; a depreciação vai sozinha para o Diário.\n- **Contratos**: contratos de receita e despesa, aditivos, anexos por link.\n- **Contabilidade** (Contábil e fiscal): lançamentos manuais e de ajuste (motivo obrigatório), estorno.\n\n## Regras que bloqueiam\n- Competência fechada: nota, pagamento, faturamento, recebimento e lançamentos daquele mês ficam bloqueados (só a Diretoria reabre).\n- Nota acima da tolerância de 2% sobre o pedido volta para Compras.\n- CPF/CNPJ inválidos ou repetidos são recusados.\n\n## Erros comuns\n- \"O rateio não fecha 100% da nota\": some os valores das linhas.\n", "almoxarife": "# Manual do Almoxarife\n**Seu dia:** receber material, dar saída para as frentes e manter o estoque certo.\n\n## Tarefas\n- **Receber OC** (Suprimentos → Compras → Ordens de compra → Receber): informe a quantidade; se o insumo tem unidade de compra (ex.: BR = 6 m), escolha a unidade e o estoque converte.\n- **Estoque** (Suprimentos → Estoque): saída para a frente (escolha o item do orçamento para apropriar o consumo), entrada avulsa, ajuste (com motivo), transferência para outra obra (copie o código; a outra obra cola em \"Receber transferência\").\n- **Inventário**: abrir (copia o saldo), contar, recontar o que divergiu, importar contagem do coletor (`código;quantidade`) e fechar (gera os ajustes).\n- **Kardex**: botão Ver em cada insumo.\n\n## Regras que bloqueiam\n- Saída maior que o saldo do local é recusada.\n- Ajuste e inventário exigem motivo/contagem completa.\n- O mesmo código de transferência não entra duas vezes.\n\n## Observação\nO custo realizado do item continua vindo da nota fiscal; a saída mostra o **consumo apropriado** só como informação.\n", "compras": "# Manual de Compras e suprimentos\n**Seu dia:** cotar, emitir pedidos, acompanhar entregas e ocorrências.\n\n## Tarefas\n- **Cotar** (Suprimentos → Compras → Solicitações → Mapa de cotação): adicione propostas uma a uma ou **cole o arquivo do fornecedor** (`fornecedor;preço;prazo`). **Sugerir melhor** escolhe o menor preço (empate: menor prazo). Emita a OC.\n- **Ordens de compra**: acompanhe aprovação, recebimento, **Ocorrência** (atraso, avaria, divergência) e **Devolver** (baixa o estoque e registra o crédito).\n- **Necessidade e mín./máx.** (Suprimentos → Estoque → Necessidade): itens com atividade no lookahead sem compra em andamento, e insumos abaixo do mínimo.\n- **Cadastros** (Suprimentos → Cadastros): fornecedores (CNPJ validado), insumos (unidade de compra com fator, mínimo e máximo).\n\n## Regras que bloqueiam\n- Menos de 3 propostas exige justificativa ou marca de emergência (regularizar em 2 dias úteis). Escolher fora da menor também exige justificativa.\n- Semáforo e alçadas: verde até o limite sai sozinho; amarelo e verde acima do limite vão ao Gerente; acima do valor do Gerente ou do teto, à Diretoria. Quem solicitou não aprova a própria OC.\n- Item sem meta ou fora da planilha: bloqueado.\n\n## Erros comuns\n- \"Escolheu fora da menor: justifique\".\n- Preço colado com vírgula decimal: use `1.234,56` ou `1234.56`.\n", "encarregado": "# Manual do Encarregado de campo\n**Seu dia:** abrir Obra → Campo, lançar o apontamento do dia, conferir o ponto e a frota.\n\n## Entrar\n- Você recebe uma **chave pessoal** por mensagem direta. Abra **/marko** no celular e digite a chave. Ela é só sua: tudo o que você lançar sai no seu nome.\n- Perdeu a chave ou trocou de celular? Peça ao gestor para desativar e criar outra.\n\n## Tarefas\n- **Apontar o dia no planejador** (/marko → Hoje): para cada compromisso da semana marque **andou**, **parado** (com a causa) ou **entregue**. **Andou em todos** e **Dia parado para todos** marcam a frente toda de uma vez. Dá para apagar o apontamento do dia enquanto a semana está aberta. Quem prepara, monta, publica e fecha a semana é o engenheiro.\n- **Apontamento** (Obra → Campo → Novo apontamento): escolha a data e o item do orçamento, a quantidade produzida (0 se não produziu), a equipe (função × pessoas × horas) e os equipamentos. Use **Puxar do ponto** para preencher a equipe a partir do ponto do dia. Chuva e parada entram com motivo e horas.\n- **Ponto** (Pessoas → Pessoas e ponto → Ponto → Lançar o dia): para cada colaborador marque a situação (presente, folga, falta, atestado, férias, externo, INSS). Quem está presente conta horas na frente (item) escolhida.\n- **Frota** (Contratos e ativos → Frota): lance abastecimento, leitura do horímetro/km e checklist do dia. Checklist reprovado abre ordem de serviço corretiva sozinho.\n\n## Regras que bloqueiam\n- Não dá para lançar apontamento ou ponto com data futura.\n- No planejador só se aponta semana **publicada** e aberta; semana fechada só o gestor reabre.\n- **SST:** colaborador com ASO vencido ou ausente não recebe ponto de presença (peça ao Administrativo para registrar o ASO).\n- Leitura de horímetro/km nunca pode ser menor que a anterior.\n- Já existindo apontamento conferido do mesmo item e dia, o sistema recusa outro.\n\n## Erros comuns\n- \"Informe a frente\": presente com horas precisa do item do orçamento.\n- \"Já existe registro deste colaborador neste dia\": edite pelo Administrativo ou use outro item.\n", "engenheiro": "# Manual do Engenheiro residente\n**Seu dia:** acompanhar o Dashboard, aprovar apontamentos, pedir compras, medir produção e subempreiteiros.\n\n## Entrar\n- Use a sua **chave pessoal** (a Diretoria ou o gestor cria em Acessos e manda por mensagem direta). Entre em **/marko**; no ERP, **/erp**. Com a chave geral do site você entra como gestor e não planeja nem aponta.\n- A **pessoa** da sua chave tem de ter o **mesmo nome do engenheiro da obra no planejador**. Nome diferente: as demandas, as áreas e as tarefas em seu nome não aparecem como suas. (O \"nome da chave\" é só para achar na lista e não importa para isso.)\n\n## Tarefas\n- **Dashboard** (Início): indicadores com meta, Curva S, funil de compras, estoque e pessoas. \"Escolher o que mostrar\" liga e desliga seções.\n- **Solicitar compra** (Suprimentos → Compras → Nova solicitação): nasce dentro de um item do orçamento. O semáforo compara com a meta e o teto do item.\n- **Aprovar apontamento** (Obra → Campo): confira e aprove os apontamentos conferidos.\n- **Medição** (Obra → Medição e resultado): lance a produção medida; o Gerente atesta; vira boletim ao cliente (BM) no Financeiro.\n- **Medição de subempreiteiro** (Contratos e ativos → Contratos → Nova medição): você lança; Gerente/Diretoria aprova. A aprovação gera a nota do subempreiteiro (com retenção de INSS) e o custo do item.\n- **Projetos** (Contratos e ativos → Projetos): etapas, % concluído e horas apropriadas.\n- **Propor meta** (com a chave \"Meta pela tela\" ligada na obra): em Obra → Orçamento, abra o item e clique em **Propor meta**; em Obra → Pacotes, abra o pacote e clique em **Propor meta do pacote**. A janela mostra licitado, meta, teto e margem de hoje. Escreva a meta nova e/ou o teto novo (no pacote também o \"fechar até\") e o motivo. Vazio = mantém o valor de hoje.\n- **Acompanhar as suas propostas** (Obra → Metas → Minhas propostas): aguardando decisão, aprovada (com a versão da linha de base em que entrou), precisa de conferência (o item mudou depois da aprovação e a Gestão confere), não entrou (decisão da conferência), recusada (com o motivo) ou cancelada. Enquanto espera decisão, você pode **cancelar** a sua. Na proposta decidida, o cartão mostra \"Antes\" (o que valia na decisão) e \"Aprovado\" ou \"Proposto\".\n- **Relato do WhatsApp com a IA** (Apontamentos → Apontar o dia, aba Hoje): toque em \"Colar relato do WhatsApp\", cole o texto do grupo e toque em \"Ler com a IA\". A IA propõe um apontamento por compromisso e por dia (andou, parado com a causa, entregue, quantidade), com o trecho do relato ao lado. Confira, corrija o que precisar, marque e toque em \"Gravar os marcados\": cada um vai para o cartão do compromisso, igual ao apontamento à mão. O que não casou com nenhum compromisso aparece embaixo, para você apontar à mão ou criar um extra.\n- **Perguntar ao assistente** (Ciclo da obra → Situação, embaixo do \"Copiar resumo\"): escreva a pergunta sobre a obra e toque em \"Perguntar\". A IA responde só com o que está na Situação; o que não estiver lá ela diz que o sistema não tem. Não grava nada.\n- **Resumo para o diretor** (Gestão e administração): com a sua chave pessoal, \"Ver prévia\" mostra o resumo das suas obras que a Diretoria recebe por e-mail (PPC, atrasadas, restrições, apontamento, custo x meta). \"Copiar para WhatsApp\" copia o texto. Quem cadastra os e-mails é a Diretoria. Com a chave do site, a parte do planejador só aparece na obra em que você é o engenheiro.\n\n## Regras que bloqueiam\n- Compra acima da meta (amarelo) exige justificativa e vai ao Gerente; acima do teto (vermelho) vai à Diretoria; item sem meta ou fora da planilha é bloqueado.\n- A linha de base precisa estar congelada pela Gestão antes de comprar.\n- Proposta de meta não muda nada até ser aprovada. Um item (ou pacote) só tem uma proposta esperando decisão por vez. A meta aprovada entra na linha de base quando a Gestão, a Diretoria ou o Gerente abrir a obra.\n- Medição de subempreiteiro não passa do valor vigente do contrato; contrato bloqueado não aceita medição.\n- A IA só propõe; nada é gravado sem você marcar e tocar em Gravar. Já marcado por padrão: só o que tem confiança alta ou média, trecho achado no relato e dia ainda sem apontamento.\n- A IA tem limite de uso por chave por dia: padrão 30 usos, somando relato e pergunta. Conta cada vez que o pedido chega à IA, mesmo se ela falhar (ocupada ou demorou). Semana fechada ou ainda não publicada não gasta uso. Passou do limite, aponte à mão; no dia seguinte libera.\n\n## Erros comuns\n- \"Excede o valor vigente\": peça aditivo ao Administrativo/Gerente.\n- Medição que você mesmo lançou não pode ser aprovada por você.\n- \"A IA ainda não está ligada neste sistema\": falta configurar a IA no site; aponte à mão e avise o Felipe.\n- \"Parado precisa da causa\" ao gravar a proposta: escolha a causa ou desmarque o item.\n", "financeiro": "# Manual do Financeiro\n**Seu dia:** liberar e pagar, conciliar o extrato, faturar, receber e fechar o mês.\n\n## Tarefas\n- **Pagar** (Financeiro → Pagar e conciliar): notas conferidas → **Liberar** → **Pagar**. **Contas a pagar** permite parcelar, renegociar (com motivo) e agrupar títulos do mesmo fornecedor.\n- **Contas e extrato**: importe o **OFX** (concilia sozinho), **baixa múltipla** com juros, multa e desconto, remessa **CNAB 240 genérica** (validar com o banco).\n- **Cobrança**: mensagem pronta e link do WhatsApp para NFs vencidas; registre o contato.\n- **Faturamento** (Financeiro → Faturamento e caixa): boletim de medição → aprovação do cliente → NF de serviço → recebimento. Fluxo de caixa e DRE.\n- **Painel da obra** (Início → Painéis → Contrato da obra): mesmos blocos do ERP de referência; **Conferência** com os totais de lá; **Importar lançamentos** (CSV) do financeiro antigo.\n- **Contabilidade**: Balancete (débito = crédito), Diário, Razão, DRE e Balanço, Orçamento por conta, **Fechamento** da competência, livros em CSV.\n\n## Regras que bloqueiam\n- Só o Financeiro libera e paga. Competência fechada bloqueia retroativos.\n- Recebimento acima do saldo da NF é recusado.\n\n## Pontos de atenção\n- Alíquotas e plano de contas são padrões: confirme com o contador.\n", "geral": "# Manual rápido (qualquer papel)\n- **Menu** à esquerda por áreas; as abas ficam no alto da tela. O papel define o que aparece e o que dá para fazer; botões cinza com dica indicam falta de permissão.\n- **Alertas** (sino): pendências críticas, atenção e informativas.\n- **Semáforo de compras:** verde na meta; amarelo acima da meta; vermelho acima do teto; bloqueado fora da planilha.\n- **Rateio** de nota fecha 100% entre itens. **Competência fechada** bloqueia retroativos. **SST** vencido bloqueia ponto.\n- Tudo que muda fica na **Auditoria** com antes e depois.\n- Dúvida de regra: `docs/FLUXO_NF.md` e `docs/COMECE_AQUI.md`.\n", "gerencia": "# Manual de Gerente, Diretoria e Gestão\n**Seu dia:** aprovar o que passa da alçada, acompanhar indicadores e decidir.\n\n## Tarefas\n- **Dashboard e indicadores** (Início; Gestão → Indicadores e BI): cartões com meta, Curva S, caixa, desvios, funil, pessoas. Defina metas em \"Escolher o que mostrar\". O painel dinâmico cruza fontes (notas, estoque, ponto, títulos, contabilidade) e copia CSV.\n- **Aprovar OCs** (Suprimentos → Compras → Aprovações): amarelo e verde acima do limite → Gerente; vermelho e acima do valor do Gerente → Diretoria. Reprovar exige motivo.\n- **Aprovar medição de subempreiteiro** e atestar medições (Obra → Medição).\n- **Congelar a linha de base** (Gestão/Diretoria) e **Parâmetros** de compras (limite verde, limite do Gerente, tolerância).\n- **Metas para aprovar** (Obra → Metas → Para aprovar; o número aparece no menu Obra e no sino): cada cartão mostra hoje e proposto (meta, teto, licitado, folga até o teto e margem) e o motivo de quem propôs. **Aprovar** (observação opcional) ou **Recusar** (motivo obrigatório). Ao aprovar, a meta entra na linha de base como versão nova, com histórico e auditoria. Liga em Compras → Parâmetros → Chaves desta obra → \"Meta pela tela\".\n- **Mudar meta direto** (Gestão e Diretoria): no item (Orçamento) ou no pacote (Pacotes), **Mudar meta**, com motivo. Entra na hora, como versão nova, e fica registrada como aprovada.\n- **Metas que precisam de conferência** (Obra → Metas → Para aprovar, no topo): a meta aprovada só entra sozinha se o item (ou pacote) ainda estiver como na hora da aprovação. Se mudou depois (remanejamento, planilha ou um navegador com dados velhos que gravou por cima), o cartão mostra \"Na aprovação\", \"Hoje\" e \"Aprovado\". Escolha **Aplicar mesmo assim** (a meta aprovada entra por cima do valor de hoje; se o item tinha remanejamento, ele é desfeito só neste item) ou **Não aplicar** (fica no histórico, sem versão nova). Motivo obrigatório nos dois.\n- **Remanejar saldo** (Obra → Orçamento): Gerente e Diretoria; com \"Meta pela tela\" ligada, a Gestão também, com a chave pessoal.\n- **Atualizar pela planilha** (Obra → Orçamento): escreva o motivo da atualização (obrigatório). Se a planilha mudar item com meta aprovada pela tela, aparece um aviso: planilha desatualizada volta a meta antiga.\n- **Contratos**: aditivos, bloqueio, alertas de vencimento e reajuste.\n- **Reabrir competência** (só Diretoria, com motivo) em Contabilidade → Fechamento.\n- **Administração** (Gestão e administração): grupos, acesso temporário, suplente de aprovador, horário, **alçadas por evento**.\n- **Obra nova** (só Gestão e Diretoria): clique na obra no alto do menu e em **Nova obra**. Passo 1: código de 3 números, nome e contratante. Passo 2: suba a planilha do órgão (.xlsx ou .csv). A tela abre na aba que tem o orçamento (capa e resumo ficam de lado); se nenhuma aba servir, ela avisa para você escolher. Confira a linha do cabeçalho e as colunas que a tela sugeriu (código do item, descrição, unidade, quantidade, preço unitário ou total, evento e pacote se tiver). Linha sem quantidade e sem preço unitário vira grupo; quantidade 0 continua item, com aviso; linha sem código fica de fora. Passo 3: prévia com itens, grupos, total geral e avisos (código repetido, item sem preço, quantidade zero, total diferente de quantidade × unitário). Digite o **valor do contrato** (obrigatório). Se ainda não tem o contrato, clique em **Usar a soma da planilha**: fica registrado que o valor veio da planilha. Com a chave do site, escolha também **Seu papel** (Gestão ou Diretoria). Passo 4: **Gravar a obra**: o ERP abre a obra no Orçamento.\n- **Cronograma da obra nova** fica no Centro de Gestão: em Tarefas → Cronograma (ou no quadro \"As obras estão no prazo?\"), digite o código em **Obra nova (código)** e clique em Importar cronograma.\n- **Acessos** (Gestão e administração → Acessos): a chave pessoal de cada pessoa. **Criar acesso**: escolha o papel, a pessoa (o nome que vai em tudo o que ela lançar), o nome da chave (para achar na lista) e as obras. Nenhuma obra vem marcada: marque só as que a pessoa precisa. A chave aparece **uma vez só**: copie com **Copiar a chave** ou **Copiar mensagem pronta** e mande **só por mensagem direta** para a pessoa. Depois feche com **Já mandei, fechar**. **Desativar**: a chave para na hora, em todos os aparelhos; o que a pessoa lançou fica.\n- **Onde cada um entra**: engenheiro e encarregado em **/marko** (e no **/erp**: o engenheiro propõe meta e solicita compra; o encarregado lança campo, ponto e frota); gestor e Diretoria em **/erp** e **/ciclo** com a chave pessoal (o Centro, em **/**, continua com a chave geral do site). Num aparelho que não tem a chave geral do site guardada, o /erp e o /ciclo abrem a própria tela de entrada, que aceita a chave pessoal.\n- **Primeira chave de Diretoria (partida)**: enquanto não existe nenhuma, entre no ERP com a chave geral do site, abra Acessos e use **Criar a primeira chave de Diretoria**, com todas as obras. Depois use **Sair** (embaixo do seu nome) e entre com ela; o ERP não volta sozinho para a chave geral guardada pelo Centro. Confira na lista o \"criada por\". Num banco sem nenhuma obra, crie a obra primeiro (Nova obra), porque a chave precisa de ao menos uma obra. A partir daí a chave geral não cria mais acesso.\n- **Obra nova criada pela tela (Nova obra)**: entra sozinha na chave de quem criou e nas chaves de Diretoria com todas as obras. Obra que já existe no planejador só ganha o ERP pela chave pessoal de quem já cuida dela (peça à Diretoria).\n- **Obra nova** (importada depois, sem passar pela Nova obra): aparece no topo de Acessos para a Diretoria com todas as obras como \"ainda não tem chave de Diretoria\". Ela já pode dar acesso de engenheiro e encarregado na obra nova. Para a Diretoria ver a obra no ERP: crie uma chave de Diretoria com todas as obras, inclusive a nova, entre com ela e desative a antiga.\n- **Perguntar ao assistente** (Ciclo da obra → Situação, embaixo do \"Copiar resumo\"): escreva a pergunta sobre a obra e toque em \"Perguntar\". A IA responde só com o que está na Situação (luzes, o que decidir, eventos em risco, qualidade do dado); o que não estiver lá ela diz que o sistema não tem. Não grava nada. Confira nos números antes de decidir.\n- **Resumo para o diretor** (Gestão e administração, logo depois de Administração): o site manda sozinho, por e-mail, o resumo de cada obra. Diário em dia útil às 7h; semanal na segunda às 7h30. Traz PPC da última semana fechada e da atual, se a semana foi publicada, atrasadas, EVENTOs e marcos em risco, restrições vencidas e as que vencem em 7 dias, dias úteis sem apontamento e, do ERP, licitado, meta, comprometido e realizado. O que não tem dado sai como \"sem dado\", nunca como zero.\n- **Quem recebe**: \"Novo destinatário\" pede nome, e-mail, frequência e obras. \"Todas as obras\" só aparece para quem tem todas as obras na chave. Marque \"É o meu e-mail\" no seu cadastro para poder usar \"Mandar agora para mim\". \"Desativar\" para o envio sem apagar; \"Reativar\" volta. O e-mail marcado como de outra pessoa só ela ou a Diretoria editam ou desativam; se a Diretoria trocar esse e-mail, ele deixa de ser da pessoa.\n- **Aviso de quem ficou sem**: se o último resumo de alguém não saiu, aparece um aviso no alto da lista e \"ficou sem\" na linha. O motivo fica em \"Último envio\".\n- **Ver prévia**: mostra o texto que vai sair, sem mandar nada. \"Copiar para WhatsApp\" copia o mesmo texto com negrito do WhatsApp. \"Prévia\" na linha de um destinatário mostra o que ele recebe. \"Mandar agora para mim\" manda o e-mail de teste para o seu e-mail (até 5 por dia), com as obras do cadastro desse e-mail que estão na sua chave.\n- **Robô do envio**: \"Gerar chave do robô\" cria a chave que o envio automático usa. Ela aparece uma vez: copie e cole na Vercel em TAF_CHAVE_RESUMO e faça um novo Deploy. A Vercel também precisa de CRON_SECRET, RESEND_API_KEY e RESUMO_REMETENTE. \"Trocar a chave do robô\" desliga a anterior na hora.\n\n## Regras\n- Ninguém aprova a própria solicitação. Suplente só vale dentro do período cadastrado.\n- Acesso temporário, suplência e horário valem na interface; no banco vale o papel em Usuários.\n- Obra nova entra **sem meta de custo**: a compra fica bloqueada até a meta de cada item ser definida e a linha de base ser congelada.\n- Código repetido na planilha não grava: corrija a planilha e suba de novo. O banco confere tudo outra vez e guarda a versão anterior do orçamento.\n- O orçamento só se regrava em obra criada pela tela, sem nenhum lançamento (compra, nota, medição, tarefa ligada, apontamento, contrato...), sem meta e sem linha de base congelada, e só com chave pessoal de Gestão ou Diretoria. Obra antiga e obra com lançamento: use Orçamento → **Atualizar pela planilha**.\n- Com a chave do site, o papel é escolhido na prévia, de propósito: o papel que aparece ao entrar não vale. O seu nome fica registrado. A chave do site grava o orçamento uma vez só, e só da obra que ela mesma criou.\n- Descrição, nome ou contratante com < > ou aspas: esses sinais viram ‹ › ″ (o banco não aceita os sinais de programa).\n- Meta: decidir e mudar direto exigem a **chave pessoal** (com a chave geral do site ninguém aprova). Quem propôs não decide a própria proposta. Hoje não existe chave pessoal de Gerente: quem decide é Gestão ou Diretoria.\n- A meta aprovada é aplicada pelo navegador de quem aprova. Se não entrar na hora (sem sinal, por exemplo), entra quando Gestão, Diretoria ou Gerente abrir a obra de novo, se o item não mudou; se mudou, vai para conferência.\n- Cuidado com duas telas abertas na mesma obra por muito tempo: o ERP ainda não confere a versão antes de gravar, e a tela com dados velhos pode gravar por cima do que outra gravou. Atualize a página antes de remanejar ou aplicar planilha. A meta aprovada que some assim volta sozinha ou vai para conferência, mas um remanejamento ou uma planilha apagados assim se perdem.\n- Com a chave geral do site o servidor ainda aceita mudança na linha de base (planilha, remanejamento) de quem escolhe Gestão, Gerente ou Diretoria na tela. Para meta, use sempre a chave pessoal.\n- **Quem cria acesso:** Diretoria cria qualquer papel (Diretoria, gestor, engenheiro, encarregado, só leitura). Gestor cria engenheiro, encarregado e só leitura. Engenheiro e encarregado não veem Acessos.\n- **Obras:** cada um só cria e desativa acesso nas obras que cuida. A Diretoria com todas as obras cuida de todas. A **Diretoria limitada** (ex.: sócio de consórcio, só uma obra) e o gestor cuidam só das obras da chave deles e só veem na lista as chaves que têm obra em comum (as obras de fora aparecem só como \"+N obras fora da sua chave\"). O gestor não vê as chaves de Diretoria.\n- **Pessoa:** não dá para criar chave em nome de quem já tem chave que você não cuida (Diretoria, gestor ou outra obra). Pessoa com duas chaves ativas aparece com aviso: desative a do celular antigo.\n- **Ninguém desativa a própria chave**, e sempre sobra uma **Diretoria com todas as obras**: a última (ou a única com todas) não sai. Crie outra antes.\n- **Chave perdida não se recupera**: desative e crie outra. A chave não fica guardada em lugar nenhum, só o código dela (sha256).\n- **Nome do engenheiro:** use o mesmo nome do engenheiro da obra no planejador. Se for diferente, a tela avisa: as demandas, as áreas e as tarefas do engenheiro não aparecem como desta pessoa.\n- **Encarregado**: no planejador só aponta o dia (andou, parado, entregue); quem prepara, monta, publica e fecha a semana é o engenheiro. No ERP a chave dele entra como encarregado: vê o Orçamento (licitado, meta e teto), Pessoas e ponto e Frota, e lança ponto, frota, apontamento de campo, restrição e tarefa. Pense nisso antes de dar a chave a encarregado de subempreiteira.\n- A obra nova entra na chave de quem a cria pela tela e nas chaves de Diretoria com todas as obras. Nas outras chaves não entra sozinha: crie uma chave nova com a obra e desative a antiga.\n- **Robô do resumo**: aparece em Acessos marcado como \"robô do resumo\". Só a Diretoria com todas as obras desativa; desativado, o e-mail do horário para até gerar outra chave em Resumo para o diretor.\n- O assistente tem limite de uso por chave por dia (padrão 30, somando relato e pergunta). Conta cada vez que o pedido chega à IA, mesmo se ela falhar. Chave só de leitura não usa o assistente.\n- Resumo para o diretor: só a Diretoria ou o gestor, com a **chave pessoal**, cadastram quem recebe. Com a chave geral do site não dá (ninguém manda e-mail para qualquer endereço). Cada um só cadastra as obras da própria chave.\n- A cor de cada obra no resumo é a pior entre as luzes de produção e de plano do planejador e o EVENTO mais crítico. O motivo que aparece ao lado da cor é o do indicador que deu aquela cor. A obra mais grave vem primeiro.\n- A parte do planejador só aparece para quem abre o planejador da obra. Com a chave do site, só o engenheiro da obra vê; os outros veem \"sem acesso com esta chave\" e o custo do ERP.\n- Os e-mails saem um a um, em poucos segundos. O mesmo e-mail não sai duas vezes no mesmo dia, nem quando o envio é repetido (cada e-mail leva uma marca que a Resend reconhece por 24 horas). Se o envio falhar, a repescagem tenta de novo às 9h (na segunda, 9h30 o semanal), até 3 vezes no dia. No dia seguinte, quem ficou sem vai primeiro. O \"Último envio\" da lista mostra o que aconteceu.\n", "planejamento": "# Manual de Planejamento\n**Seu dia:** lookahead, restrições, PPC e leitura dos painéis.\n\n## Tarefas\n- **Lean e planejamento** (Obra → Lean): pauta de segunda, lookahead de 6 semanas, restrições com dono e prazo, PPC, tarefas.\n- **Projetos** (Contratos e ativos → Projetos): modelos com etapas, % por etapa, horas apropriadas.\n- **Fluxos e SLA** (Gestão → Fluxos e SLA): inicie modelos (admissão, mobilização, fechamento mensal) que geram tarefas com dono e prazo.\n- **Painéis** e **Dashboard**: Curva S, produção × HH, PPC, desvios.\n\n## Regras\n- Atividade só entra no lookahead ligada a um item do orçamento. Restrição sem dono ou prazo é recusada.\n"};

function pintaTema(){const t=temaAtual();[['t-claro','light'],['t-escuro','dark']].forEach(([id,k])=>{const b=document.getElementById(id);if(b)b.setAttribute('aria-pressed',String(t===k))})}

/* ============ FILTROS INTERATIVOS EM TODAS AS TABELAS (Fase 19) ============ */
/* Roda após cada render: acrescenta a toda tabela com 2+ linhas uma barra de busca, filtros por coluna, datas, valores, ordenação pelo cabeçalho,
   contador "N de M", limpar e copiar CSV. Filtra escondendo linhas (sem redesenhar, mantém o foco) e guarda o estado por tela e tabela. */
S.flt=S.flt||{};
const fNum=t=>{t=String(t).replace(/−/g,'-').replace(/R\$|\s|%/g,'');if(!/^-?[\d.]*(,\d+)?$/.test(t)||!/\d/.test(t))return null;return parseFloat(t.replace(/\./g,'').replace(',','.'))};
const fData=t=>{const m=String(t).match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:null};
const fSemData=t=>String(t).replace(/\d{2}\/\d{2}\/\d{4}/g,' ').replace(/\s+/g,' ').trim();
const fChave=(t,i)=>S.view+'|'+JSON.stringify(S.tab)+'|'+i;
const fCelula=(tr,i)=>{const c=tr.cells[i];return c?c.textContent.trim():''};
const fTx=(tr,i)=>fSemData(fCelula(tr,i));
function fLinhas(t){return [...t.tBodies].flatMap(b=>[...b.rows]).filter(r=>!(r.cells.length===1&&r.cells[0].colSpan>1))}
function fAnalisa(t,L){const th=[...t.tHead.rows[t.tHead.rows.length-1].cells],cols=[];
  th.forEach((h,i)=>{const nome=h.textContent.trim();const vals=L.slice(0,3000).map(r=>fCelula(r,i)).filter(v=>v!==''),n=vals.length;if(!n){cols.push({i,nome,tipo:'vazio'});return}
    const datas=vals.filter(v=>fData(v)).length,nums=vals.filter(v=>fNum(v)!==null).length,uniq=[...new Set(L.slice(0,3000).map(r=>fTx(r,i)).filter(v=>v!==''))];
    let tipo='texto';if(datas>=n*.7&&fSemData(vals[0]).length<=2)tipo='data';else if(nums>=n*.7)tipo='num';const temData=datas>=n*.5;
    cols.push({i,nome,tipo,temData,uniq:tipo==='texto'&&uniq.length>=2&&uniq.length<=12&&uniq.length<=L.length*.8?uniq.sort((a,b)=>a.localeCompare(b,'pt-BR')):null,dinheiro:tipo==='num'&&vals.some(v=>/R\$/.test(v))})});return cols}
function fBarra(t,L,cols,st){
  const sel=cols.filter(c=>c.uniq&&c.nome).map(c=>`<select class="f-c" data-i="${c.i}" aria-label="Filtrar por ${esc(c.nome)}"><option value="">${esc(c.nome)}: todos</option>${c.uniq.map(v=>`<option ${st.cols&&st.cols[c.i]===v?'selected':''} value="${esc(v)}">${esc(v.slice(0,40))}</option>`).join('')}</select>`).join('');
  const d=cols.find(c=>c.tipo==='data')||cols.find(c=>c.temData),m=cols.find(c=>c.dinheiro);
  return `<div class="fbar" role="search"><input class="f-q" type="search" placeholder="Filtrar esta lista…" aria-label="Filtrar linhas da tabela" value="${esc(st.q||'')}">${sel}`+
   (d?`<label class="f-l">${esc(d.nome)} de <input class="f-d" data-k="de" type="date" value="${st.de||''}" aria-label="${esc(d.nome)} a partir de"></label><label class="f-l">até <input class="f-d" data-k="ate" type="date" value="${st.ate||''}" aria-label="${esc(d.nome)} até"></label>`:'')+
   (m?`<label class="f-l">${esc(m.nome)} ≥ <input class="f-v" data-k="min" type="number" step="any" value="${st.min??''}" aria-label="${esc(m.nome)} mínimo"></label><label class="f-l">≤ <input class="f-v" data-k="max" type="number" step="any" value="${st.max??''}" aria-label="${esc(m.nome)} máximo"></label>`:'')+
   `<label class="f-l"><input class="f-al" type="checkbox" ${st.al?'checked':''} aria-label="Só linhas com alerta"> só alertas</label><span class="f-n" aria-live="polite"></span><button class="btn sm f-x" type="button">Limpar</button><button class="btn sm f-csv" type="button">Copiar CSV</button></div>`}
function fAplica(t){const bar=t.__bar;if(!bar)return;const st=t.__st,L=fLinhas(t),cols=t.__cols,dc=cols.find(c=>c.tipo==='data')||cols.find(c=>c.temData),mc=cols.find(c=>c.dinheiro);let n=0;
  const q=(st.q||'').toLowerCase().trim();
  L.forEach(r=>{let ok=true;
    if(q){if(r.__t===undefined)r.__t=r.textContent.toLowerCase();ok=r.__t.includes(q)}
    if(ok&&st.cols)for(const i in st.cols){if(st.cols[i]&&fTx(r,+i)!==st.cols[i]){ok=false;break}}
    if(ok&&dc&&(st.de||st.ate)){const v=fData(fCelula(r,dc.i));if(!v||(st.de&&v<st.de)||(st.ate&&v>st.ate))ok=false}
    if(ok&&mc&&(st.min!==undefined&&st.min!==''||st.max!==undefined&&st.max!=='')){const v=fNum(fCelula(r,mc.i));if(v===null||(st.min!==''&&st.min!==undefined&&v<+st.min)||(st.max!==''&&st.max!==undefined&&v>+st.max))ok=false}
    if(ok&&st.al&&!r.querySelector('.neg,.pill.bad,.pill.warn'))ok=false;
    r.style.display=ok?'':'none';if(ok)n++});
  const c=bar.querySelector('.f-n');if(c)c.textContent=n+' de '+L.length;
  const ativo=!!(q||(st.cols&&Object.values(st.cols).some(Boolean))||st.de||st.ate||(st.min!==undefined&&st.min!=='')||(st.max!==undefined&&st.max!=='')||st.al);bar.classList.toggle('f-on',ativo)}
function fOrdena(t,i,dir){const body=t.tBodies[0];if(!body)return;const L=fLinhas(t),col=t.__cols.find(c=>c.i===i)||{tipo:'texto'};
  const val=r=>{const v=fCelula(r,i);return col.tipo==='data'?(fData(v)||''):col.tipo==='num'?(fNum(v)??-Infinity):v.toLowerCase()};
  L.sort((a,b)=>{const x=val(a),y=val(b);const c=typeof x==='number'?x-y:String(x).localeCompare(String(y),'pt-BR');return dir*c});L.forEach(r=>body.appendChild(r))}
function filtrosPass(){const R=document.getElementById('view');if(!R)return;
  [...R.querySelectorAll('table.tbl')].forEach((t,k)=>{if(!t.tHead||!t.tHead.rows.length||t.closest('.grw'))return;const L=fLinhas(t);if(L.length<2)return;
    const key=fChave(null,k),st=S.flt[key]||(S.flt[key]={});t.__st=st;t.__key=key;const cols=fAnalisa(t,L);t.__cols=cols;
    const host=t.closest('.tw')||t,div=document.createElement('div');div.innerHTML=fBarra(t,L,cols,st);const bar=div.firstChild;host.parentNode.insertBefore(bar,host);t.__bar=bar;bar.__t=t;
    [...t.tHead.rows[t.tHead.rows.length-1].cells].forEach((h,i)=>{const c=cols[i];if(!c||c.tipo==='vazio'||!h.textContent.trim())return;h.classList.add('f-th');h.tabIndex=0;h.setAttribute('role','columnheader');h.setAttribute('aria-sort',st.sort&&st.sort.i===i?(st.sort.dir>0?'ascending':'descending'):'none');h.title='Ordenar por '+h.textContent.trim()});
    if(st.sort)fOrdena(t,st.sort.i,st.sort.dir);fAplica(t)})}

  if(e.target.classList.contains('f-q'))st.q=e.target.value;else if(e.target.classList.contains('f-d')||e.target.classList.contains('f-v'))st[e.target.dataset.k]=e.target.value;else return;fAplica(t)});
