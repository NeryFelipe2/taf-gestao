<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{var _t=localStorage.getItem("taf_tema");if(_t==="light"||_t==="dark")document.documentElement.setAttribute("data-theme",_t)}catch(e){}</script>
<title>TAF Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23141416%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 font-family=%27Arial%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27white%27%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/*@@STYLE@@*/
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo" id="marca-logo">G</div><span id="marca">Grupo Nery</span></div>
    <div class="obra-sel" data-act="obras" role="button" tabindex="0" title="Trocar de obra" style="cursor:pointer"><div class="av" id="obra-av">342</div><div><b id="obra-nome">Carregando…</b><span id="obra-sub">Centro de custo</span></div></div>
    <div class="apres" id="apres"><button class="apbtn" id="ap-btn" data-act="apres-menu" aria-haspopup="true" aria-expanded="false" aria-label="Modo apresentação"><svg class="ic" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Apresentação</span><b id="ap-estado"></b></button>
      <div class="apmenu" id="ap-menu" role="group" aria-label="Ocultar na tela" hidden>
        <button role="switch" aria-checked="false" data-act="apres-tog" data-k="obra">Ocultar nome da obra</button>
        <button role="switch" aria-checked="false" data-act="apres-tog" data-k="forn">Ocultar fornecedores e parceiros</button>
        <button role="switch" aria-checked="false" data-act="apres-tog" data-k="val">Ocultar valores (R$)</button>
      </div></div>
    <div class="sec">Workspace</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div id="userbox" style="display:none"></div>
      <div><label style="margin-top:0">Papel</label><select id="role"></select></div>
      <div class="tema-ic" role="group" aria-label="Tema da tela"><button id="t-claro" data-act="tema" data-t="light" aria-pressed="false" aria-label="Tema claro" title="Claro"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button id="t-escuro" data-act="tema" data-t="dark" aria-pressed="false" aria-label="Tema escuro" title="Escuro"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
      <div class="note"><b><span class="dot"></span><span id="src-label"></span></b><span id="src-sub"></span></div>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span class="apfaixa" id="ap-faixa" hidden>Modo apresentação</span><span id="crumb">Hoje</span><span class="sp"></span><span id="today"></span>
      <button class="btn sm" id="ajuda" data-act="ajuda" aria-label="Ajuda do seu papel">Ajuda</button>
      <button class="icon-btn" id="bell" aria-label="Alertas"><svg class="ic" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="pip" id="pip"></span></button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Alertas da obra"><header>Alertas da obra<button class="btn sm" id="close">Fechar</button></header><div class="list" id="alerts"></div></aside>
<div class="modal" id="modal"><div class="mbox" id="mbox" role="dialog" aria-modal="true" aria-label="Janela"></div></div>
<div class="modal" id="login" style="z-index:80;background:var(--bg)"><div class="mbox" id="lbox" style="width:min(420px,100%)"></div></div>

<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
/*@@SCRIPT@@*/
</script>
</body>
</html>
