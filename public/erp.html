  else if(el.classList.contains('f-csv')){const H=[...t.tHead.rows[t.tHead.rows.length-1].cells].map(h=>h.textContent.trim()),R=fLinhas(t).filter(r=>r.style.display!=='none').map(r=>[...r.cells].map(c=>c.textContent.trim().replace(/[;\n\r]+/g,' ')).join(';'));
    const txt=H.join(';')+'\n'+R.join('\n');try{navigator.clipboard.writeText(txt).then(()=>toast(R.length+' linhas copiadas'),()=>toast('Não consegui copiar'))}catch(x){toast('Não consegui copiar')}}});
/* duplo clique em uma célula de coluna com lista: filtra por aquele valor */

const KPI_KEYS=['provProd','provServ','contrato','fat','faturadoAnt','recebido','aReceber','atrRec','fatDireto','impDeb','impCred','pago','aPagar','atrasado','gasto','requisicao','custoFixo','cfPrev','prov','provTot','saldoFat','comprom','lucroPainel','lucroPrev'];
const fdz=s=>s?s.split('-').reverse().join('/'):'';
const cadDe=(cod,t)=>{const f=typeof cadFichaDe==='function'?cadFichaDe(cod,t):{},r=f.resp||{};
  return {empresa:EMPRESA_PAD,gerente:(r.gerente&&r.gerente.nome)||'',vendedor:(r.vendedor&&r.vendedor.nome)||'',tipo:f.tipo||'',situacao:f.situacao||'',...(CAD_PAD[cod]||{}),...(((t||{}).par||{}).cad||{})}};

/* ---------- estado de cada obra e extrato importado ---------- */
function lerT(cod){if(S.D&&S.D.obra.codigo===cod)return S.t;if(MODO_CH)return CH.T[cod]||null;if(MODO_SB)return null;
  return memo('lt'+cod,()=>{try{return JSON.parse(localStorage.getItem(cod==='342'?KEY:KEY+'_'+cod)||'null')}catch(e){return null}})}
function tEf(cod){const t=lerT(cod);if(t)return {...novoT(),...t};return memo('te'+cod,()=>{const n=novoT(),ex=S.extr&&S.extr[cod];if(ex)aplicaExtrato(n,ex);return n})}
async function extratoDe(cod){S.extr=S.extr||{};if(cod in S.extr)return S.extr[cod];return S.extr[cod]=(window.TAF_EXTRATO&&window.TAF_EXTRATO[cod])||null}
function aplicaExtrato(t,ex){const lote='extrato-'+ex.obra;t.lfxs=(t.lfxs||[]).filter(l=>l.lote!==lote);
  ex.nat.forEach((n,i)=>t.lfxs.push({id:'nat-'+ex.obra+'-'+i,tipo:'nat',origem:'Importado',lote,corte:ex.corte,...n}));
  (ex.lanc||[]).forEach((l,i)=>t.lfxs.push({id:'lan-'+ex.obra+'-'+i,tipo:'gasto',detalhe:true,origem:'Importado',lote,forn:l.parceiro,numero:l.nota,desc:l.topDesc,venc:l.venc,valor:l.valorNota,pago:l.dtBaixa,
    origemTxt:l.origem,rd:l.rd,provTxt:l.prov,nota:l.nota,empresa:l.empresa,parceiro:l.parceiro,desdob:l.desdob,valorNota:l.valorNota,dtNeg:l.dtNeg,dtBaixa:l.dtBaixa,vendComp:l.vendComp,top:l.top,topDesc:l.topDesc,tipoMov:l.tipoMov,natCod:l.natCod||''}));
  t.par=t.par||{};t.par.extratoCorte=ex.corte}
async function seedExtrato(){const cod=S.D.obra.codigo,ex=await extratoDe(cod);if(!ex||S.t.par.extratoSeed)return;
  aplicaExtrato(S.t,ex);S.t.par.extratoSeed=true;log('extrato',cod,'importar','',ex.nat.length+' naturezas, '+(ex.lanc||[]).length+' lançamentos (corte '+ex.corte+')');save()}
/* pedido aprovado sem nota (provisão): vem de contaObra() (05_motor_de_regras.js), a conta única */
const provOcsSplit=t=>{const r={prod:0,serv:0};contaObra(t).lin.forEach(({nat,comp:v})=>{if(['MO','EQP','TER'].includes(nat))r.serv+=v;else r.prod+=v});r.prod=r2(r.prod);r.serv=r2(r.serv);return r};
const provOcs=t=>r2(contaObra(t).ocs.reduce((s,x)=>s+x.comp,0));
/* roda uma função "como se" a obra de outro estado estivesse aberta (sem tocar em nada que fica gravado) */
function comObra(t,O,fn){const pv=provLigada(),sv={t:S.t,D:S.D,X:S.X,m:S.memo,p:S.provTmp};S.provTmp=pv;S.t=t;S.D={obra:O,items:[]};S.X={venda:O.valor_contrato,comp:provOcs(t)};S.memo=null;
  try{return fn()}finally{S.t=sv.t;S.D=sv.D;S.X=sv.X;S.memo=sv.m;S.provTmp=sv.p}}
function kpisObra(cod){if(S.D&&S.D.obra.codigo===cod)return painelCalc();const c=S.cart&&S.cart[cod];if(!c||!c.obra)return null;return memo('ko'+cod,()=>comObra(tEf(cod),c.obra,painelCalcRaw))}
function somaObras(cods){const T={};KPI_KEYS.forEach(k=>T[k]=0);cods.forEach(c=>{const k=kpisObra(c);if(k)KPI_KEYS.forEach(x=>T[x]=r2(T[x]+(+k[x]||0)))});return T}

/* ---------- filtros do painel (valem para todas as obras; ficam no navegador) ---------- */
function fltGet(){if(S.flt)return S.flt;let f=null;try{f=JSON.parse(localStorage.getItem('taf_flt')||'null')}catch(e){}return S.flt=f||{empresa:[],gerente:[],vendedor:[],tipo:[],situacao:[],obras:[]}}
const fltSalva=()=>{try{localStorage.setItem('taf_flt',JSON.stringify(S.flt))}catch(e){}};
const cadObra=cod=>cadDe(cod,lerT(cod));
const valFlt=(g,cod)=>g==='obras'?cod:(cadObra(cod)[g]||NAOINF);
function opcoesFlt(g){if(g==='obras')return OBRAS_PADRAO.map(([c,n])=>[c,c+' · '+n.replace(/^SANEAGO · /,'')]);
  const u=new Set(CAD_LISTAS[g]||[]);OBRAS_PADRAO.forEach(([c])=>u.add(valFlt(g,c)));if(g==='empresa')u.add(EMPRESA_PAD);return [...u].filter(Boolean).sort().map(v=>[v,v])}
const obrasSel=()=>{const f=fltGet();return OBRAS_PADRAO.map(o=>o[0]).filter(c=>GRUPOS_FLT.every(([g])=>{const L=f[g]||[];return !L.length||L.includes(valFlt(g,c))}))};
const nFlt=()=>{const f=fltGet();return GRUPOS_FLT.reduce((s,[g])=>s+((f[g]||[]).length?1:0),0)};
const provPref=()=>{try{return localStorage.getItem('taf_prov')!=='0'}catch(e){return S.provOff!==true}};

ACOES['flt-clear']=()=>{S.flt={empresa:[],gerente:[],vendedor:[],tipo:[],situacao:[],obras:[]};fltSalva();render()};

/* ---------- tela: filtros, cartões e composição ---------- */
const KCARDS=[['gasto','Gasto','bad'],['custoFixo','Custo fixo','warn'],['prov','Prov. gasto','warn'],['fat','Faturado','ok'],['fatDireto','Fat. direto','info'],['saldoFat','Saldo a faturar','mut'],['impostos','Impostos','bad'],['lucro','Lucro','']];
const pct=(v,b)=>b?((v/b)*100).toFixed(2).replace('.',',')+' %':'0,00 %';
function kcard(k,t,cls,T){const sub=l=>`<div class="ksub">${l}</div>`,B=T.contrato;let v=0,s='';
  if(k==='gasto'){v=T.gasto;s=sub('Pago: '+brl(T.pago))+sub('A pagar: '+brl(T.aPagar))+sub('Atrasado: '+brl(T.atrasado))+sub('Requisição: '+brl(T.requisicao))}
  else if(k==='custoFixo'){v=T.custoFixo;s=sub(pct(T.custoFixo,B)+' do contrato')+sub('Previsto: '+brl(T.cfPrev))}
  else if(k==='prov'){v=T.prov;s=provPref()?sub('Produtos: '+brl(T.provProd))+sub('Serviços: '+brl(T.provServ)):sub('Provisão desligada nos filtros')}
  else if(k==='fat'){v=T.fat;s=sub('Anteriormente: '+brl(T.faturadoAnt))+sub('Recebido: '+brl(T.recebido))+sub('A receber: '+brl(T.aReceber))+sub('Atrasado: '+brl(T.atrRec))}
  else if(k==='fatDireto'){v=T.fatDireto;s=sub('Compras faturadas direto ao cliente')}
  else if(k==='saldoFat'){v=T.saldoFat;s=sub(pct(T.saldoFat,B)+' do contrato')}
  else if(k==='impostos'){v=T.impDeb;s=sub('Débito: '+brl(T.impDeb))+sub('Crédito: '+brl(T.impCred))}
  else{v=T.lucroPainel;cls=v<0?'bad':'ok';s=sub(pct(v,B)+' do contrato')+sub('Com custo fixo previsto: '+brl(T.lucroPrev))}
  return `<button class="kcard ${cls}" data-act="kdet" data-k="${k}" aria-label="${t}: ${brl(v)}. Ver detalhe"><span class="kt">${t}</span><span class="kv">${brl(v)}</span>${s}<span class="kgo" aria-hidden="true">Ver detalhe ›</span></button>`}
function composicao(cods,T){const linha=(rot,k)=>{const B=Math.max(1,k.contrato),w=v=>Math.max(0,Math.min(100,v/B*100)),cf=Math.max(k.custoFixo,k.cfPrev),
    seg=[['Faturado',k.fat,'var(--ok)'],['Gasto',k.gasto,'var(--bad)'],['Custo fixo (previsto)',cf,'var(--warn)'],['Prov. gasto',k.prov,'var(--info)']];
    return `<div class="crow"><span class="cl">${esc(rot)}</span><span class="cbar" role="img" aria-label="${esc(rot)}: ${seg.map(x=>x[0]+' '+brl(x[1])).join(', ')}">${seg.map(([n,v,c])=>v>0?`<i style="width:${Math.max(.6,w(v))}%;background:${c}" title="${n}: ${brl(v)}"></i>`:'').join('')}</span><span class="cv ${k.lucroPainel<0?'neg':''}">${brl(k.lucroPainel,true)}</span></div>`};
  const rows=cods.map(c=>{const k=kpisObra(c);return k?linha(c,k):''}).join('')+(cods.length>1?linha('Total',T):'');
  return `<div class="card" style="margin-top:14px"><div class="in"><div class="panel-t">Composição do contrato</div><div class="sub">Cada barra é o contrato (100%). À direita, o lucro do painel.</div>${rows}
  <div class="legend"><span><i style="background:var(--ok)"></i>Faturado</span><span><i style="background:var(--bad)"></i>Gasto</span><span><i style="background:var(--warn)"></i>Custo fixo (previsto)</span><span><i style="background:var(--info)"></i>Prov. gasto</span><span><i style="background:var(--line)"></i>Saldo do contrato</span></div></div></div>`}
function painelFiltros(){const f=fltGet();
  return `<span class="fwrap"><button class="pill${nFlt()?' on':''}" data-act="flt-open" aria-haspopup="dialog" aria-expanded="${!!S.popFlt}">Filtros${nFlt()?` · ${nFlt()}`:''} <span aria-hidden="true">▾</span></button>
  ${S.popFlt?`<div class="fpanel" role="dialog" aria-label="Filtros do painel">${GRUPOS_FLT.map(([g,t])=>`<fieldset><legend>${t}${(f[g]||[]).length?` <b>${f[g].length}</b>`:''}</legend>${opcoesFlt(g).map(([v,l])=>`<button role="checkbox" aria-checked="${(f[g]||[]).includes(v)}" data-act="flt-tog" data-g="${g}" data-v="${esc(v)}"><i></i>${esc(l)}</button>`).join('')}</fieldset>`).join('')}
  <div class="facts"><button class="btn sm" data-act="flt-clear">Limpar tudo</button><button class="btn sm dark" data-act="flt-open">Pronto</button></div></div>`:''}</span>`}
function painelInicio(){if(OBRAS_PADRAO.some(([c])=>!(S.cart&&S.cart[c])))setTimeout(cartCarrega,0);
  const cods=obrasSel(),T=somaObras(cods),f=fltGet(),chips=GRUPOS_FLT.flatMap(([g,t])=>(f[g]||[]).map(v=>`<button class="pill x" data-act="flt-tog" data-g="${g}" data-v="${esc(v)}" title="Remover filtro">${esc(g==='obras'?v:v)} ×</button>`)).join('');
  const bar=`<div class="pbar" style="margin-top:0">${painelFiltros()}${chips}<button class="pill${provPref()?' on':''}" role="switch" aria-checked="${provPref()}" data-act="prov-tog">Considera provisão de gasto: ${provPref()?'sim':'não'}</button>${podeCad()?'<button class="pill" data-act="cad-obra">Cadastro da obra</button>':''}<span class="presumo">${cods.length} de ${OBRAS_PADRAO.length} obras · acumulado até hoje</span></div>`;
  if(!cods.length)return bar+`<div class="card" style="margin-top:12px"><div class="in"><div class="empty">Nenhuma obra com esses filtros. <button class="btn sm" data-act="flt-clear">Limpar filtros</button></div></div></div>`;
  return bar+`<div class="kgrid" style="margin-top:10px">${KCARDS.map(([k,t,c])=>kcard(k,t,c,T)).join('')}</div>${composicao(cods,T)}`}

/* ============ DA TAREFA À COMPRA, AO CUSTO E AO BM (modo chave) ============
   Parte de uma tarefa do cronograma da semana (Ciclo) e mostra, com os vínculos que existem de verdade:
   tarefa -> solicitação -> cotação -> pedido -> recebimento -> nota (custo), e tarefa -> eventos que ela alimenta -> medição -> boletim -> NF -> recebimento.
   Os números vêm da função taf_erp_rastro (mesmas regras do ERP). Nada aqui pressupõe 1 tarefa = 1 pedido = 1 item de BM. */
const CANTEIRO={sem_pedido:['mute','Ainda sem pedido'],aguarda_aprovacao:['warn','Pedido aguarda aprovação'],pedido_emitido:['warn','Pedido emitido: o material ainda não chegou'],
  recebido_parcial:['warn','Chegou parte do material'],recebido:['ok','Material recebido no canteiro'],solicitacao_nao_encontrada:['bad','Solicitação não encontrada']};
const SOL_TXT={enviada:'Enviada',em_cotacao:'Em cotação',atendida:'Atendida (pedido emitido)',cancelada:'Cancelada'};
const OC_TXT={em_alcada:'Aguarda alçada',aprovada:'Aprovado',recebida_parcial:'Recebido em parte',recebida:'Recebido',cancelada:'Cancelada',reprovada:'Reprovado'};
const RS={tarefa:null,crono:null,dados:null,carregando:false,erro:'',todos:false,sig:'',dem:(+new URLSearchParams(location.search).get('demanda')||null),demandas:[]};
/* a tela se refaz sozinha quando o que foi lançado aqui (solicitação, pedido, recebimento, nota, medição, boletim, NF, recebimento) já foi gravado no banco */
const rsSig=()=>{const s=JSON.stringify(['elos','sols','ocs','notas','meds','bcs','fats','recs'].map(k=>S.t[k]||[]));let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h+':'+s.length};
const rsSincronizado=()=>!SB.busy&&sbDocs().every(d=>SB.sync[d.id]===JSON.stringify(d.dados));
async function rastroCrono(){if(RS.crono)return RS.crono;
  const r=await chRpc('taf_ciclo_ler',{p_chave:CH.chave,p_obra:SB.obraId,p_seg:null,p_quem:CH.quem||null});
  RS.crono=(r.crono||[]).map(a=>({id:a.id,nome:a.nome,tipo:a.tipo,fase:a.fase,ini:a.ini,fim:a.fim}));
  RS.comps=((r.semana||{}).comps||[]).map(c=>c.ativ||c.id).filter(Boolean);RS.seg=r.seg;rastroDem(r);return RS.crono}
/* demandas do Ciclo (taf_ciclo_ler): o ERP só lê; a demanda continua uma só, com o mesmo número nas três telas */
function rastroDem(r){RS.demandas=(r.demandas||[]).map(d=>({num:d.num,area:d.area,oque:d.oque,resp:d.resp,prazo:d.prazo,efetivo:d.efetivo||d.prazo,nova_data:d.nova_data,
  ativs:d.ativs||[],item:d.item,situacao:d.situacao,ref_ext:d.ref_ext,vezes:d.vezes||0}))}
async function rastroRelerDem(){try{rastroDem(await chRpc('taf_ciclo_ler',{p_chave:CH.chave,p_obra:SB.obraId,p_seg:null,p_quem:CH.quem||null}))}catch(e){/* mantém as que já tinha */}}
const AREA_ROT={TECNICA:'Técnica',OPERACIONAL:'Operacional',SUPRIMENTOS:'Suprimentos (compras)',ADMINISTRATIVA:'Administrativa',FINANCEIRA:'Financeira',ECONOMICA:'Econômica',DIRETORIA:'Diretoria',CLIENTE:'Cliente / fiscal'};
const DEM_SIT={aberta:['warn','Aberta'],respondida:['warn','Respondida'],resolvida:['ok','Resolvida'],cancelada:['mute','Cancelada']};
const demDaTarefa=id=>(RS.demandas||[]).filter(d=>(d.ativs||[]).includes(id)&&d.situacao!=='cancelada');
async function rastroCarrega(id,manter){RS.tarefa=id;if(!manter)RS.dados=null;RS.erro='';RS.carregando=true;RS.sig=rsSig();if(!manter)render();
  if(RS.crono&&!manter&&RS.demLidas)await rastroRelerDem();RS.demLidas=true;

   ${avisoSqlCalc()}${avisoSqlLinhas()}<div class="toolbar"><select id="rs-sel" style="min-width:min(520px,100%)"><option value="">Escolha a tarefa…</option>${opt}</select></div>${corpo}`}
/* demandas do Ciclo que travam esta tarefa, e se cada uma já tem compra ligada (o vínculo guarda o número da demanda) */
function rastroDemandas(d){
  const L=demDaTarefa(d.ativ.id);if(!L.length)return `<div class="card"><div class="in"><div class="panel-t">Demandas desta tarefa no Ciclo</div><div class="sub">Nenhuma demanda aberta aponta para a tarefa ${esc(d.ativ.id)}. A compra pode ser ligada mesmo assim.</div></div></div>`;

   <div class="sub">A demanda é a do Marko, com o mesmo número. A compra fica no ERP e só é ligada aqui; nada é digitado duas vezes.</div></div></div>`}
function rastroCorpo(d){
  /* primeiro os eventos dos itens que já têm compra ligada, depois o próprio evento da tarefa, depois os mais próximos no tempo */
  const evCompra=new Set((d.compras||[]).map(c=>c.item&&c.item.evento).filter(Boolean));

     <td>${it?`<span class="mono">${esc(it.codigo)}</span><div class="mut" style="font-size:11.5px">evento ${esc(it.evento||'—')} · pacote ${esc(it.pacote||'—')}</div>`:'<span class="mut">item fora da planilha</span>'}</td>
     <td>${s.cotacoes?`${s.cotacoes} cotação(ões), menor ${brl(s.menor_cotacao)}`:'sem cotação'}${ocs.map(o=>`<div class="mono" style="font-size:12px">${esc(o.num)} · ${esc(OC_TXT[o.status]||o.status)}</div>`).join('')}</td>
     <td>${rsPill(cn[0],cn[1])}${ocs.length?`<div class="mut" style="font-size:11.5px">${num(ocs.reduce((t,o)=>t+(+o.recebido_qtd||0),0))} de ${num(ocs.reduce((t,o)=>t+(+o.qtd||0),0))} ${esc((it||{}).unidade||'')}</div>`:''}</td>

/* ============ OBRA NOVA PELA TELA (53) ============
   A Gestão ou a Diretoria cria a obra no ERP e grava o orçamento dela a partir da planilha do órgão (.xlsx ou .csv), sem programa de fora.
   Passos: 1) código, nome e contratante; 2) planilha: aba, linha do cabeçalho e colunas; 3) prévia com avisos; 4) gravar.
   O banco confere tudo de novo (fonte/erp/sql/04_obra_nova.sql: taf_erp_obra_criar e taf_erp_base_gravar) e guarda a versão anterior.
   A obra nasce SEM meta de custo: o ERP abre e mostra o Orçamento, e a compra fica bloqueada até a meta ser definida (de propósito, 05_motor_de_regras.js).
   Formato da base = o que o ERP já lê (03b_chave.js, chBaseDe e chUsaBase): {D, origem}; D igual ao da obra fictícia 999 (teste/obra999.js).
   Segurança: o banco não abre o gzip, então a base gravada pela tela volta marcada "tela:" no base_sha (marca posta pelo banco) e o ERP
   abre essa base só pela lista fechada de campos (obnLimpaBase, abaixo). Texto que vai para a base e para o banco sai sem < > e aspas. */
CAN.obra_nova=['gestao','diretoria'];
const OBN_LIM_GZ=3000000,OBN_LIM_ITENS=5000;   /* os mesmos limites do banco */
const OBN_COD=/^[0-9A-Za-z][0-9A-Za-z._\/-]{0,39}$/,OBN_PAC=/^[0-9A-Za-z][0-9A-Za-z._\/-]{0,29}$/,OBN_EV=/^[0-9A-Za-z][0-9A-Za-z._\/-]{0,19}$/;
/* campos que a tela liga às colunas: [chave, rótulo, obrigatório] (preço: o unitário, o total ou os dois) */
const OBN_CAMPOS=[['codigo','Código do item',1],['descricao','Descrição',1],['unidade','Unidade',0],['qtd','Quantidade',1],['pu','Preço unitário',0],['total','Preço total',0],['evento','Evento',0],['pacote','Pacote',0]];
let ON=null;
/* sem obra aberta (a primeira obra do banco) S.t ainda não existe e can() não roda: vale só o papel */
const obnPode=()=>MODO_CH&&!CH.leitura&&(S.t&&S.t.par?can('obra_nova'):CAN.obra_nova.includes(S.role));
const obnNovo=cod=>({passo:1,cod:cod||'',nome:'',contratante:'',criada:false,arq:'',abas:[],aba:0,hdr:0,map:{},valor:'',valorDaSoma:false,papel:'',avisoAba:false,L:null,msg:'',grav:false,lendo:false});
/* papel que vai para o banco: o da chave pessoal; com a chave do site, o escolhido de propósito na prévia (nunca o padrão da entrada) */
const obnPapel=()=>CH.fixo?S.role:(ON&&ON.papel)||'';

/* ---------- ler a planilha (funções puras, testadas em teste/obra_nova.test.js) ---------- */
/* texto do cabeçalho sem acento, maiúsculo, só letras e números: "P.UNIT. (R$)" vira "P UNIT R" */
const obnNorm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
const obnBdi=(h,s)=>s+(/\bC BDI\b|\bCOM BDI\b/.test(h)?1:0)-(/\bS BDI\b|\bSEM BDI\b/.test(h)?2:0);
/* nota de cada campo para um cabeçalho (0 = não é este campo) */
const OBN_REGRA={
  codigo:h=>/^(ITEM|ITENS|N|NO|NUM|NUMERO|ITEM N|N ITEM|NO ITEM|NUMERO DO ITEM)$/.test(h)?5:/^COD(IGO)?( DO ITEM)?$/.test(h)?4:/\bITEM\b/.test(h)&&!/DESCRI|UNIT|TOTAL|QUANT/.test(h)?3:/\bCOD(IGO)?\b/.test(h)&&!/SINAPI|SICRO|ORSE|FONTE|BANCO|REF|EVENTO/.test(h)?2:0,
  descricao:h=>/^(DESCRICAO|DISCRIMINACAO|ESPECIFICACAO|DESCRICAO DOS SERVICOS|DESCRICAO DO SERVICO|SERVICO|SERVICOS)$/.test(h)?5:/DESCRI|DISCRIMIN|ESPECIFIC/.test(h)?4:/\bSERVICOS?\b/.test(h)?2:0,
  unidade:h=>/^(UN|UND|UNID|UNIDADE|UNIDADES|UM|UNID MEDIDA|UNIDADE DE MEDIDA)$/.test(h)?5:/\bUNIDADE\b/.test(h)?3:0,
  qtd:h=>/^(QUANT|QUANTIDADE|QTD|QTDE|QUANTID|QUANT TOTAL|QTD TOTAL|QUANTIDADE TOTAL)$/.test(h)?5:/\b(QUANT|QUANTIDADE|QTD|QTDE)\b/.test(h)&&!/UNIT|TOTAL R|PRECO|VALOR/.test(h)?3:0,
  pu:h=>/\bUNIT|\bUNITARIO\b|^PU$|^P U\b|\bPRECO UN\b|\bVALOR UN\b|\bVLR UN\b/.test(h)?obnBdi(h,/^(P UNIT|P UNITARIO|PRECO UNITARIO|PRECO UNIT|VALOR UNITARIO|VALOR UNIT|VLR UNIT|PU|CUSTO UNITARIO)$/.test(h)?5:3):0,
  total:h=>/\bTOTAL\b/.test(h)&&!/\bUNIT|\bQUANT|\bQTD|\bITEM\b|DESCRI/.test(h)?obnBdi(h,/^(TOTAL|P TOTAL|PRECO TOTAL|VALOR TOTAL|VLR TOTAL|TOTAL R|PRECO TOTAL R|VALOR TOTAL R|SUBTOTAL)$/.test(h)?5:3):0,
  evento:h=>/^(EVENTO|EVENTOS|COD EVENTO|CODIGO DO EVENTO|N EVENTO|EVENTO N)$/.test(h)?5:/\bEVENTO/.test(h)?3:0,
  pacote:h=>/^(PACOTE|PACOTES|PACOTE DE COMPRA|COD PACOTE)$/.test(h)?5:/\bPACOTE/.test(h)?3:0};
/* sugestão de colunas para uma linha de cabeçalho: {campo: índice da coluna}; a melhor nota ganha, empate fica com a coluna mais à esquerda */
function obnSugere(cab){
  const C=[];(cab||[]).forEach((c,k)=>{const h=obnNorm(c);if(!h)return;OBN_CAMPOS.forEach(([f],fi)=>{const n=OBN_REGRA[f](h);if(n>0)C.push([n,fi,k,f])})});
  C.sort((a,b)=>b[0]-a[0]||a[2]-b[2]||a[1]-b[1]);const m={},usada=new Set();
  C.forEach(([,,k,f])=>{if(m[f]==null&&!usada.has(k)){m[f]=k;usada.add(k)}});return m}
/* linha do cabeçalho: a das primeiras 40 que liga mais campos (pelo menos 3); senão a primeira */
function obnAchaCab(txt){let best=0,bn=2;for(let r=0;r<Math.min((txt||[]).length,40);r++){const n=Object.keys(obnSugere(txt[r])).length;if(n>bn){bn=n;best=r}}return best}
/* número da planilha: número de verdade, ou texto "1.234,56", "1234.56", "R$ 10,00", "(5,00)". dec = separador decimal provável do arquivo.
   Vazio ou "-" = null (vazio não é zero); texto que não é número = undefined. */
function obnNum(v,dec){
  if(v==null)return null;if(typeof v==='number')return Number.isFinite(v)?v:undefined;
  let s=String(v).replace(/R\$/gi,'').replace(/[\s ]/g,'');if(s===''||/^[-–—]$/.test(s))return null;
  let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  const v1=s.lastIndexOf(','),p1=s.lastIndexOf('.');
  if(v1>=0&&p1>=0)s=v1>p1?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(v1>=0)s=dec==='.'&&/^-?\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,''):(s.split(',').length===2?s.replace(',','.'):s);
  else if(p1>=0&&dec!=='.'&&/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  if(!/^-?\d+(\.\d+)?([eE][-+]?\d+)?$/.test(s))return undefined;
  const n=+s;return neg?-n:n}
/* texto de CSV: separador ; , ou tab (o que mais aparece fora de aspas na primeira linha com conteúdo), aspas duplas */
function obnCsv(t){
  t=String(t||'').replace(/^﻿/,'');const l1=(t.split(/\r?\n/).find(l=>l.trim())||'').replace(/"[^"]*"/g,'');
  const cont=c=>l1.split(c).length-1,sep=[';','\t',','].reduce((a,c)=>cont(c)>cont(a)?c:a,';');
  const rows=[];let row=[],cel='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cel+='"';i++}else q=false}else cel+=c;continue}
    if(c==='"'&&cel===''){q=true;continue}
    if(c===sep){row.push(cel);cel='';continue}
    if(c==='\r'||c==='\n'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cel);rows.push(row);row=[];cel='';continue}
    cel+=c}
  if(cel!==''||row.length){row.push(cel);rows.push(row)}
  return {rows,sep,dec:sep===','?'.':','}}
/* CSV do Excel brasileiro vem em Windows-1252; UTF-8 quando dá */
function obnDecod(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}}
const obnLetra=k=>{let s='';k++;while(k>0){const m=(k-1)%26;s=String.fromCharCode(65+m)+s;k=Math.floor((k-1)/26)}return s};
const obnTxt=v=>String(v??'').replace(/[\u0000-\u001f\u007f ]/g,' ').replace(/\s+/g,' ').trim();
/* texto que vai para a base e para o banco: < > e aspas viram ‹ › ″ (leem-se igual; o banco recusa os de verdade) */
const obnSeguro=v=>obnTxt(v).replace(/</g,'‹').replace(/>/g,'›').replace(/"/g,'″');
const obnCodDe=v=>String(v??'').replace(/[\s ]/g,'').replace(/\.+$/,'');
/* código de pacote a partir do texto da planilha: "Tubos PVC" vira TUBOS_PVC (o nome fica como veio) */
const obnPacDe=v=>obnNorm(v).replace(/ /g,'_').slice(0,30);
const obnUnDe=v=>obnTxt(v).replace(/[<>&"']/g,'').slice(0,20);
/* lê as linhas abaixo do cabeçalho. aba = {raw, txt, dec, r0} (r0 = número da primeira linha da aba no Excel, a partir de 1).
   Devolve {linhas (itens e grupos na ordem dos códigos, com nivel e pai), erros (impedem gravar), avisos, totais}. */
function obnLinhas(aba,hdr,map){
  const raw=aba.raw||[],txt=aba.txt||raw,dec=aba.dec||',',r0=aba.r0||1,col=f=>map[f]==null||map[f]===''?null:+map[f];
  const cel=(r,f,bruto)=>{const k=col(f);if(k==null)return null;const x=(bruto?raw:txt)[r];return x?x[k]:null};
  const L=[],erros=[],ign=[],naoNum=[],codNum=[],semPreco=[],difTot=[],neg=[],evFora=[],qtdZero=[],sinais=[],pacs=new Map(),vistos=new Map();
  for(let r=hdr+1;r<raw.length;r++){const lin=r+r0;
    const cod=obnCodDe(cel(r,'codigo')),desc0=obnTxt(cel(r,'descricao')),desc=obnSeguro(desc0).slice(0,2000);
    if(!cod&&!desc)continue;
    if(!cod){ign.push({lin,desc});continue}
    const rc=cel(r,'codigo',true);if(typeof rc==='number'&&!Number.isInteger(rc))codNum.push(cod);
    const n=f=>{if(col(f)==null)return null;const b=cel(r,f,true),v=obnNum(b===''?null:b,dec);if(v===undefined){naoNum.push({lin,cod,campo:f,v:obnTxt(b)});return null}return v};
    const qtd=n('qtd'),pu=n('pu'),tot=n('total');
    if(!OBN_COD.test(cod)){erros.push(`Linha ${lin}: código "${cod.slice(0,40)}" com caractere não aceito (use números, letras, ponto, traço ou barra).`);continue}
    if(vistos.has(cod)){erros.push(`Código ${cod} repetido (linhas ${vistos.get(cod)} e ${lin}).`);continue}
    vistos.set(cod,lin);
    if(desc!==desc0.slice(0,2000))sinais.push(cod);
    /* vazio não é zero: só vira grupo a linha SEM quantidade e SEM preço unitário; quantidade 0 continua item (com aviso) */
    const grupo=qtd==null&&pu==null;
    const x={lin,codigo:cod,descricao:desc,tipo:grupo?'grupo':'item',tot};
    if(!grupo){
      x.unidade=obnUnDe(cel(r,'unidade'))||null;x.qtd=qtd;x.pu=pu;
      x.venda=tot!=null?r2(tot):(qtd!=null&&pu!=null?r2(qtd*pu):null);
      if(pu==null&&tot==null)semPreco.push(cod);
      if(qtd===0)qtdZero.push(cod);
      if(tot!=null&&pu!=null&&qtd!=null&&Math.abs(tot-r2(qtd*pu))>0.011)difTot.push({cod,qtd,pu,tot,conta:r2(qtd*pu)});
      if((qtd!=null&&qtd<0)||(pu!=null&&pu<0)||(tot!=null&&tot<0))neg.push(cod);
      const ev=obnCodDe(cel(r,'evento'));
      if(ev){if(!OBN_EV.test(ev)){erros.push(`Item ${cod}: evento "${ev.slice(0,20)}" com caractere não aceito.`);continue}x.evento=ev;if(!/^\d\.\d\.\d$/.test(ev))evFora.push(cod)}else x.evento=null;
      const pt=obnTxt(cel(r,'pacote')),pc=pt?obnPacDe(pt):'';
      if(pt&&!OBN_PAC.test(pc)){erros.push(`Item ${cod}: pacote "${pt.slice(0,30)}" sem letra ou número.`);continue}
      x.pacote=pc||null;if(pc&&!pacs.has(pc))pacs.set(pc,obnSeguro(pt).slice(0,80))}
    L.push(x)}
  L.sort((a,b)=>cmpCod(a.codigo,b.codigo));
  const cods=new Set(L.map(x=>x.codigo)),subItem=[];
  L.forEach(x=>{const p=x.codigo.split('.');x.nivel=p.length;x.pai=null;for(let k=p.length-1;k>0;k--){const c=p.slice(0,k).join('.');if(cods.has(c)){x.pai=c;break}}});
  const porCod=Object.fromEntries(L.map(x=>[x.codigo,x]));
  L.forEach(x=>{if(x.pai&&porCod[x.pai].tipo==='item'&&!subItem.includes(x.pai))subItem.push(x.pai)});
  const itens=L.filter(x=>x.tipo==='item'),grupos=L.filter(x=>x.tipo==='grupo');
  const difGrupo=grupos.filter(g=>g.tot!=null).map(g=>({cod:g.codigo,tot:r2(g.tot),soma:r2(itens.filter(i=>i.codigo.startsWith(g.codigo+'.')).reduce((s,i)=>s+(i.venda||0),0))})).filter(d=>Math.abs(d.tot-d.soma)>0.011);
  if(!itens.length)erros.push('Nenhum item com quantidade ou preço abaixo do cabeçalho: confira a linha do cabeçalho e as colunas.');
  if(itens.length>OBN_LIM_ITENS)erros.push(`São ${itens.length} itens; o limite é ${OBN_LIM_ITENS}.`);
  const semPonto=grupos.length>0&&L.every(x=>!x.codigo.includes('.'));
  return {linhas:L,erros,total:r2(itens.reduce((s,i)=>s+(i.venda||0),0)),nItens:itens.length,nGrupos:grupos.length,
    pacotes:[...pacs.entries()].map(([codigo,nome])=>({codigo,nome})),
    avisos:{semPreco,difTot,difGrupo,ign,naoNum,codNum,neg,evFora,subItem,semPonto,qtdZero,sinais}}}
/* aba do orçamento: a que liga mais campos no cabeçalho achado; ok = liga código, descrição, quantidade e um dos preços.
   Aba de capa ou resumo na frente não ganha da aba do orçamento; se nenhuma liga o mínimo, a tela avisa para escolher. */
function obnMelhorAba(abas){let best=-1,bn=-1,bok=false;

/* ---------- abrir a base gravada pela tela: lista fechada de campos (chamada em 03b_chave.js, chBaseDe) ----------
   O banco não abre o gzip: quem tem a chave pode mandar qualquer coisa dentro da base (taf_erp_base_gravar). Por isso a base com a
   marca "tela:" no base_sha (posta pelo banco, ninguém de fora tira) é refeita aqui campo a campo, antes de qualquer tela ver:
   - só os campos que esta tela grava (os do D da obra 999); o resto some, inclusive extrato, ficha e listas;
   - código, pacote, evento só com os caracteres que o banco aceita; unidade sem < > & aspas; natureza só MO, MAT, EQP, TER, ADM;
   - todo texto sem < > e aspas (viram ‹ › ″) e sem caractere de controle, com tamanho máximo; número só número de verdade;
   - nível e pai refeitos pelo código (pai que não existe ou em círculo não trava a árvore do Orçamento).

const OBN_NAT=['MO','MAT','EQP','TER','ADM'];
function obnLimpaBase(b,cod){
  const ob=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{},arr=v=>Array.isArray(v)?v:[];
  const tx=(v,n)=>typeof v==='string'||typeof v==='number'?obnSeguro(v).slice(0,n)||null:null;
  const nu=v=>typeof v==='number'&&Number.isFinite(v)?v:null;
  const cd=(v,re)=>typeof v==='string'&&re.test(v)?v:null;
  const dt=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v:null;
  const nat=v=>{const n={},o=ob(v);OBN_NAT.forEach(k=>{if(Object.prototype.hasOwnProperty.call(o,k)&&nu(o[k])!=null)n[k]=o[k]});return n};
  const comp=v=>Array.isArray(v)?v.slice(0,20).map(ob).filter(l=>OBN_NAT.includes(l.nat)&&nu(l.share)!=null).map(l=>({nat:l.nat,share:l.share})):null;
  const B=ob(b),D=ob(B.D),O=ob(D.obra),R=ob(D.relatorio),G=ob(B.origem);
  const pv=new Set(),pacotes=[];
  arr(D.pacotes).slice(0,2000).map(ob).forEach(p=>{const c=cd(p.codigo,OBN_PAC);if(!c||pv.has(c))return;pv.add(c);
    pacotes.push({codigo:c,nome:tx(p.nome,80)||c,meta:nu(p.meta),teto:nu(p.teto),fechar_ate:dt(p.fechar_ate),precisa_em_obra:dt(p.precisa_em_obra),
      responsavel:tx(p.responsavel,80),condicao_pagamento:tx(p.condicao_pagamento,80),observacoes:tx(p.observacoes,500)||''})});
  const ev=new Set(),eap=[];
  arr(D.eap).slice(0,20000).map(ob).forEach(x=>{const c=cd(x.codigo,OBN_COD);if(!c||ev.has(c))return;ev.add(c);
    eap.push(x.tipo_linha==='grupo'
      ?{codigo:c,descricao:tx(x.descricao,2000)||'',unidade:null,qtd:null,nivel:1,pai:null,tipo_linha:'grupo',preco_venda_total:null,meta_total:null,teto_total:null,meta_unit:null,evento:null,pacote:null,natureza:{}}
      :{codigo:c,descricao:tx(x.descricao,2000)||'',unidade:typeof x.unidade==='string'?obnUnDe(x.unidade)||null:null,qtd:nu(x.qtd),nivel:1,pai:null,tipo_linha:'item',
        preco_venda_total:nu(x.preco_venda_total),preco_venda_unit:nu(x.preco_venda_unit),meta_total:nu(x.meta_total),teto_total:nu(x.teto_total),meta_unit:nu(x.meta_unit),
        fonte_meta:tx(x.fonte_meta,80),status_cotacao:tx(x.status_cotacao,40),evento:cd(x.evento,OBN_EV),pacote:pv.has(x.pacote)?x.pacote:null,tipo:tx(x.tipo,40),
        composicao:comp(x.composicao),natureza:nat(x.natureza),hh_unit:nu(x.hh_unit)})});
  eap.sort((a,b)=>cmpCod(a.codigo,b.codigo));
  eap.forEach(e=>{const p=e.codigo.split('.');e.nivel=p.length;for(let k=p.length-1;k>0;k--){const c=p.slice(0,k).join('.');if(ev.has(c)){e.pai=c;break}}});
  const plano=arr(D.plano).slice(0,2000).map(ob).filter(x=>cd(x.codigo,OBN_PAC)).map(x=>({codigo:x.codigo,nome:tx(x.nome,120)||x.codigo,
    nivel:Number.isInteger(x.nivel)&&x.nivel>0&&x.nivel<10?x.nivel:x.codigo.split('.').length,natureza:tx(x.natureza,40)}));
  const banco_mo=arr(D.banco_mo).slice(0,500).map(ob).map(f=>({funcao:tx(f.funcao,60),equipe:tx(f.equipe,60),custo_hora:nu(f.custo_hora)})).filter(f=>f.funcao);
  const colunas={},gc=ob(G.colunas);OBN_CAMPOS.forEach(([f])=>{if(typeof gc[f]==='string'&&/^[A-Z]{1,3}$/.test(gc[f]))colunas[f]=gc[f]});
  return {D:{obra:{codigo:String(cod),nome:tx(O.nome,120)||'Obra '+cod,contratante:tx(O.contratante,80),contrato:tx(O.contrato,80),municipio:tx(O.municipio,80),
        valor_contrato:nu(O.valor_contrato),regime:tx(O.regime,80),tributos_nota:nu(O.tributos_nota)},
      pacotes,eap,plano,banco_mo,relatorio:{diferenca_contrato:nu(R.diferenca_contrato)||0,aviso:tx(R.aviso,300)}},
    origem:{tela:tx(G.tela,60),arquivo:tx(G.arquivo,200),aba:tx(G.aba,80),linha_cabecalho:nu(G.linha_cabecalho),colunas,itens:nu(G.itens),grupos:nu(G.grupos),total:nu(G.total),
      valor_contrato:nu(G.valor_contrato),valor_contrato_fonte:tx(G.valor_contrato_fonte,60),plano_de:cd(G.plano_de,/^\d{3}$/),quem:tx(G.quem,60),em:tx(G.em,40)}}}
/* gzip + base64 + sha256 (o banco confere o sha do texto base64) */
async function obnGz(obj){const st=new Blob([new TextEncoder().encode(JSON.stringify(obj))]).stream().pipeThrough(new CompressionStream('gzip'));
  const b=new Uint8Array(await new Response(st).arrayBuffer());let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
async function obnDesGz(b64){const st=new Blob([Uint8Array.from(atob(b64),c=>c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('gzip'));return new Response(st).text()}
async function obnSha(t){if(!(window.crypto&&crypto.subtle))throw new Error('Este navegador não calcula o sha256 (abra o site pelo endereço https).');
  const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
/* lê o arquivo escolhido: uma "aba" por planilha do Excel (ou uma só do CSV), com os valores brutos (números) e os textos */
async function obnLerArquivo(file){
  if(/\.(csv|txt)$/i.test(file.name)){const c=obnCsv(obnDecod(await file.arrayBuffer()));return [{nome:file.name.replace(/\.[^.]+$/,''),raw:c.rows,txt:c.rows,dec:c.dec,r0:1,c0:0}]}
  const X=await carregaXlsx(),wb=X.read(await file.arrayBuffer(),{type:'array',sheetRows:20001});
  return wb.SheetNames.map(n=>{const ws=wb.Sheets[n];if(!ws||!ws['!ref'])return {nome:n,raw:[],txt:[],dec:',',r0:1,c0:0};
    const R=X.utils.decode_range(ws['!ref']);R.e.c=Math.min(R.e.c,R.s.c+59);R.e.r=Math.min(R.e.r,R.s.r+20000);ws['!ref']=X.utils.encode_range(R);   /* planilha formatada até a última linha do Excel não trava a tela */
    return {nome:n,raw:X.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true}),txt:X.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',blankrows:true}),dec:',',r0:R.s.r+1,c0:R.s.c}})}

  if(/CARACTERE NAO ACEITO/.test(m))return 'Nome ou contratante com caractere não aceito (< > ou aspas).';

  if(/CRIADA COM CHAVE PESSOAL/.test(m))return 'Esta obra foi criada com chave pessoal: o orçamento dela só é gravado com a chave pessoal de Gestão ou Diretoria.';
  if(/GRANDE DEMAIS/.test(m))return 'Planilha grande demais para gravar ('+m.toLowerCase()+').';
  if(/ORCAMENTO RECUSADO/.test(m))return 'O banco recusou o orçamento: '+m.replace(/^ORCAMENTO RECUSADO/,'').trim();
  if(semRede(e))return 'Sem conexão: tente de novo quando tiver sinal.';
  return chMsg(e)};

    chLs('taf-erp-base-'+st.cod,JSON.stringify({sha:r.base_sha||'tela:'+sha,gz}));   /* o ERP abre a obra sem baixar a base de novo (sha com a marca "tela:" do banco) */
    const cod=st.cod;ON=null;closeModal();guardaObra(cod);S.tab={};S.view='eap';S.q='';

  catch(e){if(ON===st){st.grav=false;st.msg=(st.criada?'A obra '+st.cod+' foi criada, mas o orçamento não foi gravado: ':'Nada foi gravado: ')+obnErro(e);obnPinta()}else toast('Não abriu a obra: '+obnErro(e))}};

/* ============ META PELA TELA (item 2 do "sistema sozinho"): o engenheiro propõe, a Gestão aprova ============
   Chave da obra "meta_tela" (Compras → Parâmetros → Chaves desta obra). Padrão DESLIGADA: desligada, o ERP é o de sempre e nada daqui chama o banco.
   Ligada:
   - Orçamento → item: "Propor meta" (Engenheiro, Gerente, Gestão, Diretoria) e, para Gestão e Diretoria com chave pessoal, "Mudar meta" (direto, com motivo).
   - Pacotes → pacote: "Propor meta do pacote" (meta, teto, fechar até) e "Mudar meta do pacote".
   - Obra → Metas: "Para aprovar" (Gerente, Gestão e Diretoria com chave pessoal, regra D4; quem propôs não decide), "Minhas propostas" e o histórico.
   - A Gestão também remaneja saldo (Remanejar passa a ser de Gerente, Gestão e Diretoria).
   Onde fica cada coisa:
   - a proposta e a decisão ficam no banco, tabela taf_erp_meta_prop (fonte/erp/sql/05_meta.sql), pelas funções taf_erp_meta_*;
   - a meta aprovada entra no estado da obra pelo MESMO caminho do Atualizar pela planilha: estado.baseOv do item (meta, teto, meta unitária),
     estado.basePac do pacote, versão nova da linha de base (só depois de congelada, como na planilha), histórico com o motivo e auditoria (antes e depois).
     Quem aplica é o navegador de quem grava o estado (Gestão, Diretoria ou Gerente: taf_erp_salvar só grava o estado desses papéis).
   - o histórico da linha de base guarda o número da proposta aplicada (hist[].prop). Ao abrir a obra (e a cada minuto com a obra aberta), quem grava o estado
     aplica as aprovadas que ainda não estão no histórico, na ordem em que foram aprovadas; campo que uma aprovada mais nova já mudou não volta para o valor velho.
   - conferência antes de aplicar: na decisão o banco guarda o que a tela de quem decidiu mostrava (antes_decisao: meta, teto, fechar até). Só entra sozinha a
     aprovada cujo item (ou pacote) ainda está como na decisão. Se mudou depois (remanejamento, planilha ou um navegador com o estado velho que gravou por cima
     da meta já aplicada), ela NÃO entra sozinha: fica "precisa de conferência" na aba Metas e Gerente, Gestão ou Diretoria (chave pessoal) escolhem
     "Aplicar mesmo assim" ou "Não aplicar", com motivo. As duas escolhas ficam no histórico da linha de base (a de "não aplicar" sem versão nova).
   - prep() sem valor grudado (só com a chave ligada): quando o estado lido do banco perde a linha de base de um item ou pacote, o item volta ao valor da carga,
     em vez de continuar com o último valor que este navegador aplicou.
   RISCOS QUE FICAM (ver também o cabeçalho de 05_meta.sql):
   - o ERP não confere a versão do estado antes de gravar: um navegador com o estado velho grava por cima do que outro gravou. A meta que some assim volta a entrar
     (ou fica para conferência), mas o que o navegador velho apagou de outros (remanejamento, planilha) se perde. A janela sem a meta no banco dura até um
     navegador de Gestão, Diretoria ou Gerente com a obra aberta ler o banco (a cada 30 s) e esta tela conferir (a cada minuto), ou, se nenhum estiver aberto,
     até alguém desses papéis abrir a obra. A correção de fundo é conferir a versão antes de gravar (chSync e taf_erp_salvar), fora deste item.
   - a regra D4 vale para a proposta e a decisão. O estado da obra (onde a meta mora) o taf_erp_salvar grava também para a chave geral com papel Gestão,
     Diretoria ou Gerente escolhido na tela: com a chave geral dá para mudar baseOv/metaOv pela planilha, pelo Remanejar de Gerente e Diretoria ou chamando a

    if(n||f){save();toast(f&&!n?'Meta aprovada fica de fora da linha de base: registrado no histórico':n===1?'Meta aprovada entrou na linha de base v'+S.t.versao:n+' metas aprovadas entraram na linha de base (v'+S.t.versao+')')}
    return n+f}
  finally{MP.aplicando=false}}

/* ---------- leitura da lista (ao abrir a obra e a cada minuto) ---------- */
async function metaSincroniza(){
  const ob=metaObra(),B=metaBack();if(!ob||MP.busy||!metaTela())return;
  MP.busy=true;if(MP.obra!==ob){MP.lista=[];MP.erro='';MP.falhas={}}
  let L=null,err='';
  try{if(!B)throw new Error('A meta pela tela usa o banco do site (entrada com a chave do site).');L=await B.listar()}catch(e){err=metaMsg(e)}
  if(metaObra()===ob){if(L)MP.lista=Array.isArray(L)?L:[];MP.erro=err;MP.obra=ob;MP.quando=Date.now()}
  MP.busy=false;
  if(metaObra()!==ob)return;
  try{await metaAplicarAprovadas()}catch(e){MP.erro=metaMsg(e)}
  if(metaObra()===ob)render()}
/* chamado no fim de cada render(): agenda a leitura quando a obra mudou ou a lista tem mais de um minuto. Nunca lê dentro do render. */
function metaPass(){if(!metaTela()||!S.D||MP.busy)return;const ob=metaObra();if(!ob)return;
  if(MP.obra!==ob||Date.now()-MP.quando>60000){MP.quando=Date.now();setTimeout(()=>metaSincroniza(),0)}}
window.addEventListener('focus',()=>{MP.quando=0});

/* ---------- regras da tela (o banco confere de novo) ---------- */
function metaPodePropor(){if(!metaTela())return [false,''];if(!metaBack())return [false,'A meta pela tela usa o banco do site.'];if(metaLeitura())return [false,'Chave só de leitura.'];
  if(!can('metaPropor'))return [false,'Só Engenheiro, Gerente, Gestão ou Diretoria propõem meta.'];return [true,'']}
function metaPodeDireta(){if(!metaTela()||!metaBack()||metaLeitura())return [false,''];if(!can('metaDireta'))return [false,'Só Gestão e Diretoria mudam a meta direto.'];
  if(!metaPessoal())return [false,'Mudar a meta direto exige a chave pessoal.'];return [true,'']}
function metaPodeDecidir(p){if(!metaTela()||!p||p.situacao!=='pendente')return [false,''];if(metaLeitura())return [false,'Chave só de leitura.'];
  if(!can('metaDecidir'))return [false,'Só Gerente, Gestão ou Diretoria decidem meta.'];
  if(!metaPessoal())return [false,'Decidir exige a chave pessoal: com a chave geral do site ninguém aprova.'];
  if(metaEhMeu(p))return [false,'Quem propôs não decide a própria proposta.'];return [true,'']}
/* conferência de aprovada que não entrou porque o item mudou depois da decisão: as mesmas regras de decidir (chave pessoal, quem propôs não decide)
   e quem confere tem de gravar o estado (aplica no navegador dele) */
function metaPodeConferir(p){if(!metaTela()||!p||p.situacao!=='aprovada')return [false,''];if(metaLeitura())return [false,'Chave só de leitura.'];
  if(!can('metaDecidir'))return [false,'Só Gerente, Gestão ou Diretoria conferem meta.'];
  if(!metaPessoal())return [false,'Conferir exige a chave pessoal: com a chave geral do site ninguém decide meta.'];
  if(!metaGravaEstado())return [false,'Este acesso não grava a linha de base.'];
  if(p.origem!=='direta'&&metaEhMeu(p))return [false,'Quem propôs não decide a própria proposta.'];return [true,'']}
const metaPendenteDe=(alvo,cod)=>metaDaObra().find(p=>p.alvo===alvo&&p.codigo===cod&&p.situacao==='pendente');
const metaDecidirMinhas=()=>metaDaObra().filter(p=>p.situacao==='pendente'&&metaPodeDecidir(p)[0]);
const metaConferirMinhas=()=>metaConflitos().filter(x=>metaPodeConferir(x.p)[0]).map(x=>x.p);
const metaParaMim=()=>[...metaConferirMinhas(),...metaDecidirMinhas()];

/* situação de uma proposta, em texto de obra */
function metaSituacao(p){
  if(p.situacao==='pendente')return ['warn','aguardando decisão'];
  if(p.situacao==='recusada')return ['bad','recusada'];
  if(p.situacao==='cancelada')return ['mute','cancelada'];
  const h=metaMarcas(S.t).get(String(p.id));
  if(h)return h.fora?['mute','aprovada · não entrou (conferência de '+(h.quem||'?')+')']:['ok','na linha de base v'+h.versao];
  if(MP.falhas[p.id])return ['bad','aprovada · não entrou: '+MP.falhas[p.id]];
  const f=metaPlanoTela().find(x=>String(x.p.id)===String(p.id));
  if(f&&!f.campos.length)return ['mute','aprovada · superada por outra mais nova'];
  if(f&&f.conflito)return ['bad','aprovada · precisa de conferência'];
  return ['info','aprovada · entra na linha de base quando Gestão, Diretoria ou Gerente abrir a obra']}

/* valores de hoje do item ou do pacote (o que a tela mostra) */
function metaHoje(alvo,cod){
  if(alvo==='item'){const i=S.byCod[cod];if(!i||i.tipo_linha!=='item')return null;
    return {nome:i.descricao||'',venda:+i.preco_venda_total||0,meta:i.meta_total,teto:i.teto_total,real:S.sd&&S.sd[cod]?S.sd[cod].comp+S.sd[cod].real:0}}
  const p=S.D.pacotes.find(x=>x.codigo===cod);if(!p)return null;const its=p._it||[];
  return {nome:p.nome||'',venda:its.reduce((s,i)=>s+(+i.preco_venda_total||0),0),meta:p.meta,teto:p.teto,fechar_ate:p.fechar_ate,somaMeta:its.reduce((s,i)=>s+(+i.meta_total||0),0),
    somaTeto:its.reduce((s,i)=>s+(+i.teto_total||0),0),n:its.length,soma:typeof pacSoma==='function'&&pacSoma(p)}}
const metaMargem=(venda,meta)=>venda>0&&meta!=null?(venda-meta)/venda:null;
const metaR2=v=>v==null||v===''||!Number.isFinite(+v)?null:r2(+v);
/* o que a tela mostra hoje, só os campos da meta, com 2 casas (vai para o banco como antes_decisao) */
const metaHojeCampos=h=>({meta:metaR2(h&&h.meta),teto:metaR2(h&&h.teto),fechar_ate:h&&h.fechar_ate?String(h.fechar_ate).slice(0,10):null});
const metaPct=x=>x==null?'—':(x*100).toFixed(1).replace('.',',')+'%';

/* ---------- botões no item (Orçamento) e no pacote (Pacotes) ---------- */
function metaBotoes(alvo,cod){
  if(!metaTela())return '';const pp=metaPodePropor(),pd=metaPodeDireta(),pe=metaPendenteDe(alvo,cod),rot=alvo==='pacote'?' do pacote':'';
  return `${pe?`<span class="pill warn" title="${esc('Proposta nº '+pe.id+' de '+pe.proposto_por)}">proposta aguardando</span>`:''}`+

   (can('metaDireta')?`<button class="btn" data-act="meta-mudar" data-alvo="${alvo}" data-cod="${esc(cod)}" ${pd[0]?'':`disabled title="${esc(pd[1])}"`}>Mudar meta${rot}</button>`:'')}

/* ---------- janela de propor (ou mudar direto) ---------- */
let MTX=null;   /* {alvo, cod, direta} da janela aberta */
function metaModal(alvo,cod,direta){

    <div><div class="k-l">Teto hoje</div><div class="v ${h.meta!=null&&h.teto!=null&&h.meta>h.teto?'neg':''}">${h.teto==null?'—':brl(h.teto)}</div></div><div><div class="k-l">Margem hoje</div><div class="v ${mg!=null&&mg<0?'neg':''}">${metaPct(mg)}</div></div></div>

   ${pe?`<div class="alert" style="margin-top:12px"><div class="g" style="color:var(--warn)">!</div><div><b>Já tem proposta esperando decisão</b><p>Nº ${esc(pe.id)} de ${esc(pe.proposto_por)} em ${metaQuando(pe.proposto_em)}: ${esc(metaResumoProp(pe))}. Motivo: ${esc(pe.motivo)}</p>${metaEhMeu(pe)?`<button class="btn sm no" data-act="meta-cancelar" data-id="${esc(pe.id)}">Cancelar a minha proposta</button>`:''}</div></div>`:''}
   <div class="${alvo==='pacote'?'g3':'g2'}" style="margin-top:10px"><div><label for="mt-m">Meta nova (R$)</label><input id="mt-m" data-mt="1" type="number" inputmode="decimal" step="0.01" min="0" placeholder="mantém"></div>

const metaResumoProp=p=>[metaTem(p,'meta')?'meta '+brl(p.meta):'',metaTem(p,'teto')?'teto '+brl(p.teto):'',metaTem(p,'fechar_ate')?'fechar até '+fdata(String(p.fechar_ate).slice(0,10)):''].filter(Boolean).join(', ');
/* lê a janela: {alvo, codigo, meta, teto, fechar_ate, motivo, antes} ou {erro} */
function metaLeForm(){const x=MTX;if(!x)return {erro:'Abra a janela de novo.'};const h=metaHoje(x.alvo,x.cod);if(!h)return {erro:'Item não encontrado.'};
  const m=metaNum(($('#mt-m')||{}).value),t=metaNum(($('#mt-t')||{}).value),f=x.alvo==='pacote'?String(($('#mt-f')||{}).value||'').trim()||null:null,mo=String(($('#mt-mo')||{}).value||'').trim();
  if(Number.isNaN(m)||Number.isNaN(t)||(m!=null&&m<0)||(t!=null&&t<0))return {erro:'Valor inválido.'};
  if(f&&!/^\d{4}-\d{2}-\d{2}$/.test(f))return {erro:'Data inválida.'};
  const o={alvo:x.alvo,codigo:x.cod,meta:m==null?null:r2(m),teto:t==null?null:r2(t),fechar_ate:f,motivo:mo,antes:{meta:metaR2(h.meta),teto:metaR2(h.teto),venda:metaR2(h.venda),...(x.alvo==='pacote'?{fechar_ate:h.fechar_ate||null}:{})}};
  const igual=(a,b)=>a!=null&&b!=null&&Math.abs(a-b)<0.005;
  if(o.meta==null&&o.teto==null&&!o.fechar_ate)return {erro:'Informe a meta nova, o teto novo'+(x.alvo==='pacote'?' ou a data':'')+'.',o};
  if((o.meta==null||igual(o.meta,h.meta))&&(o.teto==null||igual(o.teto,h.teto))&&(!o.fechar_ate||o.fechar_ate===h.fechar_ate))return {erro:'Nada muda: os valores são iguais aos de hoje.',o};
  if(mo.length<3)return {erro:'Escreva o motivo.',o};
  return {o,h}}
/* prévia ao digitar: como fica meta, teto e margem */
function metaPrevia(){const e=$('#mt-prev');if(!e||!MTX)return;const r=metaLeForm(),o=r.o,h=r.h||metaHoje(MTX.alvo,MTX.cod);if(!o||!h){e.innerHTML='';return}
  const meta=o.meta!=null?o.meta:h.meta,teto=o.teto!=null?o.teto:h.teto,venda=h.venda,txt=[];

async function metaConfOk(){const x=MCX;if(!x)return;const m=String(($('#mc-m')||{}).value||'').trim();

/* tabela: colunas da esquerda e, por último, o proposto (ou aprovado); licitado, folga até o teto e margem */

  const val=(v,c)=>{const x=(v||{})[c];return x==null||x===''?null:c==='fechar_ate'?String(x).slice(0,10):+x};
  const metaN=novo('meta')!=null?novo('meta'):val(ult,'meta'),tetoN=novo('teto')!=null?novo('teto'):val(ult,'teto');

   ${linha('Meta','meta',v=>brl(v))}${linha('Teto','teto',v=>brl(v))}

   <tr><td>Folga até o teto</td>${cols.map(k=>fol(val(k.v,'meta'),val(k.v,'teto'))).join('')}${fol(metaN,tetoN)}</tr>
   ${p.alvo==='pacote'?`<tr><td>Margem dos itens (hoje)</td><td class="r">${metaPct(metaMargem(venda,h.somaMeta))}</td>${cols.slice(1).map(()=>'<td class="r mut">igual</td>').join('')}<td class="r mut">igual</td></tr>`

ACOES['acs-desativadas']=()=>{S.tab.acdes=S.tab.acdes?0:1;render()};

/* ---------- tela ---------- */
const acData=s=>s?fdata(String(s).slice(0,10)):'—';
const acPapelPill=p=>`<span class="pill ${p==='diretoria'?'bad':p==='gestor'?'warn':p==='leitura'?'mute':'info'}">${esc(AC_PAPEL[p]||p)}</span>`;
const acLinks=(p,curto)=>(AC_ENTRADA[p]||[]).filter(x=>!curto||x[0]!=='/').map(([u,t])=>curto?`<span class="mono">${esc(u)}</span>`:`<li><span class="mono">${esc(acOrigem()+u)}</span> · ${esc(t)}</li>`).join(curto?' ':'');
/* por que não tem botão de desativar, em poucas palavras (a frase inteira fica no title) */
const acBloqCurto=b=>/ROBO DO RESUMO/.test(b)?'Robô do resumo: só a Diretoria com todas.':/CHAVE SEM OBRA/.test(b)?'Chave sem obra: só a Diretoria com todas.':/PROPRIA/.test(b)?'É a sua chave.':/ULTIMA/.test(b)?'Última chave de Diretoria.':/SEM OUTRA DIRETORIA/.test(b)?'Única Diretoria com todas as obras.':/OBRA FORA/.test(b)?'Tem obra fora da sua chave.':/SEM PERMISSAO/.test(b)?'Só a Diretoria desativa.':acMsg(b);
function acLinha(c){
  const des=!c.ativo,av=(c.avisos||[]);
  const acao=des?'':c.bloqueio?`<span class="sub" style="font-size:12px" title="${esc(acMsg(c.bloqueio))}">${esc(acBloqCurto(c.bloqueio))}</span>`:`<button class="btn sm no" data-act="acs-desativar" data-id="${esc(c.id)}">Desativar</button>`;
  return `<div class="ac-i${des?' ac-des':''}" data-ac="${esc(c.id)}">
    <div class="ac-nome"><b>${esc(c.nome)}</b>${c.sua?' <span class="pill ok">você</span>':''}${c.robo?' <span class="pill info">robô do resumo</span>':''}<div class="mut" style="font-size:12.5px">${c.robo?'manda o e-mail do horário; desativar para o envio (troque em Resumo para o diretor)':c.pessoa?esc(c.pessoa):'sem pessoa (só leitura)'}</div></div>
    <div data-r="Papel">${acPapelPill(c.papel)}</div>
    <div data-r="Obras"><span class="mono">${(c.obras||[]).map(esc).join(', ')}</span>${+c.outras_obras>0?`<div class="mut" style="font-size:12px" title="A chave tem mais ${+c.outras_obras} ${+c.outras_obras===1?'obra':'obras'} que não estão na sua. Só quem cuida delas vê quais são.">+${+c.outras_obras} ${+c.outras_obras===1?'obra':'obras'} fora da sua chave</div>`:''}</div>
    <div data-r="Situação">${des?`<span class="pill mute">desativada</span><div class="mut" style="font-size:12px">${esc(acData(c.desativado_em))}${c.desativado_por?' · '+esc(c.desativado_por):''}</div>`:'<span class="pill ok">ativa</span>'}</div>
    <div data-r="Criada em">${esc(acData(c.criado_em))}<div class="mut" style="font-size:12px">${c.criado_por?esc(c.criado_por):'pelo banco'}</div></div>
    <div data-r="Entra por">${acLinks(c.papel,true)}</div>
    <div class="ac-act">${acao}</div>
    ${av.length&&!des?`<div class="ac-av">${av.map(a=>`<div><span class="pill warn">aviso</span> ${esc(a)}</div>`).join('')}</div>`:''}
  </div>`}
function viewAcessos(){
  acCss();
  const head=`<div class="head"><div><h1>Acessos</h1><p class="lead">A chave pessoal de cada pessoa. Com ela o nome vai certo em tudo o que a pessoa lançar e o papel vem da chave, não da tela. Só a chave pessoal aprova.</p></div>`;
  if(!MODO_CH)return head+`</div><div class="sub">Disponível no site, com a chave do TAF.</div>`;
  if(!acVisivel())return head+`</div><div class="sub">Só a Diretoria e o gestor cuidam dos acessos, com a chave pessoal.</div>`;
  if(!AC.dados&&!AC.pend&&!AC.erro)acCarregar();
  const D=AC.dados,pode=(D&&D.pode_criar)||[];
  const botoes=`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="acs-atualizar">Atualizar</button>${pode.length?`<button class="btn dark" data-act="acs-novo">${D.partida&&D.ator.tipo==='geral'?'Criar a primeira chave de Diretoria':'Criar acesso'}</button>`:''}</div></div>`;
  if(AC.erro)return head+botoes+`<div class="card" style="margin-top:12px"><div class="in"><div class="neg">${esc(AC.erro)}</div></div></div>`;
  if(!D)return head+botoes+'<div class="sub" style="padding:18px">Carregando…</div>';
  const a=D.ator||{},geral=a.tipo==='geral';
  const quem=`<div class="note" style="margin-top:4px"><b>${esc(a.nome||'sem nome')} · ${geral?'chave geral do site':esc(AC_PAPEL[a.papel]||a.papel)+' · chave pessoal'}</b>${pode.length?'Você cria: '+pode.map(p=>esc((AC_PAPEL[p]||p).toLowerCase())).join(', ')+'.':'Você não cria acesso.'}</div>`;
  if(geral){
    const txt=D.partida?`<div class="panel-t">Partida</div><p class="sub" style="margin:4px 0 10px">Ainda não existe chave de Diretoria. Crie a primeira agora, em nome de quem vai cuidar dos acessos. Com ela, a Diretoria cria as outras (gestor, engenheiro, encarregado). <b>Depois disso a chave geral do site não cria mais nenhuma.</b></p><button class="btn dark" data-act="acs-novo">Criar a primeira chave de Diretoria</button>`
      :`<div class="panel-t">Entre com a sua chave pessoal</div><p class="sub" style="margin:4px 0 0">Você entrou com a chave geral do site. A lista de acessos, criar e desativar ficam só com a chave pessoal de Diretoria ou de gestor. Peça a sua para a Diretoria.</p>`;
    return head+botoes+quem+`<div class="card" style="margin-top:12px"><div class="in">${txt}</div></div>`}
  const L=D.chaves||[],at=L.filter(c=>c.ativo),des=L.filter(c=>!c.ativo),ver=S.tab.acdes?L:at,nav=at.filter(c=>(c.avisos||[]).length).length;
  const frase=`${at.length} ${at.length===1?'chave ativa':'chaves ativas'}${des.length?' e '+des.length+' '+(des.length===1?'desativada':'desativadas'):''}.${nav?` ${nav} com aviso.`:''}`;
  return head+botoes+quem+acEscopo(D)+`<p class="sub" style="margin:12px 0 0">${frase} ${des.length?`<button class="btn sm" data-act="acs-desativadas">${S.tab.acdes?'Esconder as desativadas':'Mostrar as desativadas'}</button>`:''}</p>
   <div class="ac-l" role="list">${ver.length?`<div class="ac-i ac-h" aria-hidden="true"><div>Nome e pessoa</div><div>Papel</div><div>Obras</div><div>Situação</div><div>Criada em</div><div>Entra por</div><div></div></div>`+ver.map(acLinha).join(''):'<div class="sub" style="padding:12px">Nenhuma chave pessoal ainda.</div>'}</div>
   <div class="sub" style="margin-top:12px">A chave só aparece uma vez, na hora de criar. Perdeu? Desative e crie outra. Desativada para de funcionar na hora, em todos os aparelhos.</div>`}

/* em que obras o ator cuida de acesso: a Diretoria limitada e o gestor só nas obras da chave; obra nova sem Diretoria aparece para quem tem todas */
function acEscopo(D){const a=D.ator||{},ob=(a.obras||[]).map(esc).join(', '),sd=D.sem_diretoria||[];let h='';
  if(a.papel==='diretoria'&&!a.geral)h+=`<div class="sem amarelo" style="margin-top:10px"><span class="pill warn">obras</span><span>Sua chave de Diretoria vale só nas obras <b class="mono">${ob}</b>. Você cria e desativa acesso só nelas e só vê as chaves que têm obra em comum com você.</span></div>`;
  if(a.papel==='gestor')h+=`<div class="sub" style="margin-top:10px">Você cuida dos acessos das obras <b class="mono">${ob}</b>. Aqui aparecem só as chaves que têm obra em comum com você.</div>`;
  if(a.geral&&sd.length)h+=`<div class="sem amarelo" style="margin-top:10px"><span class="pill warn">obra nova</span><span>${sd.length===1?'A obra':'As obras'} <b class="mono">${sd.map(esc).join(', ')}</b> ainda ${sd.length===1?'não tem':'não têm'} chave de Diretoria. Você já pode dar acesso de engenheiro e encarregado nela. Para a Diretoria ver no ERP: crie uma chave de Diretoria com todas as obras, inclusive ${sd.length===1?'esta':'estas'}, e desative a antiga com a nova.</span></div>`;
  return h}

/* estilo da lista: só variáveis do tema do ERP (vale no claro, no escuro e dentro do Centro); no celular cada chave vira um cartão */
function acCss(){if(typeof document==='undefined'||!document.head||document.getElementById('ac-css'))return;const s=document.createElement('style');s.id='ac-css';
  s.textContent='.ac-l{display:flex;flex-direction:column;gap:6px;margin-top:10px}'+
  '.ac-i{display:grid;grid-template-columns:minmax(0,2fr) minmax(128px,1fr) minmax(0,.8fr) minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1fr) 130px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px 12px}'+
  '.ac-i.ac-h{background:var(--panel-2);border-color:transparent;font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:6px 12px}'+
  '.ac-i.ac-des{background:var(--panel-2)}.ac-i.ac-des .ac-nome b{color:var(--ink-3)}.ac-act{justify-self:end;text-align:right}'+
  '.ac-av{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}.ac-nome{min-width:0;overflow-wrap:anywhere}'+
  '.ac-chave{font:600 17px var(--mono);letter-spacing:.03em;resize:none;line-height:1.4;overflow:hidden}'+
  '.ac-obs{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:8px 10px}'+
  '.ac-obs label{display:flex;gap:8px;align-items:flex-start;text-transform:none;font-family:inherit;letter-spacing:0;font-size:13px;color:var(--ink);margin:0}.ac-obs input{width:auto;margin-top:3px}'+
  '@media (max-width:820px){.ac-i{grid-template-columns:1fr 1fr}.ac-i.ac-h{display:none}.ac-i .ac-nome,.ac-i .ac-act{grid-column:1/-1}.ac-act{justify-self:start;text-align:left}'+
  '.ac-i [data-r]::before{content:attr(data-r);display:block;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}}';
  document.head.appendChild(s)}

/* ---------- criar ---------- */
/* nenhuma obra vem marcada (o padrão é o mínimo), a não ser quando só existe uma */
function acObrasHtml(O){const um=O.length===1;
  return O.map(o=>`<label><input type="checkbox" class="ac-ob" value="${esc(o.codigo)}" ${um?'checked':''}><span><b class="mono">${esc(o.codigo)}</b> · ${esc(o.nome||'')}<br><span class="mut" style="font-size:12px">${o.planejador?(o.engenheiro?'engenheiro no planejador: '+esc(o.engenheiro):'no planejador'):'sem cronograma no planejador'}</span></span></label>`).join('')}
ACOES['acs-novo']=()=>{const D=AC.dados;if(!D||!(D.pode_criar||[]).length)return toast('Você não cria acesso.');
  const P=D.pode_criar,ini=P.includes('engenheiro')?'engenheiro':P[0],O=D.obras||[];
  if(!O.length)return toast('Nenhuma obra no sistema para dar acesso.');

   <label for="ac-papel">Papel</label><select id="ac-papel">${P.map(p=>`<option value="${esc(p)}" ${p===ini?'selected':''}>${esc(AC_PAPEL[p]||p)}</option>`).join('')}</select>
   <div id="ac-faz" class="sub" style="margin-top:4px">${esc(AC_FAZ[ini]||'')}</div>
   <label for="ac-pessoa">Pessoa (o nome que vai em tudo o que ela lançar)</label><input id="ac-pessoa" autocomplete="off" maxlength="60" placeholder="nome e sobrenome">
   <div id="ac-aviso"></div>
   <label for="ac-nome">Nome da chave (para achar na lista; vazio = o nome da pessoa)</label><input id="ac-nome" autocomplete="off" maxlength="60" placeholder="ex.: celular da obra">
   <label>Obras (marque só as que a pessoa precisa)</label><div class="ac-obs" id="ac-obs">${acObrasHtml(O)}</div>
   <div id="ac-msg" class="sub" style="margin-top:8px" role="alert"></div>
   <div class="acts"><button class="btn" data-act="fechar">Cancelar</button><button class="btn dark" data-act="acs-criar-ok">Criar e mostrar a chave</button></div>`);

const acObrasMarcadas=()=>[...document.querySelectorAll('.ac-ob:checked')].map(e=>e.value);
/* o planejador só reconhece como do engenheiro o que está no nome do engenheiro da obra: avisa antes de criar */
function acPintaAviso(){const box=document.getElementById('ac-aviso');if(!box)return;const D=AC.dados||{},p=($('#ac-papel')||{}).value,pes=(($('#ac-pessoa')||{}).value||'').trim().replace(/\s+/g,' ');

  const obs=(D.obras||[]).filter(o=>acObrasMarcadas().includes(o.codigo)&&o.planejador&&o.engenheiro&&o.engenheiro!==pes);
  box.innerHTML=obs.map(o=>`<div class="sem amarelo" style="margin-top:8px"><span class="pill warn">nome</span><span>Obra ${esc(o.codigo)}: o engenheiro no planejador é <b>${esc(o.engenheiro)}</b>. ${pes?'Com outro nome, as demandas, as áreas e as tarefas do engenheiro não aparecem como desta pessoa.':'Use o mesmo nome.'} <button class="btn sm" data-act="acs-usar-nome" data-n="${esc(o.engenheiro)}">Usar ${esc(o.engenheiro)}</button></span></div>`).join('')}

document.addEventListener('input',e=>{if(e.target&&e.target.id==='ac-pessoa')acPintaAviso()});
document.addEventListener('change',e=>{const t=e.target;if(!t)return;

  else if(t.classList&&t.classList.contains('ac-ob'))acPintaAviso()});
ACOES['acs-criar-ok']=async el=>{if(AC.criando)return;const msg=t=>{const m=$('#ac-msg');if(m){m.textContent=t;m.style.color='var(--bad)'}};

  if(!papel)return msg('Escolha o papel.');if(!pessoa&&papel!=='leitura')return msg('Informe a pessoa.');if(!pessoa&&!nome)return msg('Informe o nome da chave.');

    AC.dados=null;AC.erro='';acMostraChave(r)}
  catch(e){msg(acMsg(e));if(el)el.disabled=false}
