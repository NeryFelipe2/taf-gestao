<style>

const estadoObra=()=>({frozen:S.t.frozen,versao:S.t.versao,hist:S.t.hist,metaOv:S.t.metaOv,baseOv:S.t.baseOv,basePac:S.t.basePac,par:S.t.par});
const DOCS=[['sols','sol'],['elos','elo'],['ocs','oc'],['notas','nf'],['titulos','tit'],['meds','med'],['aud','aud'],['apts','apt'],['rsts','rst'],['atvs','atv'],['tars','tar'],['bcs','bc'],['fats','fat'],['recs','rec'],['lans','lan'],['lfxs','lfx'],['ctbs','ctb'],['ests','est'],['invs','inv'],['ctrs','ctr'],['prjs','prj'],['pats','pat'],['frts','frt'],['fmvs','fmv'],['cols','col'],['ptos','pto'],['ssts','sst'],['movs','mov'],['cobrs','cobr'],['fechs','fech'],['forns','forn'],['inss','ins'],['bancos','banc']];

const filaKey=()=>'taf_fila_'+SB.obraId;
function filaMerge(t){try{const q=JSON.parse(localStorage.getItem(filaKey())||'[]');if(!q.length)return;const rev=Object.fromEntries(DOCS.map(([k,tp])=>[tp,k]));
  q.forEach(d=>{const k=rev[d.tipo];if(k&&!SB.sync[d.id]&&!t[k].some(o=>o.id===d.id))t[k].unshift(d.dados)})}catch(e){}}

async function sbPool(k){if(!MODO_SB||!SB.obraId)return;SB.poolBusy=SB.poolBusy||{};if(SB.poolBusy[k])return;SB.poolBusy[k]=1;
  try{const r=await SB.c.rpc('reservar_numeros',{p_obra:SB.obraId,p_tipo:k,p_qtd:20});if(!r.error&&r.data!=null){const a=+r.data;SB.pool=SB.pool||{};SB.pool[k]=[...(SB.pool[k]||[]),...Array.from({length:20},(_,i)=>a+i)]}}catch(e){}
  SB.poolBusy[k]=0}
async function sbSync(){
  if(SB.busy){sbSyncSoon();return}SB.busy=true;
  try{
    const docs=sbDocs().filter(d=>{const j=JSON.stringify(d.dados);if(SB.sync[d.id]===j)return false;d._j=j;return true});
    if(docs.length){const {error}=await SB.c.from('documento').upsert(docs.map(d=>({id:d.id,obra_id:d.obra_id,tipo:d.tipo,dados:d.dados})),{onConflict:'id'});if(error)throw error;docs.forEach(d=>SB.sync[d.id]=d._j)}
    const est=JSON.stringify(estadoObra());
    if(est!==SB.estado){const {error}=await SB.c.from('obra').update({estado:JSON.parse(est)}).eq('id',SB.obraId);if(error)throw error;SB.estado=est}
    try{localStorage.removeItem(filaKey())}catch(_){}
  }catch(e){
    if(semRede(e)){const pend=sbDocs().filter(d=>SB.sync[d.id]!==JSON.stringify(d.dados));filaSalva(pend);toast('Sem sinal: '+pend.length+' registro(s) guardado(s) no aparelho. Sobem quando voltar a conexão.')}
    else{toast('Não salvou: '+(e.message||e));try{await sbPull();render()}catch(_){}}}
  SB.busy=false;
}
function aplicaDocs(est,docs){
  const t={...novoT(),...(est&&Object.keys(est).length?est:{})};const map=Object.fromEntries(DOCS.map(([k,tp])=>[tp,k]));
  DOCS.forEach(([k])=>t[k]=[]);SB.sync={};
  docs.forEach(r=>{if(!map[r.tipo])return;t[map[r.tipo]].push(r.dados);SB.sync[r.id]=JSON.stringify(r.dados)});
  const key=o=>parseInt(String(o.id||'').replace(/\D/g,'').slice(0,13))||0;
  DOCS.forEach(([k])=>{if(k!=='aud')t[k].sort((a,b)=>key(b)-key(a))});t.aud.sort((a,b)=>String(b.q).localeCompare(String(a.q)));
  filaMerge(t);S.t=t;if(S.D)prep();SB.estado=JSON.stringify(estadoObra());
}
async function sbPull(){
  const [o,d]=await Promise.all([SB.c.from('obra').select('estado').eq('id',SB.obraId).single(),SB.c.from('documento').select('id,tipo,dados').or(`obra_id.eq.${SB.obraId},tipo.in.(${GLOBAIS.join(',')})`).limit(10000)]);
  if(o.error||d.error)throw (o.error||d.error);aplicaDocs(o.data.estado,d.data);
}

/* ============ MODO CHAVE: o ERP dentro do site taf-gestao ============
   Entra com a mesma chave do site; lê e grava só pelas funções taf_erp_* do banco (nada direto nas tabelas).
   A chave fica só neste aparelho. Papel: fixo na chave pessoal; com a chave geral do site, escolhido na tela.
   Os dados fixos de cada obra (EAP, pacotes, metas, extrato, ficha) vêm do banco em gzip, nunca do código público. */
const CH={chave:'',quem:'',fixo:false,leitura:false,ver:0,obras:[],T:{}};
const CHK='taf-erp-chave',CHQ='taf-erp-quem',CHP='taf-erp-papel';
const chLs=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null};
async function chRpc(fn,body){
  const r=await fetch(CFG.supabaseUrl+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.supabaseKey,Authorization:'Bearer '+CFG.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){j=tx}
  if(!r.ok){const e=new Error((j&&j.message)||tx||('erro '+r.status));e.status=r.status;throw e}return j}
const chMsg=e=>{const m=String(e&&e.message||e);return /CHAVE INVALIDA/.test(m)?'Chave inválida.':/SEM ACESSO A OBRA/.test(m)?'Esta chave não abre esta obra.':
  /CHAVE SO DE LEITURA/.test(m)?'Chave só de leitura: nada foi salvo.':/INFORME SEU NOME/.test(m)?'Informe seu nome antes de lançar.':m};
const chMotivo=m=>{const s=String(m||'');let x;if(x=s.match(/^PAPEL (\w+) NAO GRAVA (\w+)$/))return 'o papel '+((ROLES[x[1].toLowerCase()]||{}).n||x[1])+' não grava este tipo de registro';
  if(x=s.match(/^COMPETENCIA (\S+) FECHADA$/))return 'competência '+x[1].split('-').reverse().join('/')+' fechada';if(/REABRE/.test(s))return 'só a Diretoria reabre competência';return s.toLowerCase()};
const chArgs=o=>({p_chave:CH.chave,p_obra:SB.obraId,p_quem:CH.quem||null,...o});

/* ---------- dados fixos da obra (gzip+base64 no banco, guardados no aparelho pela impressão) ---------- */
async function chGunzip(b64){const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const st=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(st).text())}
const chShaGuardado=cod=>{try{const c=JSON.parse(chLs('taf-erp-base-'+cod)||'null');return c&&c.gz?c.sha:null}catch(e){return null}};
function chUsaBase(cod,b){window.TAF_OBRAS=window.TAF_OBRAS||{};window.TAF_OBRAS[cod]=b.D;
  window.TAF_EXTRATO=window.TAF_EXTRATO||{};if(b.extrato)window.TAF_EXTRATO[cod]=b.extrato;else delete window.TAF_EXTRATO[cod];
  if(b.ficha)FICHA_PAD[cod]=b.ficha;
  if(b.listas)Object.entries(b.listas).forEach(([k,v])=>{const l=CAD_LISTAS[k];if(Array.isArray(l))(v||[]).forEach(x=>{if(!l.includes(x))l.push(x)})})}
async function chBaseDe(cod,r){let gz=r&&r.base_gz;
  if(!gz){try{const c=JSON.parse(chLs('taf-erp-base-'+cod)||'null');if(c&&c.sha===r.base_sha)gz=c.gz}catch(e){}}
  else chLs('taf-erp-base-'+cod,JSON.stringify({sha:r.base_sha,gz}));
  if(!gz)throw new Error('A obra '+cod+' ainda não tem dados no banco.');
  const b=await chGunzip(gz);chUsaBase(cod,b);return b}
const chPB={};
async function chObraData(cod){if(window.TAF_OBRAS&&window.TAF_OBRAS[cod])return window.TAF_OBRAS[cod];
  if(!chPB[cod])chPB[cod]=chRpc('taf_erp_base',{p_chave:CH.chave,p_obra:cod,p_quem:CH.quem||null}).then(r=>chBaseDe(cod,r)).then(b=>b.D).finally(()=>{delete chPB[cod]});
  return chPB[cod]}

async function chEntrar(k,q,doForm){
  const pp=chLs(CHP);const r=await chRpc('taf_erp_entrar',{p_chave:k,p_quem:q||null,p_papel:pp||null});
  CH.fixo=!!r.fixo;CH.leitura=!!r.leitura;CH.obras=r.obras||[];CH.quem=CH.fixo?(r.quem||q):q;
  if(!CH.quem){if(doForm)throw new Error('Informe seu nome.');chTela('Informe seu nome.');return}
  CH.chave=k;chLs(CHK,k);if(q)chLs(CHQ,q);login().classList.remove('open');
  S.role=CH.fixo?r.papel:(pp&&ROLES[pp]&&!['admin','pendente'].includes(pp)?pp:r.papel);
  SB.perfil={nome:CH.quem,papel:S.role};
  const rs=$('#role');if(CH.fixo)rs.parentNode.style.display='none';else{rs.parentNode.style.display='';rs.value=S.role}
  $('#userbox').style.display='block';
  $('#userbox').innerHTML=`<div class="note"><b>${esc(CH.quem)}</b><span>${CH.leitura?'Só leitura':CH.fixo?esc(ROLES[S.role]?.n||S.role)+' · chave pessoal':'Chave do site · papel escolhido acima'}</span><div style="margin-top:8px;display:flex;gap:6px"><a class="btn sm" href="/">Site</a><button class="btn sm" data-act="sair">Sair</button></div></div>`;
  OBRAS_PADRAO.length=0;CH.obras.forEach(o=>OBRAS_PADRAO.push([o.codigo,(o.contratante||'')+' · '+o.nome]));
  SB.obras=CH.obras.map(o=>({...o,id:o.codigo}));
  if(!SB.obras.length){telaAviso('Nenhuma obra no banco','As obras ainda não foram carregadas.');return}
  /* link vindo do Marko ou da gestão (/erp?obra=342&tarefa=T18&demanda=3): abre a obra e a tarefa pedidas, na tela "da tarefa à compra" */
  const po=new URLSearchParams(location.search).get('obra');
  await chCarregar(SB.obras.find(o=>o.codigo===po)||SB.obras.find(o=>o.codigo===obraGuardada())||SB.obras[0]);
}

/* a chave vem de onde a pessoa chegou: link do /marko (?de=marko) ou do /ciclo (?de=ciclo) usa a chave daquela tela; senão a última do ERP, a do Ciclo, a do Marko, a do site */

  try{SB.pool=JSON.parse(chLs(poolKey())||'{}')||{}}catch(e){SB.pool={}}

  S.D=JSON.parse(JSON.stringify(b.D));aplicaDocs(r.estado,r.docs);CH.ver=r.versao;

  pintaObra();$('#src-label').textContent='Banco do site TAF';$('#src-sub').textContent=CH.leitura?'Só leitura':'Tudo que você lança fica salvo para todos';
  if(!CH.leitura)Object.keys(PX).forEach(k=>{if(!(SB.pool[k]||[]).length||SB.pool[k].length<5)chPool(k)});
  /* o extrato financeiro histórico da obra (quando existe na base) NÃO é lançado sozinho: só entra quando alguém conferir e mandar */
  {const P=new URLSearchParams(location.search),pv=P.get('vista');   /* vindo do Centro de Gestão ou de um link: abre a tela pedida */

  render();chOutras();

/* estado das outras obras, só para ler (painel da carteira, RH, comparativo): nunca é gravado por aqui */
function chTDe(est,docs){const t={...novoT(),...(est&&Object.keys(est).length?est:{})},map=Object.fromEntries(DOCS.map(([k,tp])=>[tp,k]));
  DOCS.forEach(([k])=>t[k]=[]);(docs||[]).forEach(r=>{if(map[r.tipo])t[map[r.tipo]].push(r.dados)});return t}
async function chOutras(){const atual=SB.obraId;

async function chRecarrega(){const r=await chRpc('taf_erp_ler',chArgs({p_base_sha:chShaGuardado(SB.obraId)}));aplicaDocs(r.estado,r.docs);CH.ver=r.versao}
function chDelta(est,docs){const map=Object.fromEntries(DOCS.map(([k,tp])=>[tp,k]));
  (docs||[]).forEach(r=>{const k=map[r.tipo];if(!k)return;const a=S.t[k]||(S.t[k]=[]);const i=a.findIndex(o=>o.id===r.id);if(i>=0)a[i]=r.dados;else a.unshift(r.dados);SB.sync[r.id]=JSON.stringify(r.dados)});
  if(est&&Object.keys(est).length)Object.assign(S.t,est);
  if(S.D)prep();SB.estado=JSON.stringify(estadoObra())}
async function chPull(){if(!SB.obraId)return;
  const v=await chRpc('taf_erp_versao',{p_chave:CH.chave,p_obra:SB.obraId});if(+v===+CH.ver)return;
  const r=await chRpc('taf_erp_ler',chArgs({p_base_sha:chShaGuardado(SB.obraId),p_desde:CH.ver}));
  if(r.base_gz){await chCarregar(SB.obras.find(o=>o.codigo===SB.obraId)||{codigo:SB.obraId});return}
  chDelta(r.estado,r.docs);CH.ver=r.versao}

/* ---------- gravar: só o que mudou, em lotes; o banco confere papel e competência ---------- */
async function chSync(){
  if(SB.busy){sbSyncSoon();return}SB.busy=true;
  try{chLs(poolKey(),JSON.stringify(SB.pool||{}));
    const docs=sbDocs().filter(d=>{const j=JSON.stringify(d.dados);if(SB.sync[d.id]===j)return false;d._j=j;return true});
    const est=JSON.stringify(estadoObra()),estMudou=est!==SB.estado;
    if(!docs.length&&!estMudou)return;
    if(CH.leitura){toast('Chave só de leitura: nada foi salvo.');await chRecarrega();render();return}
    let rec=[],ign=false;
    for(let i=0;i<Math.max(docs.length,1);i+=200){const lote=docs.slice(i,i+200),comEst=i===0&&estMudou;
      if(!lote.length&&!comEst)break;
      const r=await chRpc('taf_erp_salvar',chArgs({p_papel:S.role,p_docs:lote.map(d=>({id:d.id,tipo:d.tipo,dados:d.dados})),p_estado:comEst?JSON.parse(est):null}));
      const bad=new Set((r.recusados||[]).map(x=>x.id));lote.forEach(d=>{if(!bad.has(d.id))SB.sync[d.id]=d._j});rec=rec.concat(r.recusados||[]);
      if(comEst){if(r.estado==='gravado')SB.estado=est;else ign=true}}
    try{localStorage.removeItem(filaKey())}catch(_){}
    if(rec.length||ign){toast(rec.length?'Não salvou '+rec.length+' registro(s): '+chMotivo(rec[0].motivo)+'.':'Linha de base e parâmetros só são salvos por Gestão, Diretoria ou Gerente.');await chRecarrega();render()}
  }catch(e){
    if(semRede(e)){const pend=sbDocs().filter(d=>SB.sync[d.id]!==JSON.stringify(d.dados));filaSalva(pend);toast('Sem sinal: '+pend.length+' registro(s) guardado(s) no aparelho. Sobem quando voltar a conexão.')}
    else{toast('Não salvou: '+chMsg(e));try{await chRecarrega();render()}catch(_){}}}
  finally{SB.busy=false}
}
async function chPool(k){if(!SB.obraId||CH.leitura)return;SB.poolBusy=SB.poolBusy||{};if(SB.poolBusy[k])return;SB.poolBusy[k]=1;
  try{const a=+(await chRpc('taf_erp_numeros',chArgs({p_tipo:k,p_qtd:20})));if(a){SB.pool=SB.pool||{};SB.pool[k]=[...(SB.pool[k]||[]),...Array.from({length:20},(_,i)=>a+i)];chLs(poolKey(),JSON.stringify(SB.pool))}}catch(e){}
  SB.poolBusy[k]=0}

if(MODO_CH){sbBoot=chBoot;sbSync=chSync;sbPull=chPull;sbPool=chPool;sbCarregar=chCarregar;sbSair=chSair;doLogin=chLoginForm;obraData=chObraData;viewLean=chViewLean;

/* ============ plano de contas ============ */
const MAT_PAC={FOFO:'4.2.01',PVC:'4.2.01',TCONC:'4.2.01',VALV:'4.2.02',PARAF:'4.2.08',ELET:'4.2.05',ELETS:'4.2.05',CONC:'4.2.04',ACO:'4.2.04',FORMA:'4.2.04',IMPER:'4.2.06',BOMBA:'4.2.07',GUIND:'4.2.07',CIVIL:'4.2.03'};
function contaPadrao(nat,pac){if(nat==='MO')return '4.1.01';if(nat==='EQP')return '4.3.01';if(nat==='TER')return '4.4.01';
  if(nat==='ADM')return pac==='CANT'?'4.5.02':pac==='PROJ'?'4.5.06':'4.5.01';return MAT_PAC[pac]||'4.2.08'}
const NATNOME={MO:'Mão de obra',MAT:'Material e equipamento',EQP:'Máquinas e veículos',TER:'Terceiros',ADM:'Indireto da obra'};

/* ============ motor de regras (espelha o SQL) ============ */
const byCod=()=>S.byCod;
const dominante=i=>{const n=i.natureza||{};const k=Object.keys(n).sort((a,b)=>n[b]-n[a])[0];
  if(n[k]>0)return k;return /material/.test(i.tipo||'')?'MAT':'TER'};
function prep(){
  const D=S.D;D.items=D.eap.filter(e=>e.tipo_linha==='item');
  D.items.forEach(i=>{const ov=S.t.baseOv&&S.t.baseOv[i.codigo];if(ov){i.meta_base=ov.meta_total;i.teto_total=ov.teto_total;i.status_cotacao=ov.status_cotacao;i.meta_unit=ov.meta_unit}else i.meta_base=i.meta_base??i.meta_total;if(S.t.metaOv[i.codigo]!=null)i.meta_total=S.t.metaOv[i.codigo];else i.meta_total=i.meta_base;i.nat=dominante(i)});
  D.pacotes.forEach(p=>{const o=S.t.basePac&&S.t.basePac[p.codigo];if(o)Object.assign(p,o)});
  S.byCod=Object.fromEntries(D.eap.map(e=>[e.codigo,e]));
  D.items.forEach(i=>{i.linhas=i.composicao||[{nat:i.nat,share:1}]});
  D.pacotes.forEach(p=>p._it=D.items.filter(i=>i.pacote===p.codigo));
}
function saldos(){
  const m={};S.D.items.forEach(i=>m[i.codigo]={comp:0,real:0});
  const fat={};
  S.t.notas.forEach(n=>{if(n.status==='lancada')return;n.rateio.forEach(l=>{m[l.item]&&(m[l.item].real+=+l.valor);if(n.oc)fat[n.oc+'|'+l.item]=(fat[n.oc+'|'+l.item]||0)+ +l.valor})});
  S.t.ocs.forEach(o=>{if(['aprovada','recebida_parcial','recebida'].includes(o.status)&&m[o.item])m[o.item].comp+=Math.max(0,o.valor-(fat[o.id+'|'+o.item]||0))});
  S.sd=m;S.D.items.forEach(i=>{const s=m[i.codigo];s.meta=i.meta_total;s.teto=i.teto_total;s.livre=r2(i.meta_total-s.comp-s.real)});
  return m;
}
function semaforo(cod,total,pendId){
  const i=S.byCod[cod];
  if(!S.t.frozen)return ['bloqueado','Linha de base não congelada','Obra sem linha de base não abre compra (E01). Peça à Gestão para congelar a versão 1 em Orçamento.'];
  if(i&&i.tipo_linha==='item'&&i.meta_total==null)return ['bloqueado','Item sem meta de custo','Esta obra ainda não tem estudo de custo: defina a meta do item (Orçamento → Atualizar pela planilha) antes de comprar.'];
  if(!i||i.tipo_linha!=='item'||i.meta_total==null)return ['bloqueado','Fora da planilha do contrato','Sem item com meta não há compra: abra pedido de inclusão ou aditivo.'];
  const s=S.sd[i.codigo];
  if(i.teto_total!=null&&s.comp+s.real+total>i.teto_total)return ['vermelho','Acima do teto','Teto '+brl(i.teto_total)+' (margem zero). Só a Diretoria aprova.'];
  if(total<=s.livre)return ['verde','Cabe no saldo da meta','Saldo livre '+brl(s.livre)+'. Vira pedido sem alçada.'];
  return ['amarelo','Acima da meta, até o teto','Saldo livre '+brl(s.livre)+'. O Gerente de contrato aprova com justificativa.'];
}
const SEM_CLASS={verde:'ok',amarelo:'warn',vermelho:'bad',bloqueado:'bad'};
const semPill=s=>`<span class="pill ${SEM_CLASS[s]||'mute'}">${s||'—'}</span>`;
const PX={sol:'SC',oc:'OC',nf:'NF',bm:'BM',apt:'AP',rst:'RE',tar:'TA',bc:'BC',fat:'FT'};
const fmtNum=(k,n)=>PX[k]+'-'+String(n).padStart(4,'0');
/* Numeração: com banco compartilhado os números vêm de faixas reservadas no servidor (sem repetir entre pessoas); sem sinal ou no modo aberto, maior número local + 1. */
function nextNum(k){
  if(MODO_SB&&SB.pool&&SB.pool[k]&&SB.pool[k].length){const n=SB.pool[k].shift();if(SB.pool[k].length<5)sbPool(k);return fmtNum(k,n)}
  const arr={sol:S.t.sols,oc:S.t.ocs,nf:S.t.notas,bm:S.t.meds,apt:S.t.apts,rst:S.t.rsts,tar:S.t.tars,bc:S.t.bcs,fat:S.t.fats}[k];
  const mx=arr.reduce((m,o)=>Math.max(m,parseInt(String(o.num||'').replace(/\D/g,''))||0),0);if(MODO_SB)sbPool(k);return fmtNum(k,mx+1)}
const ocFat=oc=>S.t.notas.filter(n=>n.oc===oc.id&&n.status!=='lancada').reduce((s,n)=>s+n.rateio.reduce((a,l)=>a+ +l.valor,0),0);
const ocRecebido=oc=>r2(oc.preco*(oc.recebido||0));
/* ============ derivados ============ */
function derive(){
  const D=S.D,X={};saldos();
  const it=D.items;
  X.meta=it.reduce((s,i)=>s+i.meta_total,0);X.venda=it.reduce((s,i)=>s+i.preco_venda_total,0);X.teto=it.reduce((s,i)=>s+i.teto_total,0);
  X.comp=it.reduce((s,i)=>s+S.sd[i.codigo].comp,0);X.real=it.reduce((s,i)=>s+S.sd[i.codigo].real,0);
  X.aCotar=it.filter(i=>i.status_cotacao==='A cotar');X.semFolga=it.filter(i=>i.meta_total>i.teto_total);
  D.pacotes.forEach(p=>{p._dias=diasAte(p.fechar_ate);p._cot=p._it.filter(i=>i.status_cotacao==='A cotar').length;p._pctCot=p._it.length?1-p._cot/p._it.length:1;
    p._semFolga=p._it.filter(i=>i.meta_total>i.teto_total).length;p._acima=p.meta>p.teto;
    p._meta=p._it.reduce((s,i)=>s+i.meta_total,0);p._comp=p._it.reduce((s,i)=>s+S.sd[i.codigo].comp,0);p._real=p._it.reduce((s,i)=>s+S.sd[i.codigo].real,0);
    p._temOC=S.t.ocs.some(o=>S.byCod[o.item]?.pacote===p.codigo&&o.status!=='cancelada'&&o.status!=='reprovada')});
  X.vencidos=D.pacotes.filter(p=>p._dias!=null&&p._dias<0&&p._it.length&&!p._temOC);
  X.pendAprov=S.t.ocs.filter(o=>o.status==='em_alcada');
  X.semRateio=S.t.notas.filter(n=>n.status==='lancada');
  X.semPedido=S.t.notas.filter(n=>!n.oc);
  X.economia=S.t.ocs.filter(o=>['aprovada','recebida_parcial','recebida'].includes(o.status)).reduce((s,o)=>{const i=S.byCod[o.item];return s+(i.meta_unit*o.qtd-o.valor)},0);
  return X;
}

function atvPill(a){if(a.status==='cumprida')return '<span class="pill ok">Cumprida</span>';if(a.status==='nao_cumprida')return '<span class="pill bad">Não cumprida</span>';
  return bloqItem(a.item).length?'<span class="pill bad">Com restrição</span>':'<span class="pill ok">Pronta</span>'}

function modalRst(){modal(`<h3>Nova restrição</h3><div class="g2"><div><label>Tipo</label><select id="r-tipo">${TIPOS_R.map(t=>`<option>${t}</option>`).join('')}</select></div><div><label>Item (opcional)</label><select id="r-item"><option value="">—</option>${itemOptions()}</select></div></div>
   <label>O que impede</label><input id="r-desc"><div class="g2"><div><label>Dono</label><input id="r-dono" value="${esc(user())}"></div><div><label>Prazo</label><input id="r-prazo" type="date" value="${addDias(hojeISO(),3)}"></div></div><div class="g2"><div><label>Próximo passo</label><input id="r-prox"></div><div><label>R$ em jogo</label><input id="r-val" type="number" min="0" step="any"></div></div>
   <div class="acts"><button class="btn" data-act="fechar">Cancelar</button><button class="btn dark" data-act="rst-salvar">Registrar</button></div>`)}
function doRst(){const d=$('#r-desc').value.trim(),dono=$('#r-dono').value.trim();if(!d||!dono)return toast('Descreva e informe o dono');if(donoAb(dono)>=8)return toast(dono+' já tem 8 restrições abertas: resolva antes de abrir outra');
  const r={id:'rst'+Date.now(),num:nextNum('rst'),tipo:$('#r-tipo').value,item:$('#r-item').value,desc:d,dono,prazo:$('#r-prazo').value,proximo:$('#r-prox').value,valor:+$('#r-val').value||0,status:'aberta',criada:hojeISO(),atualizada:hojeISO(),replan:0,quem:user()};

function doTar(){const o=$('#t-oque').value.trim();if(!o)return toast('Diga o que fazer');const t={id:'tar'+Date.now(),num:nextNum('tar'),oque:o,quem:$('#t-quem').value,quando:$('#t-quando').value,porque:$('#t-por').value,onde:$('#t-onde').value,como:$('#t-como').value,quanto:$('#t-quanto').value,item:$('#t-item').value,status:'afazer',quem0:user()};

/* ============ FATURAMENTO, RECEBIMENTO, DRE E CAIXA (Fase 9) ============ */
const mesDe=s=>String(s||'').slice(0,7);
const addMes=(m,n)=>{const [y,x]=m.split('-').map(Number);const d=new Date(y,x-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const fmes=m=>{const [y,x]=m.split('-');return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+x-1]+'/'+y.slice(2)};
const puItem=i=>i.qtd?i.preco_venda_total/i.qtd:0;
const medValor=m=>m.qtd*puItem(S.byCod[m.item]||{qtd:0,preco_venda_total:0});
const medsLivres=()=>S.t.meds.filter(m=>m.status==='atestada'&&!m.bc);
const bcBruto=b=>r2(b.medIds.reduce((s,id)=>{const m=S.t.meds.find(x=>x.id===id);return s+(m?medValor(m):0)},0));
const bcTotal=b=>r2(bcBruto(b)*(1+(b.reajuste||0)/100));
const bcAprov=b=>b.valorAprovado!=null?b.valorAprovado:bcTotal(b);
const bcGlosa=b=>b.valorAprovado!=null?r2(Math.max(0,bcTotal(b)-b.valorAprovado)):0;
const fatLiq=f=>r2(f.valor*(1-(f.ret||0)/100));
const fatRec=f=>r2(S.t.recs.filter(r=>r.fat===f.id).reduce((s,r)=>s+r.valor,0));
const fatSaldo=f=>r2(Math.max(0,fatLiq(f)-fatRec(f)));
const BC_ST={rascunho:['mute','Rascunho'],enviado:['info','Enviado ao cliente'],aprovado:['warn','Aprovado, a faturar'],faturado:['ok','Faturado']};
function realPorConta(){const real={};S.t.notas.forEach(n=>{if(n.status==='lancada')return;n.rateio.forEach(l=>{const c=l.conta||contaPadrao(l.nat,S.byCod[l.item]?.pacote);real[c]=(real[c]||0)+ +l.valor})});return real}
function dre(){
  const trib=S.D.obra.tributos_nota,bcs=S.t.bcs.filter(b=>b.status==='aprovado'||b.status==='faturado');
  const bruto=bcs.reduce((s,b)=>s+bcBruto(b),0),reaj=bcs.reduce((s,b)=>s+r2(bcBruto(b)*(b.reajuste||0)/100),0),glosa=bcs.reduce((s,b)=>s+bcGlosa(b),0);
  const aprov=bcs.reduce((s,b)=>s+bcAprov(b),0),ded=r2(aprov*trib),liq=r2(aprov-ded);
  const real=realPorConta(),custoPorConta=Object.entries(real).sort(([a],[b])=>cmpCod(a,b));const custo=custoPorConta.reduce((s,[,v])=>s+v,0);
  return {bruto,reaj,glosa,aprov,ded,liq,custoPorConta,custo,resultado:r2(liq-custo),margem:liq>0?(liq-custo)/liq:null}}
function proxMeses(n0,n1){const m0=mesDe(hojeISO());return Array.from({length:n1-n0+1},(_,k)=>addMes(m0,n0+k))}
function caixa(){return memo('cx',caixaRaw)}
function caixaRaw(){
  const meses=proxMeses(-2,6),L={};meses.forEach(m=>L[m]={entP:0,entR:0,saiP:0,saiR:0,man:0});
  const put=(m,k,v)=>{if(L[m])L[m][k]+=v};
  S.t.fats.forEach(f=>{put(mesDe(f.venc),'entP',fatSaldo(f))});
  S.t.recs.forEach(r=>put(mesDe(r.data),'entR',r.valor));
  S.t.titulos.filter(t=>!t.cancelado).forEach(t=>{const i=tituloInfo(t);if(t.parcelas&&t.parcelas.length){let pg=i.pago;t.parcelas.forEach(q=>{const u=Math.min(pg,q.valor);pg=r2(pg-u);put(mesDe(q.venc),'saiP',r2(q.valor-u))})}else put(mesDe(t.venc),'saiP',i.saldo)});
  S.t.notas.filter(n=>n.status==='paga').forEach(n=>put(mesDe(n.pago),'saiR',n.valor));
  S.t.lans.forEach(l=>put(mesDe(l.data),'man',l.valor));
  let acc=0,minAcc=0;
  const rows=meses.map(m=>{const x=L[m],liq=x.entR+x.entP-x.saiR-x.saiP+x.man;acc+=liq;minAcc=Math.min(minAcc,acc);return {m,...x,liq,acc}});
  return {rows,minAcc}}
function svgCaixa(rows){
  const W=640,H=180,P=24,mx=Math.max(1,...rows.map(r=>Math.max(r.entR+r.entP,r.saiR+r.saiP))),bw=(W-2*P)/rows.length;
  const y=v=>H-P-(v/mx)*(H-2*P);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Entradas e saídas por mês">${rows.map((r,k)=>{const x=P+k*bw,e=r.entR+r.entP,s=r.saiR+r.saiP;
   return `<rect x="${x+bw*.12}" y="${y(e)}" width="${bw*.34}" height="${H-P-y(e)}" fill="var(--ok)" rx="2"/><rect x="${x+bw*.52}" y="${y(s)}" width="${bw*.34}" height="${H-P-y(s)}" fill="var(--bad)" rx="2"/><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${fmes(r.m)}</text>`}).join('')}</svg>
   <div class="legend"><span><i style="background:var(--ok)"></i>Entradas (previstas + realizadas)</span><span><i style="background:var(--bad)"></i>Saídas (previstas + realizadas)</span></div>`}
function viewFat(X){
  const tab=S.tab.fat||'bc',T=S.t,livres=medsLivres(),vl=livres.reduce((s,m)=>s+medValor(m),0);
  let b='';
  if(tab==='bc'){
    b=`<div class="kpi4"><div><div class="k-l">Atestado a medir ao cliente</div><div class="v">${brl(vl,true)}</div></div><div><div class="k-l">Boletins</div><div class="v">${T.bcs.length}</div></div><div><div class="k-l">Aprovados a faturar</div><div class="v ${T.bcs.some(x=>x.status==='aprovado')?'neg':''}">${brl(T.bcs.filter(x=>x.status==='aprovado').reduce((s,x)=>s+bcAprov(x),0),true)}</div></div><div><div class="k-l">Glosas</div><div class="v">${brl(T.bcs.reduce((s,x)=>s+bcGlosa(x),0),true)}</div></div></div>

const FISCAL={provedor:null};   // provedor externo (ex.: Focus NFe) ainda não contratado: nada é chamado sem credencial
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function xmlTxt(doc,tag){const e=doc.getElementsByTagName(tag)[0];return e?e.textContent.trim():''}
function parseNFe(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('XML inválido');
  const inf=doc.getElementsByTagName('infNFe')[0];if(!inf)throw new Error('Não é uma NF-e (sem infNFe)');
  const chave=(inf.getAttribute('Id')||'').replace(/\D/g,'');
  const emit=doc.getElementsByTagName('emit')[0],ide=doc.getElementsByTagName('ide')[0];
  const g=(p,t)=>{const e=p&&p.getElementsByTagName(t)[0];return e?e.textContent.trim():''};
  const dh=g(ide,'dhEmi')||g(ide,'dEmi');
  const itens=[...doc.getElementsByTagName('det')].map(d=>({desc:g(d,'xProd'),qtd:+g(d,'qCom')||0,valor:+g(d,'vProd')||0}));
  const v=+xmlTxt(doc,'vNF')||0;
  return {chave,num:g(ide,'nNF'),serie:g(ide,'serie'),emissao:dh.slice(0,10),emitente:g(emit,'xNome'),cnpj:g(emit,'CNPJ')||g(emit,'CPF'),valor:r2(v),itens,
    inss:r2(+xmlTxt(doc,'vRetPrev')||0),iss:r2(+xmlTxt(doc,'vISSRet')||+xmlTxt(doc,'vISS')||0)}}
function sugereOC(x){
  const ocs=S.t.ocs.filter(o=>['aprovada','recebida_parcial','recebida'].includes(o.status)&&norm(o.forn)&&(norm(x.emitente).includes(norm(o.forn))||norm(o.forn).includes(norm(x.emitente))));
  const bons=ocs.filter(o=>Math.abs(o.valor-x.valor)/Math.max(o.valor,1)<=S.t.par.tol);return bons.length===1?bons[0]:null}
function importaXmls(textos){
  const res={ok:[],dup:[],erro:[]};
  textos.forEach(([nome,t])=>{try{const x=parseNFe(t);
    if(x.chave&&S.t.notas.some(n=>n.chave===x.chave)){res.dup.push(nome+' (chave já lançada)');return}
    if(!(x.valor>0)){res.erro.push(nome+': sem valor');return}
    const o=sugereOC(x);
    const n={id:'n'+Date.now()+Math.random().toString(36).slice(2,5),num:nextNum('nf'),emitente:x.emitente,cnpj:x.cnpj,chave:x.chave||x.num,nfNum:x.num,valor:x.valor,emissao:x.emissao||hojeISO(),oc:o?o.id:'',ocNum:o?o.num:'',rateio:[],status:'lancada',origemXml:true,itensXml:x.itens,retInss:x.inss,retIss:x.iss,justSemOC:o?'':'Importada de XML sem pedido correspondente'};
    S.t.notas.unshift(n);log('nota_fiscal',n.num,'importada_xml','',x.emitente+' · '+brl(x.valor)+(o?' · sugerida '+o.num:''));res.ok.push(n.num+' '+x.emitente+' '+brl(x.valor)+(o?' → '+o.num:' (sem pedido)'))}
   catch(e){res.erro.push(nome+': '+e.message)}});
  save();return res}

  <div class="acts"><button class="btn" data-act="fechar">Fechar</button><button class="btn dark" data-act="xml-ok">Importar</button></div>`)}

const nOrNull=v=>{const n=typeof v==='number'?v:parseFloat(String(v??'').replace(/\./g,'').replace(',','.'));return Number.isFinite(n)?n:null};
async function linhasDaPlanilha(file){
  if(/\.json$/i.test(file.name)){const j=JSON.parse(await file.text());return {itens:(j.eap||[]).filter(e=>e.tipo_linha==='item'&&e.meta_total!=null).map(e=>({codigo:e.codigo,qtd:e.qtd,meta:e.meta_total,teto:e.teto_total,status:e.status_cotacao})),pacotes:(j.pacotes||[]).map(p=>({codigo:p.codigo,meta:p.meta,teto:p.teto,fechar_ate:p.fechar_ate}))}}
  const X=await carregaXlsx();const wb=X.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const aba=(pref)=>{const n=wb.SheetNames.find(x=>x.startsWith(pref));if(!n)throw new Error('Aba "'+pref+'" não encontrada. É o Estudo de Obra interno?');return X.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true})};
  const tabela=(rows,chave)=>{const h=rows.findIndex(r=>r&&r.includes(chave));if(h<0)throw new Error('Cabeçalho "'+chave+'" não encontrado');const cab=rows[h];return rows.slice(h+1).map(r=>Object.fromEntries(cab.map((c,k)=>[c,r[k]])))};
  const itens=tabela(aba('12.'),'Item').filter(r=>r['Item']).map(r=>({codigo:String(r['Item']).trim(),qtd:nOrNull(r['Qtd']),meta:nOrNull(r['Custo adotado'])??nOrNull(r['Meta custo total']),teto:nOrNull(r['Teto total (margem zero)']),status:r['Status']}));
  const dt=v=>v instanceof Date?v.toISOString().slice(0,10):null;
  const pacotes=tabela(aba('11.'),'Pacote').filter(r=>r['Pacote']&&r['Pacote']!=='TOTAL').map(r=>({codigo:r['Pacote'],meta:nOrNull(r['Meta de custo']),teto:nOrNull(r['Teto (margem zero)']),fechar_ate:dt(r['Fechar até'])}));
  return {itens,pacotes}}
function calculaDiff(L){
  const dif=[],info={novos:[],semQtd:[]},seen=new Set();
  L.itens.forEach(r=>{const i=S.byCod[r.codigo];seen.add(r.codigo);
    if(!i||i.tipo_linha!=='item'){info.novos.push(r.codigo);return}
    if(r.qtd!=null&&i.qtd!=null&&Math.abs(r.qtd-i.qtd)>1e-6)info.semQtd.push(`${r.codigo}: planilha ${num(r.qtd)} × orçamento ${num(i.qtd)}`);
    const m=r.meta!=null?r2(r.meta):null,t=r.teto!=null?r2(r.teto):null,mudou=[];
    if(m!=null&&(i.meta_base==null||Math.abs(m-i.meta_base)>0.005))mudou.push(['Meta',i.meta_base,m]);
    if(t!=null&&(i.teto_total==null||Math.abs(t-i.teto_total)>0.005))mudou.push(['Teto',i.teto_total,t]);
    if(r.status&&r.status!==i.status_cotacao)mudou.push(['Status',i.status_cotacao,r.status]);
    if(mudou.length)dif.push({codigo:r.codigo,mudou,novo:{meta_total:m??i.meta_base,teto_total:t??i.teto_total,status_cotacao:r.status||i.status_cotacao,qtd:i.qtd}})});
  const pacs=[];L.pacotes.forEach(r=>{const p=S.D.pacotes.find(x=>x.codigo===r.codigo);if(!p)return;
    if((r.meta!=null&&Math.abs(r2(r.meta)-p.meta)>0.005)||(r.teto!=null&&Math.abs(r2(r.teto)-p.teto)>0.005)||(r.fechar_ate&&r.fechar_ate!==p.fechar_ate))pacs.push({codigo:r.codigo,nome:p.nome,meta:r.meta!=null?r2(r.meta):p.meta,teto:r.teto!=null?r2(r.teto):p.teto,fechar_ate:r.fechar_ate||p.fechar_ate,antes:{meta:p.meta,teto:p.teto,fechar_ate:p.fechar_ate}})});
  const semMov=S.D.items.filter(i=>!seen.has(i.codigo)).length;
  return {dif,pacs,info,semMov,dMeta:r2(dif.reduce((s,d)=>s+(d.novo.meta_total||0)-(S.byCod[d.codigo].meta_base||0),0))}}
function modalSync(){SYNC=null;modal(`<h3>Atualizar metas pela planilha</h3><div class="sub">Escolha o Estudo de Obra (.xlsx, abas 11 e 12) ou o .json do importador. O app mostra o que mudou e só aplica depois da sua confirmação, como <b>nova versão da linha de base</b>. Preço licitado e quantidades do contrato não são alterados.</div>

async function syncLer(){const f=$('#sy-f').files[0];if(!f)return toast('Escolha o arquivo');$('#sy-r').innerHTML='<div class="sub">Lendo…</div>';
  try{const L=await linhasDaPlanilha(f);SYNC=calculaDiff(L);SYNC.arquivo=f.name;

    ${d.dif.length?`<div class="tw" style="max-height:260px;overflow:auto"><table class="tbl"><thead><tr><th>Item</th><th>Mudança</th></tr></thead><tbody>${d.dif.slice(0,200).map(x=>`<tr><td class="mono">${x.codigo}</td><td>${x.mudou.map(m=>`${m[0]}: ${typeof m[1]==='number'?brl(m[1]):esc(m[1]||'—')} → <b>${typeof m[2]==='number'?brl(m[2]):esc(m[2])}</b>`).join(' · ')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="sub">Nenhuma diferença de meta, teto ou status nos itens.</div>'}
    ${d.pacs.length?`<div class="sub" style="margin-top:8px">Pacotes: ${d.pacs.map(p=>esc(p.codigo)).join(', ')}</div>`:''}${d.info.semQtd.length?`<div class="sub neg" style="margin-top:8px">Quantidade diferente do orçamento (não aplicada): ${d.info.semQtd.slice(0,5).map(esc).join('; ')}${d.info.semQtd.length>5?'…':''}</div>`:''}${d.info.novos.length?`<div class="sub" style="margin-top:8px">Fora do orçamento (ignorados): ${d.info.novos.slice(0,8).join(', ')}${d.info.novos.length>8?'…':''}</div>`:''}`;
    $('#sy-ap').disabled=!(d.dif.length||d.pacs.length)||!can('congelar')}catch(e){$('#sy-r').innerHTML=`<div class="neg">${esc(e.message)}</div>`}}
function syncAplicar(){const d=SYNC;if(!d||!can('congelar'))return;
  S.t.baseOv=S.t.baseOv||{};S.t.basePac=S.t.basePac||{};
  d.dif.forEach(x=>{const i=S.byCod[x.codigo];S.t.baseOv[x.codigo]={meta_total:x.novo.meta_total,teto_total:x.novo.teto_total,status_cotacao:x.novo.status_cotacao,meta_unit:i.qtd?r2(x.novo.meta_total/i.qtd*10000)/10000:i.meta_unit}});
  d.pacs.forEach(p=>S.t.basePac[p.codigo]={meta:p.meta,teto:p.teto,fechar_ate:p.fechar_ate});
  const v=(S.t.versao||1)+(S.t.frozen?1:0);S.t.versao=v;S.t.hist.push({versao:v,motivo:'Atualização pela planilha '+d.arquivo+' · '+d.dif.length+' itens, '+d.pacs.length+' pacotes',quando:new Date().toISOString(),quem:user()});
  log('obra',S.D.obra.codigo,'linha_base','v'+(v-(S.t.frozen?1:0)),'v'+v+' · '+d.dif.length+' itens · variação '+brl(d.dMeta),d.arquivo);
  prep();save();closeModal();toast('Linha de base v'+v+' aplicada');render()}

const FISC_PAD={iss:2,pis:0.65,cofins:3,irpjCsll:2.85,inssRet:11,issRet:0,outrasRet:0};   // padrões do Estudo (8,5% no total); o contador confirma
const fisc=()=>({...FISC_PAD,...(S.t.par.fisc||{})});
const baseServico=n=>n.rateio.filter(l=>l.nat==='TER').reduce((s,l)=>s+ +l.valor,0);
function retencoesNota(n){const f=fisc(),b=r2(baseServico(n));
  const inss=n.retInss?n.retInss:r2(b*f.inssRet/100),iss=n.retIss?n.retIss:r2(b*f.issRet/100),out=r2(b*f.outrasRet/100);
  return {base:b,inss,iss,out,total:r2(inss+iss+out),liquido:r2(n.valor-inss-iss-out)}}
function apuraFaturamento(comp){const f=fisc();
  const L=S.t.fats.filter(x=>mesDe(x.emissao)===comp).map(x=>{const b=x.valor,t={iss:r2(b*f.iss/100),pis:r2(b*f.pis/100),cofins:r2(b*f.cofins/100),irpjCsll:r2(b*f.irpjCsll/100)};return {f:x,base:b,...t,total:r2(t.iss+t.pis+t.cofins+t.irpjCsll)}});
  const T=L.reduce((a,x)=>({base:a.base+x.base,iss:a.iss+x.iss,pis:a.pis+x.pis,cofins:a.cofins+x.cofins,irpjCsll:a.irpjCsll+x.irpjCsll,total:a.total+x.total}),{base:0,iss:0,pis:0,cofins:0,irpjCsll:0,total:0});
  return {L,T:Object.fromEntries(Object.entries(T).map(([k,v])=>[k,r2(v)]))}}
function apuraRetencoes(comp){
  const L=S.t.notas.filter(n=>n.status!=='lancada'&&mesDe(n.emissao)===comp).map(n=>({n,...retencoesNota(n)})).filter(x=>x.base>0);
  return {L,total:r2(L.reduce((s,x)=>s+x.total,0)),inss:r2(L.reduce((s,x)=>s+x.inss,0)),iss:r2(L.reduce((s,x)=>s+x.iss,0))}}

  const L=[...ms].filter(Boolean).sort();if(L.length<2)L.unshift(addMes(L[0],-1));
  const c={medido:0,fat:0,custo:0};return L.map(m=>{c.medido+=S.t.meds.filter(x=>x.status==='atestada'&&mesDe(x.periodo)===m).reduce((s,x)=>s+medValor(x),0);
    c.fat+=S.t.fats.filter(f=>mesDe(f.emissao)===m).reduce((s,f)=>s+f.valor,0);
    c.custo+=S.t.notas.filter(n=>n.status!=='lancada'&&mesDe(n.emissao)===m).reduce((s,n)=>s+n.valor,0);return {m,...c}}).filter(x=>{const M=typeof mesesPeriodo==='function'?mesesPeriodo():null;return !M||M.has(x.m)})}
function svgCurvaS(r){
  const W=560,H=210,P=28,mx=Math.max(1,...r.map(x=>Math.max(x.medido,x.fat,x.custo))),X=i=>P+i*(W-2*P)/Math.max(1,r.length-1),Y=v=>H-P-(v/mx)*(H-2*P);
  const ln=(k,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2" points="${r.map((x,i)=>X(i)+','+Y(x[k])).join(' ')}"/>`+r.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[k])}" r="3" fill="${col}"><title>${fmes(x.m)} · ${k}: ${brl(x[k])}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Curva S acumulada">${ln('medido','var(--info)')}${ln('fat','var(--ok)')}${ln('custo','var(--bad)')}${r.map((x,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-3)">${fmes(x.m)}</text>`).join('')}</svg>
   <div class="legend"><span><i style="background:var(--info)"></i>Medido (atestado)</span><span><i style="background:var(--ok)"></i>Faturado</span><span><i style="background:var(--bad)"></i>Custo (notas)</span></div>`}

/* ---------- Importar lançamentos do financeiro (CSV) ---------- */
/* Colunas: tipo;numero;fornecedor;descricao;vencimento;valor;pago_em;fat_direto  (tipo: gasto | custo_fixo | provisao). Datas dd/mm/aaaa ou aaaa-mm-dd; valores 1.234,56. */
const numBR=s=>{s=String(s||'').trim().replace(/[R$\s]/g,'');if(!s)return 0;return s.includes(',')?+s.replace(/\./g,'').replace(',','.'):+s};
const dataImp=s=>{s=String(s||'').trim();const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:/^\d{4}-\d{2}-\d{2}$/.test(s)?s:''};
function lfxParse(txt){const out=[],erros=[];String(txt||'').replace(/^﻿/,'').split(/\r?\n/).forEach((ln,i)=>{if(!ln.trim())return;const c=ln.split(';').map(x=>x.trim());
  if(i===0&&/^tipo$/i.test(c[0]))return;const tp=(c[0]||'').toLowerCase();
  if(!['gasto','custo_fixo','provisao'].includes(tp))return erros.push(`Linha ${i+1}: tipo "${c[0]}" inválido (use gasto, custo_fixo ou provisao)`);
  const v=numBR(c[5]),venc=dataImp(c[4]);if(!(v>0))return erros.push(`Linha ${i+1}: valor inválido`);if(!venc)return erros.push(`Linha ${i+1}: vencimento inválido`);
  out.push({tipo:tp,numero:c[1]||'',forn:c[2]||'',desc:c[3]||'',venc,valor:r2(v),pago:dataImp(c[6])||'',fatDireto:/^(1|s|sim|x)$/i.test(c[7]||'')})});return {out,erros}}
const lfxChave=l=>[l.tipo,l.numero,l.forn.toLowerCase(),l.venc,l.valor].join('|');
function lfxImportar(){const r=lfxParse($('#lf-csv').value),ja=new Set(S.t.lfxs.map(lfxChave));
  if(!r.out.length&&r.erros.length)return toast(r.erros[0]);
  const novos=r.out.filter(l=>!ja.has(lfxChave(l)));const lote='L'+Date.now();
  novos.forEach(l=>S.t.lfxs.push({id:'lfx'+Date.now()+Math.random().toString(36).slice(2,6),origem:'Importado',lote,...l}));
  log('lancamentos_importados',lote,'importar','',novos.length+' novos, '+(r.out.length-novos.length)+' repetidos ignorados'+(r.erros.length?', '+r.erros.length+' linhas com erro':''));
  save();toast(novos.length+' lançamentos importados, '+(r.out.length-novos.length)+' repetidos ignorados'+(r.erros.length?', '+r.erros.length+' com erro':''));S.lfxErros=r.erros;render()}
function lfxDesfazer(){const ult=S.t.lfxs[S.t.lfxs.length-1];if(!ult)return toast('Nada para desfazer');const n=S.t.lfxs.filter(l=>l.lote===ult.lote).length;
  S.t.lfxs=S.t.lfxs.filter(l=>l.lote!==ult.lote);log('lancamentos_importados',ult.lote,'desfazer','',n+' removidos');save();toast(n+' lançamentos do último lote removidos');render()}
ACOES['lf-imp']=()=>{if(!can('lan'))return toast('Só Financeiro importa lançamentos');lfxImportar()};ACOES['lf-undo']=()=>{if(!can('lan'))return toast('Só Financeiro desfaz importação');lfxDesfazer()};

  <textarea id="lf-csv" rows="6" placeholder="gasto;123;Fornecedor X;Cimento;25/11/2026;2.011,26;;&#10;provisao;;Folha;Provisão de mão de obra;30/11/2026;126.731,81;;"></textarea>

  ${(S.lfxErros||[]).length?`<div class="err" style="margin-top:8px">${S.lfxErros.slice(0,5).map(esc).join('<br>')}</div>`:''}
  ${L.length?`<div class="tw"><table class="tbl"><thead><tr><th>Tipo</th><th>Nº</th><th>Fornecedor</th><th>Vencimento</th><th class="r">Valor</th><th>Situação</th></tr></thead><tbody>${L.slice(-30).map(l=>`<tr><td>${l.tipo}${l.fatDireto?' · fat. direto':''}</td><td class="mono">${esc(l.numero)}</td><td>${esc(l.forn)}</td><td>${fdata(l.venc)}</td><td class="r">${brl(l.valor)}</td><td>${l.tipo==='gasto'?(l.pago?'pago '+fdata(l.pago):l.venc<hojeISO()?'<span class="neg">atrasado</span>':'a pagar'):'—'}</td></tr>`).join('')}</tbody></table></div>`:''}`}

/* ---------- drill-down: lista que compõe cada número ---------- */
function painelLinhas(k){const T=S.t,h=hojeISO(),R=[],add=(ref,desc,valor,data)=>R.push({ref,desc,valor:r2(valor),data});
  const nt=T.notas.filter(n=>n.status!=='lancada'),lg=lfxDe('gasto');
  const nota=n=>add(n.num,n.emitente+(n.status==='paga'?' · paga':''),n.valor,n.status==='paga'?n.pago:vencNota(n)),lf=l=>add('Importado '+(l.numero||''),l.forn+' · '+l.desc,l.valor,l.pago||l.venc);
  if(k==='fat')T.fats.forEach(f=>add(f.num,f.bcNum,f.valor,f.emissao));
  if(k==='recebido')T.recs.forEach(r=>add(r.id,'Recebimento',r.valor,r.data));
  if(k==='aReceber')T.fats.filter(f=>fatSaldo(f)>0).forEach(f=>add(f.num,'saldo a receber',fatSaldo(f),f.venc));
  if(k==='atrRec')T.fats.filter(f=>fatSaldo(f)>0&&f.venc<h).forEach(f=>add(f.num,'vencida',fatSaldo(f),f.venc));
  if(k==='pago'){nt.filter(n=>n.status==='paga').forEach(nota);lg.filter(l=>l.pago).forEach(lf)}
  if(k==='atrasado'){nt.filter(n=>n.status!=='paga'&&vencNota(n)<h).forEach(nota);lg.filter(l=>!l.pago&&l.venc<h).forEach(lf)}
  if(k==='aPagar'){nt.filter(n=>n.status!=='paga'&&vencNota(n)>=h).forEach(nota);lg.filter(l=>!l.pago&&l.venc>=h).forEach(lf)}
  if(k==='gasto'){nt.forEach(nota);lg.forEach(lf)}
  if(k==='requisicao')T.sols.filter(s=>['enviada','em_cotacao','cotada'].includes(s.status)).forEach(s=>add(s.num,s.desc,s.qtd*s.preco,s.data));
  if(k==='custoFixo'){nt.forEach(n=>{const v=n.rateio.filter(l=>l.nat==='ADM').reduce((a,l)=>a+ +l.valor,0);if(v)add(n.num,n.emitente+' (rateio ADM)',v,n.emissao)});lfxDe('custo_fixo').forEach(lf)}
  if(k==='prov'){T.ocs.filter(o=>['aprovada','recebida_parcial','recebida'].includes(o.status)).forEach(o=>{const f=T.notas.filter(n=>n.oc===o.id&&n.status!=='lancada').reduce((s,n)=>s+n.rateio.filter(l=>l.item===o.item).reduce((a,l)=>a+ +l.valor,0),0),v=Math.max(0,o.valor-f);if(v)add(o.num,o.forn+' · pedido sem nota',v,o.data)});lfxDe('provisao').forEach(lf)}
  return R}
ACOES['pc-det']=el=>{const k=el.dataset.k,R=painelLinhas(k),tot=r2(R.reduce((s,x)=>s+x.valor,0));
  modal(`<h3>Composição · ${esc(k)}</h3><div class="sub">${R.length} registros · total ${brl(tot)}</div>${R.length?`<div class="tw"><table class="tbl"><tbody>${R.map(x=>`<tr><td class="mono">${esc(x.ref)}</td><td>${esc(x.desc)}</td><td>${fdata(x.data)}</td><td class="r">${brl(x.valor)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nada compõe este número.</div>'}<div class="acts"><button class="btn" data-act="fechar">Fechar</button></div>`)};

const EXT_NAT={cod:'codnatureza',nome:'natureza',fat:'faturado',cr:'codcr',crNome:'centroderesultado',saldoCR:'saldoporcr',rec:'faturadorecebido',areceber:'faturadoareceber',atrasoRec:'faturadoatrasado',gasto:'gasto',pago:'gastopago',aPagar:'gastoapagar',atrasado:'gastoatrasado',req:'gastorequisicao',prov:'provgasto',impD:'impostosdebito',impC:'impostocredito',impF:'impostofinal'};
const EXT_LAN={origemTxt:'origem',rd:'receitadespesa',provTxt:'provisao',nota:'nrnota',empresa:'empresa',parceiro:'parceiro',desdob:'vlrdesdobramento',valorNota:'vlrnota',dtNeg:'dtnegociacao',dtBaixa:'dtbaixa',vendComp:'vendedorcomprador',venc:'dtvencimento',top:'top',topDesc:'descricaotop',tipoMov:'tipomovimento'};
function extParse(txt,mapa,numeros,datas,opc=[]){const L=String(txt||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(L.length<2)return {out:[],erros:['Cole o cabeçalho e ao menos uma linha']};
  const sep=L[0].includes('\t')?'\t':';',H=L[0].split(sep).map(hdrN),ix={},erros=[],out=[];for(const k in mapa){ix[k]=H.indexOf(mapa[k]);if(ix[k]<0&&opc.includes(k)){delete ix[k];continue}if(ix[k]<0)return {out:[],erros:['Falta a coluna "'+mapa[k]+'" no cabeçalho']}}
  L.slice(1).forEach((ln,i)=>{const c=ln.split(sep).map(x=>x.trim()),o={};for(const k in ix){const v=c[ix[k]]||'';o[k]=numeros.includes(k)?r2(numBR(v)):datas.includes(k)?dataImp(v):v}if(!o[Object.keys(mapa)[0]]&&!c.some(x=>x))return;out.push(o)});return {out,erros}}
function extImportar(){if(!can('lan'))return toast('Só Financeiro importa o extrato');const cod=S.D.obra.codigo,txN=$('#ex-nat').value,txL=$('#ex-lan').value;let nN=0,nL=0,erros=[];
  if(txN.trim()){const r=extParse(txN,EXT_NAT,['fat','saldoCR','rec','areceber','atrasoRec','gasto','pago','aPagar','atrasado','req','prov','impD','impC','impF'],[]);erros.push(...r.erros);
    if(r.out.length){S.t.lfxs=S.t.lfxs.filter(l=>l.tipo!=='nat');r.out.filter(o=>o.cod).forEach((o,i)=>{S.t.lfxs.push({id:'nat-'+cod+'-'+Date.now()+'-'+i,tipo:'nat',origem:'Importado',lote:'extrato-'+cod,corte:$('#ex-corte').value||hojeISO(),...o,cr:o.cr||CR_PAD[0],crNome:o.crNome||CR_PAD[1],foraGasto:/ADIANTAMENTO A FORNECE/i.test(o.nome)});nN++});S.t.par.extratoCorte=$('#ex-corte').value||hojeISO();S.t.par.extratoSeed=true}}
  if(txL.trim()){const r=extParse(txL,EXT_LAN,['desdob','valorNota'],['dtNeg','dtBaixa','venc']);erros.push(...r.erros);const nc=$('#ex-natcod').value.trim(),ja=new Set(S.t.lfxs.filter(l=>l.detalhe).map(l=>[l.nota,l.natCod,l.desdob,l.venc].join('|')));
    r.out.filter(o=>o.nota).forEach((o,i)=>{const k=[o.nota,nc,o.desdob,o.venc].join('|');if(ja.has(k))return;ja.add(k);S.t.lfxs.push({id:'lan-'+cod+'-'+Date.now()+'-'+i,tipo:'gasto',detalhe:true,origem:'Importado',lote:'lanc-'+Date.now(),forn:o.parceiro,numero:o.nota,desc:o.topDesc,valor:o.valorNota,pago:o.dtBaixa,natCod:nc,...o});nL++})}
  if(!nN&&!nL)return toast(erros[0]||'Nada para importar');log('extrato',cod,'importar','',nN+' naturezas, '+nL+' lançamentos'+(erros.length?' · '+erros.length+' avisos':''));save();toast(nN+' naturezas e '+nL+' lançamentos importados'+(erros.length?' · '+erros[0]:''));render()}

  const g=t=>{const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'));return m?m[1].trim():''};
  const d=g('DTPOSTED').slice(0,8),v=numOfx(g('TRNAMT'));if(!/^\d{8}$/.test(d)||!isFinite(v)||v===0)return;
  out.push({data:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`,valor:r2(v),desc:g('MEMO')||g('NAME'),fitid:g('FITID')})});return out}

function ofxImportar(){const id=contaSel();if(!id)return toast('Cadastre uma conta bancária antes (Suprimentos → Cadastros)');

/* concilia saídas com notas pagas de mesmo valor e entradas com recebimentos de mesmo valor */
function conciliaMovs(id){let c=0;S.t.movs.filter(m=>m.banco===id&&!m.conc&&m.origem!=='baixa').forEach(m=>{
  if(m.valor<0){/* extrato confirma uma baixa já feita no sistema, ou uma nota paga sem baixa pela conta */
    const bx=S.t.movs.find(x=>x.banco===id&&x.origem==='baixa'&&!x.conc&&Math.abs(x.valor-m.valor)<.005);
    if(bx){const n=S.t.notas.find(n=>n.id===bx.nota);bx.conc=m.conc=n?n.num:"baixa";m.dup=true;if(n)n.conc=m.data;c++;return}
    const n=S.t.notas.find(n=>n.status==='paga'&&!n.conc&&Math.abs(n.valor+(n.encargos||0)-Math.abs(m.valor))<.005);if(n){n.conc=m.data;m.conc=n.num;c++}}
  else{const r=S.t.recs.find(r=>!r.conc&&Math.abs(r.valor-m.valor)<.005);if(r){r.conc=m.data;m.conc=r.id;c++}}});return c}
function movManual(){const id=contaSel(),v=+$('#mv-v').value,d=$('#mv-d').value||hojeISO(),ds=$('#mv-t').value.trim();if(!id||!v||!ds)return toast('Informe conta, descrição e valor (negativo = saída)');

/* baixa múltipla: paga várias notas liberadas de uma vez, com juros, multa e desconto rateados proporcionalmente */
function baixaMultipla(){const ids=[...document.querySelectorAll('.bx:checked')].map(e=>e.value);if(!ids.length)return toast('Marque as notas');const banco=contaSel();if(!banco)return toast('Cadastre uma conta bancária');
  const ju=+$('#bx-j').value||0,mu=+$('#bx-m').value||0,de=+$('#bx-d').value||0,dt=$('#bx-dt').value||hojeISO(),ns=ids.map(i=>S.t.notas.find(n=>n.id===i)).filter(n=>n&&n.status==='liberada');
  if(!ns.length)return toast('Nenhuma nota liberada marcada');const base=ns.reduce((s,n)=>s+n.valor,0),adj=r2(ju+mu-de);let rest=adj;
  ns.forEach((n,k)=>{const q=k===ns.length-1?rest:r2(adj*n.valor/base);rest=r2(rest-q);n.status='paga';n.pago=dt;n.encargos=q;
    S.t.movs.push({id:'mv'+Date.now()+k,banco,data:dt,valor:-r2(n.valor+q),desc:'Pagamento '+n.num+' · '+n.emitente,origem:'baixa',nota:n.id});
    log('nota_fiscal',n.num,'status','liberada','paga (baixa múltipla'+(q?', encargos '+brl(q):'')+')')});
  save();toast(ns.length+' notas pagas · total '+brl(base+adj));render()}

  const emp=S.t.par.emp||{};const L=[pad('00000000'+pad(b.banco,3)+'00000'+'         2'+num((emp.cnpj||'').replace(/\D/g,'')||0,14)+pad(emp.razao||"TAF",30)+pad(b.banco,30)+'          1'+dd,240)];

Object.assign(CAN,{ctb:['financeiro','adm'],fechaCtb:['financeiro','diretoria'],reabreCtb:['diretoria']});
/* Plano contábil base: A ativo, P passivo, PL patrimônio líquido, R receita, D custo/despesa. Natureza = lado em que a conta aumenta. Contas de custo 5.x.xx espelham o plano gerencial 4.x.xx da obra. */
const PLANO_CONT=[['1.1.01','Caixa e bancos','A'],['1.1.02','Clientes a receber','A'],['1.1.03','Retenções a compensar','A'],['1.2.01','Imobilizado','A'],['1.2.02','(−) Depreciação acumulada','A'],
 ['2.1.01','Fornecedores a pagar','P'],['2.1.02','Tributos sobre faturamento a recolher','P'],['2.1.03','INSS retido a recolher','P'],['2.1.04','ISS retido a recolher','P'],['2.1.06','Outras retenções a recolher','P'],
 ['3.1.01','Capital social','PL'],['3.1.03','Aportes e outras entradas','PL'],['3.1.02','Lucros e prejuízos acumulados','PL'],
 ['4.1.01','Receita de medições (BM faturados)','R'],['4.9.01','Deduções: tributos sobre a receita','D'],
 ['5.9.01','Juros, multas e descontos','D'],['5.9.02','Gastos importados do financeiro','D'],['5.9.03','Depreciação','D'],['5.9.04','Perda na baixa de bens','D'],['5.9.05','(−) Aquisições ativadas no imobilizado','D'],['5.9.09','Outras saídas de caixa','D']];
const gerParaCtb=g=>g&&String(g).startsWith('4')?'5'+String(g).slice(1):'5.9.02';
function planoCtb(){const L=PLANO_CONT.map(([c,n,t])=>({codigo:c,nome:n,tipo:t,auto:true}));
  (S.D.plano||[]).filter(x=>String(x.codigo).startsWith('4.')&&x.nivel>=3).forEach(x=>L.push({codigo:gerParaCtb(x.codigo),nome:x.nome,tipo:'D',ger:x.codigo,auto:true}));
  (S.t.par.ctbContas||[]).forEach(x=>L.push({...x,auto:false}));
  return L.sort((a,b)=>cmpCod(a.codigo,b.codigo))}
const ctbNat=c=>{const t=(planoCtb().find(x=>x.codigo===c)||{}).tipo||(c[0]==='1'||c[0]==='5'?(c[0]==='1'?'A':'D'):c[0]==='4'?'R':c[0]==='2'?'P':'PL');return t};
const devedora=c=>['A','D'].includes(ctbNat(c));
const compFechada=d=>S.t.fechs.some(f=>f.comp===mesDe(d)&&!f.reaberta);
const bloqueada=(d,oque)=>{if(compFechada(d)){toast('Competência '+mesDe(d)+' fechada: '+oque+' bloqueado. Só a Diretoria reabre.');return true}return false};
/* partidas automáticas: calculadas dos registros operacionais, sempre consistentes (sem cópia para divergir) */
function partidasAuto(){return memo('pa',partidasAutoRaw)}
function partidasAutoRaw(){const T=S.t,E=[],f=fisc(),push=(ref,origem,data,desc,L)=>{const linhas=L.filter(l=>(l.d||0)>0||(l.c||0)>0).map(l=>({conta:l.conta,d:r2(l.d||0),c:r2(l.c||0)}));if(linhas.length)E.push({ref,origem,data,comp:mesDe(data),desc,linhas,auto:true})};
  T.notas.filter(n=>n.status!=='lancada').forEach(n=>{const rt=retencoesNota(n),porConta={};
    n.rateio.forEach(l=>{const g=l.conta||contaPadrao(l.nat,S.byCod[l.item]?.pacote),c=gerParaCtb(g);porConta[c]=(porConta[c]||0)+ +l.valor});
    push('nf:'+n.id,'Nota '+n.num,n.emissao,'Nota '+n.num+' · '+n.emitente,[...Object.entries(porConta).map(([c,v])=>({conta:c,d:v})),{conta:'2.1.01',c:n.valor}]);
    if(rt.total>0)push('rt:'+n.id,'Retenção '+n.num,n.emissao,'Retenções na nota '+n.num,[{conta:'2.1.01',d:rt.total},{conta:'2.1.03',c:rt.inss},{conta:'2.1.04',c:rt.iss},{conta:'2.1.06',c:rt.out}]);
    if(n.status==='paga'){const liq=rt.liquido;push('pg:'+n.id,'Pagamento '+n.num,n.pago||n.emissao,'Pagamento da nota '+n.num,[{conta:'2.1.01',d:liq},{conta:'5.9.01',d:n.encargos||0},{conta:'1.1.01',c:r2(liq+(n.encargos||0))}])}});
  T.lfxs.filter(l=>l.tipo==='gasto'&&!l.detalhe).forEach(l=>{push('lx:'+l.id,'Importado',l.venc,'Gasto importado · '+l.forn+' '+l.desc,[{conta:'5.9.02',d:l.valor},{conta:'2.1.01',c:l.valor}]);
    if(l.pago)push('lp:'+l.id,'Importado',l.pago,'Pagamento importado · '+l.forn,[{conta:'2.1.01',d:l.valor},{conta:'1.1.01',c:l.valor}])});
  T.fats.forEach(x=>{const ret=r2(x.valor*(x.ret||0)/100),tr=r2(x.valor*(f.iss+f.pis+f.cofins+f.irpjCsll)/100);
    push('ft:'+x.id,'NF serviço '+x.num,x.emissao,'Faturamento '+x.num,[{conta:'1.1.02',d:r2(x.valor-ret)},{conta:'1.1.03',d:ret},{conta:'4.1.01',c:x.valor}]);
    push('tb:'+x.id,'Tributos '+x.num,x.emissao,'Tributos estimados sobre '+x.num,[{conta:'4.9.01',d:tr},{conta:'2.1.02',c:tr}])});
  T.recs.forEach(r=>push('rc:'+r.id,'Recebimento',r.data,'Recebimento '+(T.fats.find(x=>x.id===r.fat)||{}).num,[{conta:'1.1.01',d:r.valor},{conta:'1.1.02',c:r.valor}]));
  T.lans.forEach(l=>push('ln:'+l.id,'Caixa',l.data,l.desc,l.valor>=0?[{conta:'1.1.01',d:l.valor},{conta:'3.1.03',c:l.valor}]:[{conta:'5.9.09',d:-l.valor},{conta:'1.1.01',c:-l.valor}]));
  return E.concat(typeof partidasPatrimonio==='function'?partidasPatrimonio():[])}
const partidasTodas=()=>memo('pt',()=>[...partidasAuto(),...S.t.ctbs.map(e=>({...e,auto:false}))].filter(e=>e.data).sort((a,b)=>a.data.localeCompare(b.data)||String(a.ref).localeCompare(String(b.ref))));
function balancete(comp){return memo('bal'+(comp||''),()=>balanceteRaw(comp))}
function balanceteRaw(comp){const E=partidasTodas().filter(e=>!comp||e.comp<=comp),m={};
  E.forEach(e=>e.linhas.forEach(l=>{const x=m[l.conta]=m[l.conta]||{conta:l.conta,d:0,c:0};x.d+=l.d;x.c+=l.c}));
  const L=Object.values(m).map(x=>({...x,d:r2(x.d),c:r2(x.c),saldo:r2(devedora(x.conta)?x.d-x.c:x.c-x.d)})).sort((a,b)=>cmpCod(a.conta,b.conta));
  return {L,D:r2(L.reduce((s,x)=>s+x.d,0)),C:r2(L.reduce((s,x)=>s+x.c,0))}}
const nomeCtb=c=>(planoCtb().find(x=>x.codigo===c)||{}).nome||nomeConta(c);
function dreCtb(comp){const B=balancete(comp).L,s=p=>r2(B.filter(x=>x.conta.startsWith(p)).reduce((a,x)=>a+x.saldo,0));
  const rec=s('4.1'),ded=s('4.9'),custos=B.filter(x=>x.conta[0]==='5'),cust=r2(custos.reduce((a,x)=>a+x.saldo,0));
  return {rec,ded,liq:r2(rec-ded),custos,cust,resultado:r2(rec-ded-cust)}}
function balancoCtb(comp){const B=balancete(comp).L,s=n=>r2(B.filter(x=>x.conta[0]===n).reduce((a,x)=>a+x.saldo,0)),d=dreCtb(comp);
  const A=s('1'),P=s('2'),PL=s('3');return {B,A,P,PL,res:d.resultado,pasPL:r2(P+PL+d.resultado)}}

/* orçamento contábil: meta por conta × realizado */
function orcamentoCtb(){const meta={},B=balancete().L;S.D.items.forEach(i=>i.linhas.forEach(l=>{const c=gerParaCtb(contaPadrao(l.nat,i.pacote));meta[c]=(meta[c]||0)+i.meta_total*l.share}));

  return [...new Set([...Object.keys(meta),...Object.keys(real)])].sort(cmpCod).map(c=>({c,meta:r2(meta[c]||0),real:r2(real[c]||0),des:r2((real[c]||0)-(meta[c]||0)),lib:(S.t.par.libCtb||{})[c]}))}

/* kardex: custo médio ponderado móvel por insumo (todos os locais); saldo por local à parte */
function kardex(ins,local){let q=0,cm=0;const R=[];
  movsIns(ins).forEach(m=>{const s=sinalMov(m);let cu=m.cu;
    if(s>0&&m.tipo==='ent'){const tot=q*cm+m.qtd*m.cu;q=r2(q+m.qtd);cm=q>0?tot/q:m.cu}
    else if(s>0){cu=cm||m.cu||0;q=r2(q+m.qtd)}   /* ajuste positivo entra ao custo médio */
    else{cu=cm;q=r2(q-m.qtd)}
    if(!local||m.local===local)R.push({m,q,cm,cu})});return R}
const cmIns=ins=>memo('cm'+ins,()=>{let q=0,cm=0;movsIns(ins).forEach(m=>{const s=sinalMov(m);if(s>0&&m.tipo==='ent'){const t=q*cm+m.qtd*m.cu;q=r2(q+m.qtd);cm=q>0?t/q:m.cu}else if(s>0)q=r2(q+m.qtd);else q=r2(q-m.qtd)});return cm});
const movsIns=ins=>(memo('mi',()=>{const M=new Map();movOrd().forEach(x=>{if(!M.has(x.ins))M.set(x.ins,[]);M.get(x.ins).push(x)});return M})).get(ins)||[];
const saldoIns=(ins,local)=>memo('sd'+ins+'|'+(local||''),()=>r2(movsIns(ins).filter(m=>!local||m.local===local).reduce((s,m)=>s+sinalMov(m)*m.qtd,0)));

/* consumo apropriado por item × meta (bloco do painel da obra) */
function consumoView(){const C={};S.t.ests.filter(m=>m.tipo==='sai'&&m.item).forEach(m=>{C[m.item]=(C[m.item]||0)+m.qtd*m.cu});
  const L=Object.entries(C).map(([c,v])=>({c,v:r2(v),meta:(S.byCod[c]||{}).meta_total||0})).sort((a,b)=>b.v-a.v).slice(0,6);if(!L.length)return '';
  return `<div class="card" style="margin-top:14px"><div class="in"><div class="panel-t">Consumo de material apropriado (estoque) × meta do item</div><table class="tbl"><tbody>${L.map(x=>`<tr><td class="mono">${x.c}</td><td class="r">${brl(x.v)}</td><td class="r">${brl(x.meta)}</td><td style="width:90px">${x.meta?`<div class="bar"><i class="b" style="width:${Math.min(100,x.v/x.meta*100)}%"></i></div>`:''}</td></tr>`).join('')}</tbody></table><div class="sub" style="margin-top:6px">Informativo: o custo realizado do item continua vindo das notas.</div></div></div>`}

const ctrVig=c=>r2(c.valor+(c.aditivos||[]).reduce((s,a)=>s+(+a.valor||0),0));
const ctrFim=c=>{const d=(c.aditivos||[]).reduce((s,a)=>s+(+a.dias||0),0);return d&&c.fim?addDias(c.fim,d):c.fim};
const ctrMedido=c=>r2((c.bms||[]).filter(b=>b.status==='aprovado').reduce((s,b)=>s+b.valor,0));
const ctrPorId=id=>S.t.ctrs.find(c=>c.id===id);
function ctrAvisos(c){const A=[],h=hojeISO(),f=ctrFim(c);if(c.status==='encerrado')return A;
  if(f&&f<h)A.push(['bad','vigência vencida em '+fdata(f)]);else if(f&&f<=addDias(h,60))A.push(['warn','vence em '+fdata(f)]);
  if(c.reajMes){const m=+mesDe(h).slice(5);const prox=(c.reajMes-m+12)%12;if(prox<=1)A.push(['info',prox===0?'mês de reajuste':'reajuste no próximo mês'])}
  if(c.status==='bloqueado')A.push(['bad','bloqueado']);return A}
const CTR_ST={ativo:['ok','Ativo'],bloqueado:['bad','Bloqueado'],encerrado:['mute','Encerrado']};
function ctrModal(){modal(`<h3>Novo contrato</h3><div class="g3"><div><label>Tipo</label><select id="ct-t"><option value="receita">Receita (cliente)</option><option value="despesa">Despesa (empreiteiro, locação)</option></select></div><div><label>Nº do contrato</label><input id="ct-n"></div><div><label>Valor (R$)</label><input id="ct-v" type="number" step="any"></div></div>

  if(!n||!p||!(v>0))return toast('Informe número, parte e valor');if(i&&f&&f<i)return toast('Fim antes do início');if(S.t.ctrs.some(c=>c.num===n&&c.tipo===t))return toast('Número já usado');
  S.t.ctrs.push({id:'ct'+Date.now(),tipo:t,num:n,parte:p,objeto:$('#ct-o').value.trim(),valor:v,ini:i,fim:f,reajMes:+$('#ct-r').value||0,indice:$('#ct-x').value.trim(),retPct:+$('#ct-ri').value||0,status:'ativo',aditivos:[],anexos:[],bms:[],quem:user()});

const ultDia=comp=>{const [y,m]=comp.split('-').map(Number);return comp+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')};
const diasMes=comp=>+ultDia(comp).slice(8);
/* depreciação linear mensal, pró-rata no mês de aquisição e no de baixa. vida e residual contábeis; a fiscal só informa */
function deprecBem(b,fiscal){const vida=fiscal?(b.vidaFisc||b.vida):b.vida;if(!(vida>0)||!b.aquisicao)return [];
  const base=b.valor*(1-(b.residual||0)/100),mensal=base/vida,fim=b.baixa?mesDe(b.baixa.data):mesDe(hojeISO()),R=[];let acum=0,m=mesDe(b.aquisicao);
  while(m<=fim&&acum<base-0.005){let f=1;if(m===mesDe(b.aquisicao))f=(diasMes(m)-(+b.aquisicao.slice(8))+1)/diasMes(m);if(b.baixa&&m===mesDe(b.baixa.data))f=Math.min(f,(+b.baixa.data.slice(8))/diasMes(m));
    const v=r2(Math.min(mensal*f,base-acum));if(v>0)R.push({comp:m,valor:v});acum=r2(acum+v);m=addMes(m,1)}return R}
const deprecAcum=(b,fiscal)=>r2(deprecBem(b,fiscal).reduce((s,x)=>s+x.valor,0));
const valorContabil=b=>r2(b.valor-deprecAcum(b));
/* partidas contábeis do patrimônio (somadas ao Diário em partidasAuto) */
function partidasPatrimonio(){const E=[];(S.t.pats||[]).forEach(b=>{if(!b.aquisicao)return;

  deprecBem(b).forEach(x=>E.push({ref:'pd:'+b.id+':'+x.comp,origem:'Depreciação',data:ultDia(x.comp),comp:x.comp,desc:'Depreciação '+b.cod,auto:true,linhas:[{conta:'5.9.03',d:x.valor,c:0},{conta:'1.2.02',d:0,c:x.valor}]}));
  if(b.baixa){const ac=deprecAcum(b),res=r2(b.valor-ac);E.push({ref:'pb:'+b.id,origem:'Baixa de bem',data:b.baixa.data,comp:mesDe(b.baixa.data),desc:'Baixa do bem '+b.cod+' · '+b.baixa.motivo,auto:true,linhas:[{conta:'1.2.02',d:ac,c:0},{conta:'5.9.04',d:res,c:0},{conta:'1.2.01',d:0,c:b.valor}].filter(l=>l.d>0||l.c>0)})}});return E}

Object.assign(CAN,{pessoas:['adm','gerente','engenheiro','diretoria','gestao'],ponto:['encarregado','engenheiro','gerente','adm','diretoria','gestao'],sst:['adm','engenheiro','gerente','diretoria','gestao']});

function asoDe(colId,data){const L=S.t.ssts.filter(x=>x.col===colId&&x.tipo==='ASO'&&x.emissao<=data).sort((a,b)=>b.validade.localeCompare(a.validade));return L[0]||null}

function pontoValida(r){const c=colPorId(r.col);if(!c)return 'Colaborador não encontrado';if(!r.data||r.data>hojeISO())return 'Data inválida (futura ou vazia)';
  const h=(r.hn||0)+(r.he||0)+(r.hc||0);if(h>24)return 'Mais de 24 horas no dia';if(r.hn<0||r.he<0||r.hc<0)return 'Horas negativas';
  if(SIT_TRAB.includes(r.sit)&&(r.hn||0)+(r.he||0)>0&&!r.item)return 'Informe a frente (item do orçamento) quando há horas';
  if(S.t.ptos.some(p=>p.col===r.col&&p.data===r.data&&(p.item||'')===(r.item||'')))return 'Já existe registro deste colaborador neste dia';
  const outras=S.t.ptos.filter(p=>p.col===r.col&&p.data===r.data);if(outras.some(p=>!SIT_TRAB.includes(p.sit))||(!SIT_TRAB.includes(r.sit)&&outras.length))return 'O colaborador já tem outra situação neste dia';
  if(compFechada(r.data))return 'Competência '+mesDe(r.data)+' fechada';
  if(SIT_TRAB.includes(r.sit)&&sstBloqueia()){const s=asoStatus(r.col,r.data);if(s==='ausente'||s==='vencido')return 'SST: ASO '+(s==='ausente'?'ausente':'vencido')+' para '+c.nome}
  return ''}
function pontoGrava(r){const e=pontoValida(r);if(e)return e;S.t.ptos.push({id:'pt'+Date.now()+Math.random().toString(36).slice(2,5),...r,quem:user()});return ''}

const bancoHoras=id=>r2(S.t.ptos.filter(p=>p.col===id).reduce((s,p)=>s+(p.he||0)-(p.hc||0),0));
function custoPessoal(t){return t?custoPessoalRaw(t):memo('cp',()=>custoPessoalRaw())}
function custoPessoalRaw(t){const T=t||S.t;let tot=0;const porCol={},porFunc={},porItem={};(T.ptos||[]).forEach(p=>{const c=(T.cols||[]).find(x=>x.id===p.col);if(!c)return;const ch=colCusto(c),v=r2((p.hn||0)*ch+(p.he||0)*ch*fatorExtra());
  tot+=v;porCol[c.id]=(porCol[c.id]||0)+v;porFunc[c.funcao]=(porFunc[c.funcao]||0)+v;if(p.item)porItem[p.item]=(porItem[p.item]||0)+v});return {tot:r2(tot),porCol,porFunc,porItem}}
/* "Puxar do ponto" no apontamento do Campo: agrupa por função n pessoas × horas médias do dia/item */
function pontoParaApt(data,item){const g={};S.t.ptos.filter(p=>p.data===data&&p.item===item&&SIT_TRAB.includes(p.sit)&&(p.hn+p.he)>0).forEach(p=>{const c=colPorId(p.col);if(!c)return;const x=g[c.funcao]=g[c.funcao]||{funcao:c.funcao,n:0,h:0,hh:0};x.n++;x.hh+=p.hn+p.he});
  return Object.values(g).map(x=>({funcao:x.funcao,n:x.n,h:r2(x.hh/x.n)}))}

function rhCalc(cod,meses){return memo('rh'+cod+'|'+(meses?[...meses].sort().join(','):''),()=>rhCalcRaw(cod,meses))}
function rhCalcRaw(cod,meses){const F=rhFonte(cod);if(!F)return null;const sel=meses&&meses.size?meses:null,P=F.ptos.filter(p=>!sel||sel.has(mesDe(p.data)));
  const conta={};P.forEach(p=>conta[p.sit]=(conta[p.sit]||0)+1);const n=P.length,den=n-(conta.folga||0)-(conta.ferias||0),abs=SIT_ABS.reduce((s,k)=>s+(conta[k]||0),0);
  const mensal={};P.forEach(p=>{const m=mesDe(p.data),x=mensal[m]=mensal[m]||{m,n:0,folga:0,ferias:0,abs:0,faltas:0,cols:new Set()};x.n++;if(p.sit==='folga')x.folga++;if(p.sit==='ferias')x.ferias++;if(SIT_ABS.includes(p.sit))x.abs++;if(p.sit==='falta')x.faltas++;x.cols.add(p.col)});
  const M=Object.values(mensal).sort((a,b)=>a.m.localeCompare(b.m)).map(x=>{const d=x.n-x.folga-x.ferias;return {m:x.m,abs:d>0?x.abs/d:0,freq:d>0?1-x.abs/d:0,faltas:x.faltas,ativos:x.cols.size,razao:x.cols.size?x.faltas/x.cols.size:0}});
  const ativos=F.cols.filter(c=>c.ativo!==false),efet={};ativos.forEach(c=>{const e=efet[c.funcao]=efet[c.funcao]||{funcao:c.funcao,adm:0,prod:0};if(c.grupo==='Administrativo')e.adm++;else e.prod++});
  return {n,conta,abs:den>0?abs/den:0,freq:den>0?1-abs/den:0,M,efet:Object.values(efet).sort((a,b)=>a.funcao.localeCompare(b.funcao)),totAtivos:ativos.length,meses:[...new Set(F.ptos.map(p=>mesDe(p.data)))].sort()}}

lançamentos daquele mês ficam bloqueados (só a Diretoria reabre).\n- Nota acima da tolerância de 2% sobre o pedido volta para Compras.\n- CPF/CNPJ inválidos ou repetidos são recusados.\n\n## Erros comuns\n- \"O rateio não fecha 100% da nota\": some os valores das linhas.\n", "almoxarife": "# Manual do Almoxarife\n**Seu dia:** receber material, dar saída para as frentes e manter o estoque certo.\n\n## Tarefas\n- **Receber OC** (Suprimentos → Compras → Ordens de compra → Receber): informe a quantidade; se o insumo tem unidade de compra (ex.: BR = 6 m), escolha a unidade e o estoque converte.\n- **Estoque** (Suprimentos → Estoque): saída para a frente (escolha o item do orçamento para apropriar o consumo), entrada avulsa, ajuste (com motivo), transferência para outra obra (copie o código; a outra obra cola em \"Receber transferência\").\n- **Inventário**: abrir (copia o saldo), contar, recontar o que divergiu, importar contagem do coletor (`código;quantidade`) e fechar (gera os ajustes).\n- **Kardex**: botão Ver em cada insumo.\n\n## Regras que bloqueiam\n- Saída maior que o saldo do local é recusada.\n- Ajuste e inventário exigem motivo/contagem completa.\n- O mesmo código de transferência não entra duas vezes.\n\n## Observação\nO custo realizado do item continua vindo da nota fiscal; a saída mostra o **consumo apropriado** só como informação.\n", "compras": "# Manual de Compras e suprimentos\n**Seu dia:** cotar, emitir pedidos, acompanhar entregas e ocorrências.\n\n## Tarefas\n- **Cotar** (Suprimentos → Compras → Solicitações → Mapa de cotação): adicione propostas uma a uma ou **cole o arquivo do fornecedor** (`fornecedor;preço;prazo`). **Sugerir melhor** escolhe o menor preço (empate: menor prazo). Emita a OC.\n- **Ordens de compra**: acompanhe aprovação, recebimento, **Ocorrência** (atraso, avaria, divergência) e **Devolver** (baixa o estoque e registra o crédito).\n- **Necessidade e mín./máx.** (Suprimentos → Estoque → Necessidade): itens com atividade no lookahead sem compra em andamento, e insumos abaixo do mínimo.\n- **Cadastros** (Suprimentos → Cadastros): fornecedores (CNPJ validado), insumos (unidade de compra com fator, mínimo e máximo).\n\n## Regras que bloqueiam\n- Menos de 3 propostas exige justificativa ou marca de emergência (regularizar em 2 dias úteis). Escolher fora da menor também exige justificativa.\n- Semáforo e alçadas: verde até o limite sai sozinho; amarelo e verde acima do limite vão ao Gerente; acima do valor do Gerente ou do teto, à Diretoria. Quem solicitou não aprova a própria OC.\n- Item sem meta ou fora da planilha: bloqueado.\n\n## Erros comuns\n- \"Escolheu fora da menor: justifique\".\n- Preço colado com vírgula decimal: use `1.234,56` ou `1234.56`.\n", "encarregado": "# Manual do Encarregado de campo\n**Seu dia:** abrir Obra → Campo, lançar o apontamento do dia, conferir o ponto e a frota.\n\n## Tarefas\n- **Apontamento** (Obra → Campo → Novo apontamento): escolha a data e o item do orçamento, a quantidade produzida (0 se não produziu), a equipe (função × pessoas × horas) e os equipamentos. Use **Puxar do ponto** para preencher a equipe a partir do ponto do dia. Chuva e parada entram com motivo e horas.\n- **Ponto** (Pessoas → Pessoas e ponto → Ponto → Lançar o dia): para cada colaborador marque a situação (presente, folga, falta, atestado, férias, externo, INSS). Quem está presente conta horas na frente (item) escolhida.\n- **Frota** (Contratos e ativos → Frota): lance abastecimento, leitura do horímetro/km e checklist do dia. Checklist reprovado abre ordem de serviço corretiva sozinho.\n\n## Regras que bloqueiam\n- Não dá para lançar apontamento ou ponto com data futura.\n- **SST:** colaborador com ASO vencido ou ausente não recebe ponto de presença (peça ao Administrativo para registrar o ASO).\n- Leitura de horímetro/km nunca pode ser menor que a anterior.\n- Já existindo apontamento conferido do mesmo item e dia, o sistema recusa outro.\n\n## Erros comuns\n- \"Informe a frente\": presente com horas precisa do item do orçamento.\n- \"Já existe registro deste colaborador neste dia\": edite pelo Administrativo ou use outro item.\n", "engenheiro": "# Manual do Engenheiro residente\n**Seu dia:** acompanhar o Dashboard, aprovar apontamentos, pedir compras, medir produção e subempreiteiros.\n\n## Tarefas\n- **Dashboard** (Início): indicadores com meta, Curva S, funil de compras, estoque e pessoas. \"Escolher o que mostrar\" liga e desliga seções.\n- **Solicitar compra** (Suprimentos → Compras → Nova solicitação): nasce dentro de um item do orçamento. O semáforo compara com a meta e o teto do item.\n- **Aprovar apontamento** (Obra → Campo): confira e aprove os apontamentos conferidos.\n- **Medição** (Obra → Medição e resultado): lance a produção medida; o Gerente atesta; vira boletim ao cliente (BM) no Financeiro.\n- **Medição de subempreiteiro** (Contratos e ativos → Contratos → Nova medição): você lança; Gerente/Diretoria aprova. A aprovação gera a nota do subempreiteiro (com retenção de INSS) e o custo do item.\n- **Projetos** (Contratos e ativos → Projetos): etapas, % concluído e horas apropriadas.\n\n## Regras que bloqueiam\n- Compra acima da meta (amarelo) exige justificativa e vai ao Gerente; acima do teto (vermelho) vai à Diretoria; item sem meta ou fora da planilha é bloqueado.\n- A linha de base precisa estar congelada pela Gestão antes de comprar.\n- Medição de subempreiteiro não passa do valor vigente do contrato; contrato bloqueado não aceita medição.\n\n## Erros comuns\n- \"Excede o valor vigente\": peça aditivo ao Administrativo/Gerente.\n- Medição que você mesmo lançou não pode ser aprovada por você.\n", "financeiro": "# Manual do Financeiro\n**Seu dia:** liberar e pagar, conciliar o extrato, faturar, receber e fechar o mês.\n\n## Tarefas\n- **Pagar** (Financeiro → Pagar e conciliar): notas conferidas → **Liberar** → **Pagar**. **Contas a pagar** permite parcelar, renegociar (com motivo) e agrupar títulos do mesmo fornecedor.\n- **Contas e s, contabilidade) e copia CSV.\n- **Aprovar OCs** (Suprimentos → Compras → Aprovações): amarelo e verde acima do limite → Gerente; vermelho e acima do valor do Gerente → Diretoria. Reprovar exige motivo.\n- **Aprovar medição de subempreiteiro** e atestar medições (Obra → Medição).\n- **Congelar a linha de base** (Gestão/Diretoria) e **Parâmetros** de compras (limite verde, limite do Gerente, tolerância).\n- **Contratos**: aditivos, bloqueio, alertas de vencimento e reajuste.\n- **Reabrir competência** (só Diretoria, com motivo) em Contabilidade → Fechamento.\n- **Administração** (Gestão e administração): grupos, acesso temporário, suplente de aprovador, horário, **alçadas por evento**.\n\n## Regras\n- Ninguém aprova a própria solicitação. Suplente só vale dentro do período cadastrado.\n- Acesso temporário, suplência e horário valem na interface; no banco vale o papel em Usuários.\n", "planejamento": "# Manual de Planejamento\n**Seu dia:** lookahead, restrições, PPC e leitura dos painéis.\n\n## Tarefas\n- **Lean e planejamento** (Obra → Lean): pauta de segunda, lookahead de 6 semanas, restrições com dono e prazo, PPC, tarefas.\n- **Projetos** (Contratos e ativos → Projetos): modelos com etapas, % por etapa, horas apropriadas.\n- **Fluxos e SLA** (Gestão → Fluxos e SLA): inicie modelos (admissão, mobilização, fechamento mensal) que geram tarefas com dono e prazo.\n- **Painéis** e **Dashboard**: Curva S, produção × HH, PPC, desvios.\n\n## Regras\n- Atividade só entra no lookahead ligada a um item do orçamento. Restrição sem dono ou prazo é recusada.\n"};

const KPI_KEYS=['provProd','provServ','contrato','fat','faturadoAnt','recebido','aReceber','atrRec','fatDireto','impDeb','impCred','pago','aPagar','atrasado','gasto','requisicao','custoFixo','cfPrev','prov','provTot','saldoFat','comprom','lucroPainel','lucroPrev'];

const cadDe=(cod,t)=>{const f=typeof cadFichaDe==='function'?cadFichaDe(cod,t):{},r=f.resp||{};
  return {empresa:EMPRESA_PAD,gerente:(r.gerente&&r.gerente.nome)||'',vendedor:(r.vendedor&&r.vendedor.nome)||'',tipo:f.tipo||'',situacao:f.situacao||'',...(CAD_PAD[cod]||{}),...(((t||{}).par||{}).cad||{})}};

/* ---------- estado de cada obra e extrato importado ---------- */
function lerT(cod){if(S.D&&S.D.obra.codigo===cod)return S.t;if(MODO_CH)return CH.T[cod]||null;if(MODO_SB)return null;
  return memo('lt'+cod,()=>{try{return JSON.parse(localStorage.getItem(cod==='342'?KEY:KEY+'_'+cod)||'null')}catch(e){return null}})}
function tEf(cod){const t=lerT(cod);if(t)return {...novoT(),...t};return memo('te'+cod,()=>{const n=novoT(),ex=S.extr&&S.extr[cod];if(ex)aplicaExtrato(n,ex);return n})}
async function extratoDe(cod){S.extr=S.extr||{};if(cod in S.extr)return S.extr[cod];return S.extr[cod]=(window.TAF_EXTRATO&&window.TAF_EXTRATO[cod])||null}
function aplicaExtrato(t,ex){const lote='extrato-'+ex.obra;t.lfxs=(t.lfxs||[]).filter(l=>l.lote!==lote);
  ex.nat.forEach((n,i)=>t.lfxs.push({id:'nat-'+ex.obra+'-'+i,tipo:'nat',origem:'Importado',lote,corte:ex.corte,...n}));
  (ex.lanc||[]).forEach((l,i)=>t.lfxs.push({id:'lan-'+ex.obra+'-'+i,tipo:'gasto',detalhe:true,origem:'Importado',lote,forn:l.parceiro,numero:l.nota,desc:l.topDesc,venc:l.venc,valor:l.valorNota,pago:l.dtBaixa,
    origemTxt:l.origem,rd:l.rd,provTxt:l.prov,nota:l.nota,empresa:l.empresa,parceiro:l.parceiro,desdob:l.desdob,valorNota:l.valorNota,dtNeg:l.dtNeg,dtBaixa:l.dtBaixa,vendComp:l.vendComp,top:l.top,topDesc:l.topDesc,tipoMov:l.tipoMov,natCod:l.natCod||''}));
  t.par=t.par||{};t.par.extratoCorte=ex.corte}
async function seedExtrato(){const cod=S.D.obra.codigo,ex=await extratoDe(cod);if(!ex||S.t.par.extratoSeed)return;
  aplicaExtrato(S.t,ex);S.t.par.extratoSeed=true;log('extrato',cod,'importar','',ex.nat.length+' naturezas, '+(ex.lanc||[]).length+' lançamentos (corte '+ex.corte+')');save()}
const provOcsSplit=t=>{const r={prod:0,serv:0};(t.ocs||[]).filter(o=>['aprovada','recebida_parcial','recebida'].includes(o.status)).forEach(o=>{const f=(t.notas||[]).filter(n=>n.oc===o.id&&n.status!=='lancada').reduce((a,n)=>a+n.rateio.filter(l=>l.item===o.item).reduce((b,l)=>b+ +l.valor,0),0),v=Math.max(0,o.valor-f);if(['MO','EQP','TER'].includes(o.nat))r.serv+=v;else r.prod+=v});r.prod=r2(r.prod);r.serv=r2(r.serv);return r};
const provOcs=t=>r2((t.ocs||[]).filter(o=>['aprovada','recebida_parcial','recebida'].includes(o.status)).reduce((s,o)=>{const f=(t.notas||[]).filter(n=>n.oc===o.id&&n.status!=='lancada').reduce((a,n)=>a+n.rateio.filter(l=>l.item===o.item).reduce((b,l)=>b+ +l.valor,0),0);return s+Math.max(0,o.valor-f)},0));
/* roda uma função "como se" a obra de outro estado estivesse aberta (sem tocar em nada que fica gravado) */
function comObra(t,O,fn){const pv=provLigada(),sv={t:S.t,D:S.D,X:S.X,m:S.memo,p:S.provTmp};S.provTmp=pv;S.t=t;S.D={obra:O,items:[]};S.X={venda:O.valor_contrato,comp:provOcs(t)};S.memo=null;
  try{return fn()}finally{S.t=sv.t;S.D=sv.D;S.X=sv.X;S.memo=sv.m;S.provTmp=sv.p}}
function kpisObra(cod){if(S.D&&S.D.obra.codigo===cod)return painelCalc();const c=S.cart&&S.cart[cod];if(!c||!c.obra)return null;return memo('ko'+cod,()=>comObra(tEf(cod),c.obra,painelCalcRaw))}
function somaObras(cods){const T={};KPI_KEYS.forEach(k=>T[k]=0);cods.forEach(c=>{const k=kpisObra(c);if(k)KPI_KEYS.forEach(x=>T[x]=r2(T[x]+(+k[x]||0)))});return T}
